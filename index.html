<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voi en Europe — Nos pays</title>
<meta name="description" content="Trouvez les vélos et trottinettes électriques Voi dans votre pays et votre ville : carte interactive des villes desservies en Europe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F26A5E; --coral-d:#D9564B; --coral-l:#FFE4DF;
    --ink:#1B1716; --ink-2:#4A4240; --mute:#857B78;
    --cream:#FFF8F4; --card:#FFFFFF; --line:#EFE3DE;
    --mint:#DDF3EA; --mint-ink:#1F6B52;
    --sky:#E3EEFF; --sky-ink:#244C8F;
    --sea:#EAF2F5; --land:#F6E9E3; --land-on:#FFD3CC;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.wordmark{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  header.top{position:sticky;top:0;z-index:20;background:rgba(255,248,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .wordmark{font-size:30px;font-weight:800;text-decoration:none;color:var(--ink)}
  .wordmark span{color:var(--coral)}
  nav.top{display:flex;align-items:center}
  nav.top a{font-weight:500;text-decoration:none;margin-left:22px;color:var(--ink-2)}
  nav.top a.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--coral)}
  nav.top a:hover{color:var(--coral-d)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;font-size:15px;font-family:inherit}
  .btn.coral{background:var(--coral);color:#fff}
  .btn.coral:hover{background:var(--coral-d)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

  .hero{padding:64px 0 28px}
  .eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-d);margin-bottom:14px}
  .hero h1{font-size:clamp(40px,6vw,76px);font-weight:800;max-width:15ch}
  .hero h1 em{font-style:normal;color:var(--coral)}
  .hero p.lead{font-size:19px;color:var(--ink-2);max-width:58ch;margin:20px 0 0}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
  .stat b{display:block;font-family:"Bricolage Grotesque";font-size:32px;font-weight:800}
  .stat span{color:var(--mute);font-size:14px}

  /* map */
  .mapcard{background:var(--sea);border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
  .mapcard{height:clamp(600px, 82vh, 900px)}
  /* the map library writes its own size on the map element: force it to fill the card */
  #map,#map.map{position:absolute !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;height:100% !important;display:block}
  .map svg{display:block}
  /* the map breaks out of the text column: wide on large screens */
  #mapslot{width:min(calc(100vw - 40px), 1500px);margin-left:calc(50% - min(calc(50vw - 20px), 750px))}
  .map.small{height:440px}
  .maplegend{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:3}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff;box-shadow:0 0 0 1px var(--coral-d);vertical-align:-1px;margin-right:6px}
  .maphint{position:absolute;right:16px;top:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);z-index:3}
  /* jsvectormap essentials (its stylesheet cannot load here) */
  .jvm-container{position:relative;overflow:hidden;touch-action:none;height:100%;width:100%}
  #map>svg,.jvm-container>svg{display:block}
  .jvm-tooltip{position:absolute;display:none;z-index:999;background:var(--ink);color:#fff;font:600 13px "DM Sans",sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .jvm-tooltip.active{display:block}
  .jvm-zoom-btn{position:absolute;left:14px;width:32px;height:32px;border-radius:10px;background:#fff;color:var(--ink);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font:700 18px/1 "DM Sans";z-index:3;user-select:none}
  .jvm-zoom-btn.jvm-zoomin{top:14px}
  .jvm-zoom-btn.jvm-zoomout{top:52px}
  .jvm-zoom-btn:hover{border-color:var(--coral);color:var(--coral-d)}
  .jvm-region{transition:fill .15s}
  .jvm-marker,.jvm-element{cursor:pointer}
  /* automatic name labels on the map */
  .maplabels{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;transition:opacity .2s ease}
  .maplabels.hide{opacity:0}
  .mlabel{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .15s}
  .mlabel.city{background:#B8372C;color:#fff;font:700 13.5px "DM Sans",sans-serif;padding:5px 10px;border-radius:8px;margin-top:-14px;box-shadow:0 6px 14px -6px rgba(94,26,20,.6)}
  .mlabel.city::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:#B8372C}
  .mlabel.country{transform:translate(-50%,0);font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5E1A14;opacity:.75;text-shadow:0 0 4px #fff,0 0 8px #fff,0 0 2px #fff}
  /* fallback map */
  .fallback{position:relative;height:100%;background:radial-gradient(circle at 30% 30%,#fff 0,var(--sea) 70%)}
  .fallback svg{width:100%;height:100%}

  /* country grid */
  .sec-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:52px 0 18px;flex-wrap:wrap}
  .sec-title h2{font-size:36px;font-weight:800}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{position:relative;min-width:280px}
  .search input{width:100%;font:inherit;font-size:15.5px;padding:12px 16px 12px 42px;border-radius:999px;border:1.5px solid var(--line);background:#fff;outline:none}
  .search input:focus{border-color:var(--coral)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:20px}
  .country{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .country:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(70,30,20,.35)}
  .country .flag{font-size:30px;line-height:1}
  .country h3{font-size:24px;font-weight:800;margin:10px 0 4px}
  .country .count{color:var(--coral-d);font-weight:700;font-size:14px}
  .country p{color:var(--ink-2);font-size:14.5px;margin:10px 0 0;flex:1}
  .country .match{margin-top:10px;font-size:13.5px;background:var(--coral-l);color:var(--coral-d);padding:5px 10px;border-radius:999px;align-self:flex-start;font-weight:700}
  .empty{display:none;padding:30px;text-align:center;color:var(--mute)}

  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .tag.bike{background:var(--mint);color:var(--mint-ink)}
  .tag.scoot{background:var(--sky);color:var(--sky-ink)}
  .tag.new{background:var(--coral);color:#fff}
  .tag.soon{background:#FFF0C7;color:#7A5A00}

  /* country page */
  .crumbs{padding:28px 0 0;font-size:14px;color:var(--mute)}
  .crumbs a{color:var(--mute)}
  .phead{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:22px 0 30px;flex-wrap:wrap}
  .phead h1{font-size:clamp(42px,6.5vw,80px);font-weight:800}
  .phead h1 .flag{font-size:.7em;margin-right:12px;vertical-align:.08em}
  .phead .lead{font-size:18px;color:var(--ink-2);max-width:60ch;margin:16px 0 0}
  .pstats{display:flex;gap:12px;flex-wrap:wrap}
  .pstat{background:var(--coral);color:#fff;border-radius:18px;padding:14px 18px;min-width:130px}
  .pstat b{display:block;font-family:"Bricolage Grotesque";font-size:30px;font-weight:800;line-height:1.1}
  .pstat span{font-size:13.5px;opacity:.92}
  .pstat.alt{background:var(--ink)}

  .split{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .clist{background:#fff;border:1px solid var(--line);border-radius:24px;padding:8px;max-height:520px;overflow:auto}
  .citem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;text-decoration:none;cursor:pointer;border:1.5px solid transparent}
  .citem:hover,.citem.on{background:var(--coral-l)}
  .citem.on{border-color:var(--coral)}
  .citem .pin{flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:2px}
  .citem b{display:block;font-size:16px}
  .citem small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4;margin-top:2px}
  .citem .tags{margin:6px 0 0}
  .citem .tag{font-size:11.5px;padding:3px 8px}
  .citem .go{font-size:13px;font-weight:700;color:var(--coral-d);margin-top:4px;display:inline-block}
  .clist.wide{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px;padding:10px;margin-top:16px}
  .clist.wide h4{grid-column:1/-1}
  .clist h4{margin:10px 14px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}

  section.block{padding:44px 0;border-top:1px solid var(--line);margin-top:44px}
  section.block h2{font-size:32px;font-weight:800;margin-bottom:20px}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .card h3{font-size:20px;margin-bottom:8px}
  .card p{margin:0;color:var(--ink-2);font-size:15px}
  .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--coral-l);color:var(--coral-d);font-weight:800;margin-bottom:12px}
  .others{display:flex;gap:10px;flex-wrap:wrap}
  .others a{text-decoration:none;background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:500}
  .others a:hover{border-color:var(--coral);color:var(--coral-d)}
  .appband{background:var(--ink);color:#fff;border-radius:28px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin:44px 0 70px}
  .appband h2{font-size:34px}
  .appband p{color:#CFC6C3;margin:8px 0 0}
  .store{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;padding:12px 18px;border-radius:14px}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap}
  .note{font-size:14px;color:var(--mute);margin-top:14px}

  /* France city page (reused) */
  .chero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end;padding:28px 0 44px}
  .chero h1{font-size:clamp(42px,6.5vw,84px);font-weight:800}
  .chero h1 small{display:block;font-size:.32em;font-weight:600;color:var(--coral-d);letter-spacing:0;margin-bottom:10px;font-family:"DM Sans"}
  .chero .lead{font-size:18px;color:var(--ink-2);margin:18px 0 24px}
  .figure{background:var(--coral);border-radius:28px;padding:30px;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .figure .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:64px;line-height:1}
  .figure .lbl{opacity:.9;font-weight:500}
  .figure svg{position:absolute;right:-10px;bottom:-14px;opacity:.22}
  .figure .row{display:flex;gap:28px;position:relative}
  .communes{display:flex;flex-wrap:wrap;gap:8px}
  .communes span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px}
  .communes span.hl{border-color:var(--coral);color:var(--coral-d);font-weight:700}
  table.prices{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  table.prices td,table.prices th{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:15.5px}
  table.prices th{background:#FBF1EC;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
  table.prices td:last-child{font-weight:700;white-space:nowrap}
  .highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .hl-item{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .hl-item .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--coral-l);display:grid;place-items:center;font-size:20px}
  .hl-item b{display:block;margin-bottom:3px}
  .hl-item p{margin:0;color:var(--ink-2);font-size:15px}
  details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px}
  summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  summary::after{content:"+";color:var(--coral-d);font-size:22px;line-height:1}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;color:var(--ink-2)}
  footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--mute);font-size:13.5px}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .split,.chero{grid-template-columns:1fr}
    .cols,.highlights{grid-template-columns:1fr}
    .mapcard{height:74vh;min-height:460px}
    nav.top a.hide-m{display:none}
    .appband{padding:28px}
    .clist{max-height:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="wordmark" href="#pays">voi<span>.</span></a>
    <nav class="top">
      <a href="#pays" class="on" id="nav-pays">Nos pays</a>
      <a class="hide-m" href="#france">France</a>

  {

const VIEW={ target:{type:"europe"}, sel:-1, country:null, onCountryPick:null };
let mapStarted=false, mapReady=false, fallbackMode=false;

function mountMap(slot){ slot.appendChild(MAPCARD); if(!mapStarted){ mapStarted=true; initMap(); } else fitMapToBox(); }

async function initMap(){
  const ok=await LIB;
  if(!ok || typeof jsVectorMap==="undefined"){ fallbackMode=true; mapReady=true; return applyView(false); }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));  /* wait for final layout */
  createMap();
}
let __builtW=0, __builtH=0;
function createMap(){
  try{ cancelAnimationFrame(__anim); __gliding=false; }catch(e){}
  try{ currentMap && currentMap.destroy && currentMap.destroy(); }catch(e){}
  document.querySelectorAll(".jvm-tooltip").forEach(x=>x.remove());
  MAPEL.innerHTML="";
  __builtW=MAPEL.clientWidth; __builtH=MAPEL.clientHeight;
  try{
    currentMap=new jsVectorMap({
      selector: MAPEL, map:"world", backgroundColor:"transparent",
      zoomButtons:true, zoomOnScroll:false, zoomMax:80, zoomAnimate:true,
      regionsSelectable:false, markersSelectable:false,
      selectedRegions: COUNTRIES.map(c=>c.code),
      regionStyle:{
        initial:{fill:"#F3E3DC", stroke:"#ffffff", strokeWidth:.4, fillOpacity:1},
        hover:{fillOpacity:.85, cursor:"pointer"},
        selected:{fill:"#FFC9C0"}
      },
      markers: ALL.map(m=>({name:m.name, coords:[m.lat,m.lng]})),
      markerStyle:{
        initial:{fill:"#F26A5E", stroke:"#ffffff", strokeWidth:2, r:6},
        hover:{fill:"#D9564B", cursor:"pointer"}
      },
      onRegionTooltipShow(event, tooltip, code){
        const c=COUNTRIES.find(x=>x.code===code);
        if(!c){ event.preventDefault && event.preventDefault(); return; }
        tooltip.text && tooltip.text(`${c.flag} ${c.name} · ${c.cities.length}${c.more?"+":""} villes`);
      },
      onRegionClick(e, code){
        const c=COUNTRIES.find(x=>x.code===code);
        if(c && location.hash!=="#"+c.id) location.hash=c.id;
      },
      onMarkerClick(e, g){ handleMarker(+g); },
      onViewportChange(){ labelsWhileMoving(); }
    });
    mapReady=true;
    applyView(false);   /* first display: straight to the right place, no animation */
  }catch(err){ fallbackMode=true; mapReady=true; applyView(false); }
}

/* Move the map to VIEW.target. One single zoom from wherever the map currently is. */
function applyView(animate){
  if(!mapReady) return;
  if(fallbackMode){ drawFallback(); return placeLabels(); }
  paintSelection();
  const t=VIEW.target;
  const cfg = t.type==="city" ? {coords:t.coords, scale:CITY_SCALE}
            : t.type==="country" ? (countryCfg(VIEW.country) || {regions:[t.code]})
            : {regions: EUROPE};
  LABELS.classList.add("hide");
  clearTimeout(__lblTimer);
  const showLabels=()=>{ clearTimeout(__lblTimer); __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); }, 40); };
  if(animate && glideTo(cfg, showLabels)) return;
  try{ currentMap.setFocus(Object.assign(cfg,{animate:!!animate})); }
  catch(e){ try{ currentMap.setFocus(cfg); }catch(_){} }
  __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); }, animate?700:80);
}

/* Frame a country on its Voi cities (not on its whole territory: the "FR" shape
   also contains overseas departments, which pulled the view far to the side). */
function countryCfg(c){
  const m=currentMap; if(!m || !c) return null;
  const base=m._baseScale || m.baseScale;
  if(!base || typeof m.scale!=="number") return null;
  const nodes=markerNodes(); if(nodes.length!==ALL.length) return null;
  const by=(f,dir)=>ALL.reduce((best,x,i)=> best<0 || (dir*(f(x)-f(ALL[best]))>0) ? i : best, -1);
  const iW=by(x=>x.lng,-1), iE=by(x=>x.lng,1), iS=by(x=>x.lat,-1), iN=by(x=>x.lat,1);
  const R=i=>nodes[i].getBoundingClientRect();
  const kx=(R(iE).left-R(iW).left)/(ALL[iE].lng-ALL[iW].lng)/m.scale;
  const ky=(R(iS).top-R(iN).top)/(ALL[iN].lat-ALL[iS].lat)/m.scale;
  if(!(kx>0) || !(ky>0)) return null;
  const la=c.cities.map(x=>x.lat), lo=c.cities.map(x=>x.lng);
  const minLa=Math.min(...la), maxLa=Math.max(...la), minLo=Math.min(...lo), maxLo=Math.max(...lo);
  const W=MAPEL.clientWidth, H=MAPEL.clientHeight;
  const spanLo=Math.max(maxLo-minLo, 1.6), spanLa=Math.max(maxLa-minLa, 1.0);
  const sAbs=Math.min(W*0.72/(spanLo*kx), H*0.62/(spanLa*ky));
  const rel=Math.min(sAbs/base, CITY_SCALE*0.8);
  return {coords:[(minLa+maxLa)/2, (minLo+maxLo)/2], scale:rel};
}

/* Keep the framing right if the map box changes size (fonts, window, mobile rotation) */
if(typeof ResizeObserver!=="undefined"){
  let lastW=0, lastH=0, rT=null;
  new ResizeObserver(()=>{
    const w=MAPEL.clientWidth, h=MAPEL.clientHeight;
    if(!w || !h || (w===lastW && h===lastH)) return; lastW=w; lastH=h;
    clearTimeout(rT); rT=setTimeout(fitMapToBox, 120);
  }).observe(MAPEL);
}
/* Make the drawing fill the whole map box (the library only measures its box on window resize) */
/* The map library measures its box only once: whenever the box size differs from
   the size the map was drawn at, redraw it at the right size, at the same place. */
function fitMapToBox(){
  if(!currentMap || fallbackMode) return;
  const w=MAPEL.clientWidth, h=MAPEL.clientHeight;
  if(!w || !h) return;
  if(Math.abs(w-__builtW)>2 || Math.abs(h-__builtH)>2) createMap();
}

/* Smooth camera move: eased glide (and zoom if needed) from the current view to the target,
   drawn frame by frame. Between two nearby cities it is a pure slide at the same zoom. */
let __anim=null, __gliding=false;
function glideTo(cfg, done){
  const m=currentMap;
  if(!m || typeof m._applyTransform!=="function" || typeof m.scale!=="number") return false;
  const W=MAPEL.clientWidth, H=MAPEL.clientHeight; if(!W||!H) return false;
  cancelAnimationFrame(__anim);
  const s0=m.scale, x0=m.transX, y0=m.transY;
  try{ m.setFocus(Object.assign({},cfg,{animate:false})); }catch(e){ return false; }
  const s1=m.scale, x1=m.transX, y1=m.transY;
  const set=(s,x,y)=>{ m.scale=s; m.transX=x; m.transY=y; m._applyTransform(); };
  set(s0,x0,y0);
  const c0x=W/(2*s0)-x0, c0y=H/(2*s0)-y0, c1x=W/(2*s1)-x1, c1y=H/(2*s1)-y1;
  const zoomChange=Math.abs(Math.log(s1/s0));
  const dist=Math.hypot((c1x-c0x)*s0,(c1y-c0y)*s0);            /* on-screen distance in px */
  const dur=Math.min(1300, 550 + zoomChange*170 + Math.min(dist,1500)*0.12);
  const ease=p=>p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
  const t0=performance.now(); __gliding=true;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    const s=s0*Math.pow(s1/s0,e);
    const cx=c0x+(c1x-c0x)*e, cy=c0y+(c1y-c0y)*e;
    set(s, W/(2*s)-cx, H/(2*s)-cy);
    if(p<1) __anim=requestAnimationFrame(step);
    else { set(s1,x1,y1); __gliding=false; paintSelection(); done&&done(); }
  };
  __anim=requestAnimationFrame(step);
  return true;
}
function goTo(target, sel, country, animate){
  VIEW.target=target; VIEW.sel=(sel==null?-1:sel); VIEW.country=country||null;
  applyView(animate && mapReady);
}

function handleMarker(g){
  const m=ALL[g]; if(!m) return;
  if(m.link){ if(location.hash!==m.link) location.hash=m.link.slice(1); return; }
  if(VIEW.onCountryPick && VIEW.country===m.country){ VIEW.onCountryPick(m.j); return; }
  window.__pendingCity=m.name; location.hash=m.country.id;
}

function markerNodes(){
  let n=[...MAPEL.querySelectorAll("circle.jvm-marker, circle[data-index]")];
  n=[...new Set(n)];
  if(n.length && n[0].hasAttribute("data-index")) n.sort((p,q)=>(+p.getAttribute("data-index"))-(+q.getAttribute("data-index")));
  return n;
}
function paintSelection(){
  markerNodes().forEach((n,i)=>{
    const s=i===VIEW.sel;
    n.setAttribute("fill", s?"#B8372C":"#F26A5E"); n.style.fill = s?"#B8372C":"";
    n.setAttribute("stroke", s?"#5E1A14":"#ffffff"); n.style.stroke = s?"#5E1A14":"";
    n.setAttribute("stroke-width", s?2.5:2); n.setAttribute("r", s?7.5:6);
  });
}

/* names written on the map */
let __lblTimer=null;
function labelsWhileMoving(){
  if(__gliding) return;
  LABELS.classList.add("hide");
  clearTimeout(__lblTimer);
  __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); }, 180);
}
function placeLabels(){
  if(!document.body.contains(MAPCARD)) return;
  const base=LABELS.getBoundingClientRect();
  const nodes = fallbackMode ? [...MAPEL.querySelectorAll(".fb circle")] : markerNodes();
  const idx = fallbackMode ? (MAPEL.__fbIdx||[]) : ALL.map((_,i)=>i);
  const pos = g => { const k=idx.indexOf(g); const n=nodes[k]; if(!n) return null; const r=n.getBoundingClientRect(); return {x:r.left+r.width/2-base.left, y:r.top+r.height/2-base.top, top:r.top-base.top, bottom:r.bottom-base.top}; };
  let html="";
  if(VIEW.country){
    const pts=VIEW.country.cities.map(ct=>pos(ct.g)).filter(Boolean).filter(p=>p.x>-40&&p.x<base.width+40&&p.y>-40&&p.y<base.height+40);
    if(pts.length){
      const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length;
      const y=Math.min(Math.max(...pts.map(p=>p.bottom))+16, base.height-40);
      html+=`<div class="mlabel country" style="left:${Math.min(Math.max(cx,90),base.width-90)}px;top:${y}px">${esc(VIEW.country.name)}</div>`;
    }
  }
  if(VIEW.sel>=0){
    const p=pos(VIEW.sel);
    if(p) html+=`<div class="mlabel city" style="left:${p.x}px;top:${p.top}px">${esc(ALL[VIEW.sel].name)}</div>`;
  }
  LABELS.innerHTML=html;
}
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ fitMapToBox(); placeLabels(); },150); });

/* fallback (map library unavailable): simple projected dot map of the current view */
function drawFallback(){
  const list = VIEW.country ? VIEW.country.cities.map(c=>c.g) : ALL.map((_,i)=>i);
  MAPEL.__fbIdx=list;
  const markers=list.map(g=>ALL[g]);
  const lats=markers.map(m=>m.lat), lngs=markers.map(m=>m.lng);
  let minLa=Math.min(...lats), maxLa=Math.max(...lats), minLo=Math.min(...lngs), maxLo=Math.max(...lngs);
  const padLa=Math.max(.6,(maxLa-minLa)*.15), padLo=Math.max(.9,(maxLo-minLo)*.15);
  minLa-=padLa;maxLa+=padLa;minLo-=padLo;maxLo+=padLo;
  const W=1000,H=600, k=Math.cos((minLa+maxLa)/2*Math.PI/180);
  const s=Math.min(W/((maxLo-minLo)*k), H/(maxLa-minLa));
  const ox=(W-(maxLo-minLo)*k*s)/2, oy=(H-(maxLa-minLa)*s)/2;
  MAPEL.innerHTML=`<div class="fallback"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${
    markers.map((m,i)=>{const x=ox+(m.lng-minLo)*k*s, y=oy+(maxLa-m.lat)*s, on=list[i]===VIEW.sel;
      return `<g class="fb" data-g="${list[i]}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?10:9}" fill="${on?"#B8372C":"#F26A5E"}" stroke="${on?"#5E1A14":"#fff"}" stroke-width="3"/>${on?"":`<text x="${x+13}" y="${y+5}" font-family="DM Sans" font-size="17" font-weight="600" fill="#1B1716">${esc(m.name)}</text>`}</g>`}).join("")
  }</svg></div>`;
  MAPEL.querySelectorAll(".fb").forEach(gr=>gr.addEventListener("click",()=>handleMarker(+gr.dataset.g)));
}

function scrollToMap(behavior){
  if(!document.body.contains(MAPCARD)) return;
  const y=MAPCARD.getBoundingClientRect().top + window.scrollY - 80;
  window.scrollTo({top:Math.max(0,y), behavior: behavior||"smooth"});
}
function mapOnScreen(){
  const r=MAPCARD.getBoundingClientRect();
  return r.top>=40 && r.bottom<=window.innerHeight+40;
}

let query="";
function renderHub(){
  document.title="Voi en Europe — Nos pays";
  $app.innerHTML=`
  <div class="wrap">
    <section class="hero">
      <span class="eyebrow">Voi en Europe</span>
      <h1>Dans quels pays rouler avec <em>Voi</em> ?</h1>
      <p class="lead">Vélos et trottinettes électriques en libre-service dans plus de 130 villes européennes. Choisissez un pays sur la carte ou dans la liste pour voir les villes desservies.</p>
      <div class="stats">
        <div class="stat"><b>${COUNTRIES.length}</b><span>pays présentés</span></div>
        <div class="stat"><b>130+</b><span>villes en Europe</span></div>
        <div class="stat"><b>200 000+</b><span>véhicules</span></div>
        <div class="stat"><b>500 M+</b><span>trajets effectués</span></div>
      </div>
    </section>
    <div id="mapslot"></div>
    <div class="sec-title"><h2>Nos pays</h2>
      <div class="tools"><label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Pays ou ville (ex. Munich, Rezé…)" value="${esc(query)}" aria-label="Rechercher un pays ou une ville"></label></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">Voi n'est pas encore présent ici. Ouvrez l'application pour vérifier la couverture autour de vous.</div>
    ${howBlock()}
    ${appBand()}
  </div>`;
  drawGrid();
  document.getElementById("q").addEventListener("input",e=>{query=e.target.value;drawGrid();});
  mountMap(document.getElementById("mapslot"));
  VIEW.onCountryPick=null;
  goTo({type:"europe"}, -1, null, true);
}
function drawGrid(){
  const nq=norm(query.trim());
  const list=COUNTRIES.map(c=>{
    if(!nq) return {c};
    if(norm(c.name).includes(nq)) return {c};
    let hit=c.cities.find(x=>norm(x.name).includes(nq));
    if(!hit && c.id==="france"){
      const z=CITIES.flatMap(x=>x.zone).find(z=>!z.startsWith("+") && z!=="…" && norm(z).includes(nq));
      if(z) hit={name:z};
    }
    return hit?{c,hit}:null;
  }).filter(Boolean);
  document.getElementById("grid").innerHTML=list.map(({c,hit})=>`
    <a class="country" href="#${c.id}">
      <span class="flag">${c.flag}</span>
      <h3>${esc(c.name)}</h3>
      <span class="count">${c.cities.length}${c.more?"+":""} ${c.id==="france"?"territoires":"villes"}${c.volume?` · ${c.volume} véhicules`:""}</span>
      <p>${esc(c.intro)}</p>
      ${hit?`<span class="match">✓ ${esc(hit.name)}</span>`:""}
    </a>`).join("");
  document.getElementById("empty").style.display=list.length?"none":"block";
}

function renderCountry(c){
  document.title=`Voi ${c.prep} ${c.name} — villes desservies | Voi`;
  const isFR=c.id==="france";
  const others=COUNTRIES.filter(x=>x.id!==c.id);
  $app.innerHTML=`
  <div class="wrap">
    <div class="crumbs"><a href="#pays">Nos pays</a> / ${esc(c.name)}</div>
    <section class="phead">
      <div>
        <h1><span class="flag">${c.flag}</span>Voi ${c.prep} ${esc(c.name)}</h1>
        <p class="lead">${esc(c.intro)}</p>
      </div>
      <div class="pstats">${(c.volume?[[c.volume,"véhicules (estimation)"]]:[]).concat(c.stats).map((s,i)=>`<div class="pstat ${i%2?"alt":""}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>
    </section>
    <div id="mapslot"></div>
      <div class="clist wide" id="clist">
        <h4>${c.cities.length}${c.more?"+":""} ${isFR?"territoires":"villes"} desservi${isFR?"s":"es"}</h4>
        ${c.cities.map((ct,i)=>`
          <div class="citem" data-i="${i}" ${ct.link?`data-href="${ct.link}"`:""}>
            <span class="pin">${i+1}</span>
            <div><b>${esc(ct.name)}</b>
              ${ct.note?`<small>${esc(ct.note)}</small>`:""}
              <div class="tags">${modeTags(ct.m,ct.isNew)}</div>
              ${ct.link?`<a class="go" href="${ct.link}">Voir la page ville →</a>`:""}
            </div>
          </div>`).join("")}
        ${c.more?`<p class="note" style="margin:8px 14px 12px">${esc(c.more)}</p>`:""}
      </div>
    ${howBlock()}
    <section class="block"><h2>Voi dans d'autres pays</h2>
      <div class="others">${others.map(o=>`<a href="#${o.id}">${o.flag} ${esc(o.name)}</a>`).join("")}</div>
    </section>
    ${appBand(c.prep+" "+c.name)}
  </div>`;
  const items=[...document.querySelectorAll(".citem")];
  const mark=i=>items.forEach(x=>x.classList.toggle("on",+x.dataset.i===i));
  const pick=i=>{
    mark(i);
    const ct=c.cities[i];
    const go=()=>goTo({type:"city", coords:[ct.lat,ct.lng]}, ct.g, c, true);
    if(mapOnScreen()) go(); else { scrollToMap(); setTimeout(go, 420); }
  };
  VIEW.onCountryPick=pick;
  items.forEach(it=>it.addEventListener("click",e=>{ if(e.target.closest("a")) return; pick(+it.dataset.i); }));
  mountMap(document.getElementById("mapslot"));
  const pend=c.cities.findIndex(x=>x.name===window.__pendingCity); window.__pendingCity=null;
  if(pend>=0){ mark(pend); const ct=c.cities[pend]; goTo({type:"city", coords:[ct.lat,ct.lng]}, ct.g, c, true); }
  else goTo({type:"country", code:c.code}, -1, c, true);
}

      ${c.prices.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join("")}
      </tbody></table><p class="note">Tarifs indicatifs, susceptibles d'évoluer. Le prix exact s'affiche dans l'application avant chaque trajet.</p></section>`
    :`<section class="block" style="margin-top:0"><h2>Tarifs</h2><p style="color:var(--ink-2);max-width:60ch">Paiement à la minute, pass journaliers ou abonnements mensuels : les formules disponibles à ${esc(c.name)} et leur prix s'affichent dans l'application avant chaque trajet.</p></section>`}
    ${howBlock()}
    <section class="block" style="margin-top:0"><h2>Questions fréquentes</h2>
      ${c.faq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")}
    </section>
    <section class="block" style="margin-top:0"><h2>Voi ailleurs en France</h2>
      <div class="others">${others.map(o=>`<a href="#${o.id}">${esc(o.name)}</a>`).join("")}</div>
    </section>
    ${appBand("à "+c.name)}
  </div>`;
  const ct = FR.cities.find(x=>x.link==="#"+c.id);
  VIEW.onCountryPick=null;
  mountMap(document.getElementById("mapslot"));
  goTo({type:"city", coords:[ct.lat,ct.lng]}, ct.g, FR, true);
}

/* ---------------- ROUTER ---------------- */
function route(){
  const id=(location.hash||"").slice(1);
  const country=COUNTRIES.find(x=>x.id===id);
  const city=CITIES.find(x=>x.id===id);
  if(country) renderCountry(country);
  else if(city) renderCity(city);
  else renderHub();
  document.getElementById("nav-pays").classList.toggle("on", !city);
  if(country || city) scrollToMap("auto");
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
