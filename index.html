<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voi en Europe — Nos pays</title>
<meta name="description" content="Trouvez les vélos et trottinettes électriques Voi dans votre pays et votre ville : carte interactive des villes desservies en Europe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F26A5E; --coral-d:#D9564B; --coral-l:#FFE4DF;
    --ink:#1B1716; --ink-2:#4A4240; --mute:#857B78;
    --cream:#FFF8F4; --card:#FFFFFF; --line:#EFE3DE;
    --mint:#DDF3EA; --mint-ink:#1F6B52;
    --sky:#E3EEFF; --sky-ink:#244C8F;
    --sea:#EAF2F5; --land:#F6E9E3; --land-on:#FFD3CC;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.wordmark{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  header.top{position:sticky;top:0;z-index:20;background:rgba(255,248,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .wordmark{font-size:30px;font-weight:800;text-decoration:none;color:var(--ink)}
  .wordmark span{color:var(--coral)}
  nav.top{display:flex;align-items:center}
  nav.top a{font-weight:500;text-decoration:none;margin-left:22px;color:var(--ink-2)}
  nav.top a.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--coral)}
  nav.top a:hover{color:var(--coral-d)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;font-size:15px;font-family:inherit}
  .btn.coral{background:var(--coral);color:#fff}
  .btn.coral:hover{background:var(--coral-d)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

  .hero{padding:64px 0 28px}
  .eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-d);margin-bottom:14px}
  .hero h1{font-size:clamp(40px,6vw,76px);font-weight:800;max-width:15ch}
  .hero h1 em{font-style:normal;color:var(--coral)}
  .hero p.lead{font-size:19px;color:var(--ink-2);max-width:58ch;margin:20px 0 0}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 0}
  .stat{flex:0 1 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 20px}
  .stat b{display:block;font-family:"Bricolage Grotesque";font-size:clamp(24px,6vw,32px);font-weight:800;line-height:1.1;white-space:nowrap}
  .stat span{display:block;color:var(--mute);font-size:14px;margin-top:2px;white-space:nowrap}

  /* map */
  .mapcard{background:var(--sea);border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
  .mapcard{height:clamp(600px, 82vh, 900px)}
  /* the map library writes its own size on the map element: force it to fill the card */
  #map,#map.map{position:absolute !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;height:100% !important;display:block}
  .map svg{display:block}
  /* the map breaks out of the text column: wide on large screens */
  #mapslot{width:min(calc(100vw - 40px), 1500px);margin-left:calc(50% - min(calc(50vw - 20px), 750px))}
  .map.small{height:440px}
  .maplegend{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:3}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff;box-shadow:0 0 0 1px var(--coral-d);vertical-align:-1px;margin-right:6px}
  .maphint{position:absolute;right:16px;top:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);z-index:3}
  /* jsvectormap essentials (its stylesheet cannot load here) */
  .jvm-container{position:relative;overflow:hidden;touch-action:none;height:100%;width:100%}
  #map>svg,.jvm-container>svg{display:block}
  .jvm-tooltip{position:absolute;display:none;z-index:999;background:var(--ink);color:#fff;font:600 13px "DM Sans",sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .jvm-tooltip.active{display:block}
  .jvm-zoom-btn{position:absolute;left:14px;width:32px;height:32px;border-radius:10px;background:#fff;color:var(--ink);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font:700 18px/1 "DM Sans";z-index:3;user-select:none}
  .jvm-zoom-btn.jvm-zoomin{top:14px}
  .jvm-zoom-btn.jvm-zoomout{top:52px}
  .jvm-zoom-btn:hover{border-color:var(--coral);color:var(--coral-d)}
  .jvm-region{transition:fill .15s}
  .jvm-marker,.jvm-element{cursor:pointer}
  /* automatic name labels on the map */
  .maplabels{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;transition:opacity .2s ease}
  .maplabels.hide{opacity:0}
  .mlabel{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .15s}
  .mlabel.city{background:#B8372C;color:#fff;font:700 13.5px "DM Sans",sans-serif;padding:5px 10px;border-radius:8px;margin-top:-14px;box-shadow:0 6px 14px -6px rgba(94,26,20,.6)}
  .mlabel.city::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:#B8372C}
  .mlabel.country{transform:translate(-50%,0);font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5E1A14;opacity:.75;text-shadow:0 0 4px #fff,0 0 8px #fff,0 0 2px #fff}
  /* fallback map */
  .fallback{position:relative;height:100%;background:radial-gradient(circle at 30% 30%,#fff 0,var(--sea) 70%)}
  .fallback svg{width:100%;height:100%}

  /* country grid */
  .sec-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:52px 0 18px;flex-wrap:wrap}
  .sec-title h2{font-size:36px;font-weight:800}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{position:relative;min-width:280px}
  .search input{width:100%;font:inherit;font-size:15.5px;padding:12px 16px 12px 42px;border-radius:999px;border:1.5px solid var(--line);background:#fff;outline:none}
  .search input:focus{border-color:var(--coral)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:20px}
  .country{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .country:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(70,30,20,.35)}
  .country .flag{font-size:30px;line-height:1}
  .country h3{font-size:24px;font-weight:800;margin:10px 0 4px}
  .country .count{color:var(--coral-d);font-weight:700;font-size:14px}
  .country p{color:var(--ink-2);font-size:14.5px;margin:10px 0 0;flex:1}
  .country .match{margin-top:10px;font-size:13.5px;background:var(--coral-l);color:var(--coral-d);padding:5px 10px;border-radius:999px;align-self:flex-start;font-weight:700}
  .empty{display:none;padding:30px;text-align:center;color:var(--mute)}

  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .tag.bike{background:var(--mint);color:var(--mint-ink)}
  .tag.scoot{background:var(--sky);color:var(--sky-ink)}
  .tag.new{background:var(--coral);color:#fff}
  .tag.soon{background:#FFF0C7;color:#7A5A00}

  /* country page */
  .crumbs{padding:28px 0 0;font-size:14px;color:var(--mute)}
  .crumbs a{color:var(--mute)}
  .phead{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:22px 0 30px;flex-wrap:wrap}
  .phead h1{font-size:clamp(42px,6.5vw,80px);font-weight:800}
  .phead h1 .flag{font-size:.7em;margin-right:12px;vertical-align:.08em}
  .phead .lead{font-size:18px;color:var(--ink-2);max-width:60ch;margin:16px 0 0}
  .pstats{display:flex;gap:12px;flex-wrap:wrap}
  .pstat{background:var(--coral);color:#fff;border-radius:18px;padding:14px 18px;min-width:130px}
  .pstat b{display:block;font-family:"Bricolage Grotesque";font-size:30px;font-weight:800;line-height:1.1}
  .pstat span{font-size:13.5px;opacity:.92}
  .pstat.alt{background:var(--ink)}

  .split{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .clist{background:#fff;border:1px solid var(--line);border-radius:24px;padding:8px;max-height:520px;overflow:auto}
  .citem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;text-decoration:none;cursor:pointer;border:1.5px solid transparent}
  .citem:hover,.citem.on{background:var(--coral-l)}
  .citem.on{border-color:var(--coral)}
  .citem .pin{flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:2px}
  .citem b{display:block;font-size:16px}
  .citem small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4;margin-top:2px}
  .citem .tags{margin:6px 0 0}
  .citem .tag{font-size:11.5px;padding:3px 8px}
  .citem .go{font-size:13px;font-weight:700;color:var(--coral-d);margin-top:4px;display:inline-block}
  .clist.wide{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px;padding:10px;margin-top:16px}
  .clist.wide h4{grid-column:1/-1}
  .clist h4{margin:10px 14px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}

  section.block{padding:44px 0;border-top:1px solid var(--line);margin-top:44px}
  section.block h2{font-size:32px;font-weight:800;margin-bottom:20px}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .card h3{font-size:20px;margin-bottom:8px}
  .card p{margin:0;color:var(--ink-2);font-size:15px}
  .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--coral-l);color:var(--coral-d);font-weight:800;margin-bottom:12px}
  .others{display:flex;gap:10px;flex-wrap:wrap}
  .others a{text-decoration:none;background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:500}
  .others a:hover{border-color:var(--coral);color:var(--coral-d)}
  .appband{background:var(--ink);color:#fff;border-radius:28px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin:44px 0 70px}
  .appband h2{font-size:34px}
  .appband p{color:#CFC6C3;margin:8px 0 0}
  .store{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;padding:12px 18px;border-radius:14px}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap}
  .note{font-size:14px;color:var(--mute);margin-top:14px}

  /* France city page (reused) */
  .chero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end;padding:28px 0 44px}
  .chero h1{font-size:clamp(42px,6.5vw,84px);font-weight:800}
  .chero h1 small{display:block;font-size:.32em;font-weight:600;color:var(--coral-d);letter-spacing:0;margin-bottom:10px;font-family:"DM Sans"}
  .chero .lead{font-size:18px;color:var(--ink-2);margin:18px 0 24px}
  .figure{background:var(--coral);border-radius:28px;padding:30px;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .figure .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:64px;line-height:1}
  .figure .lbl{opacity:.9;font-weight:500}
  .figure svg{position:absolute;right:-10px;bottom:-14px;opacity:.22}
  .figure .row{display:flex;gap:28px;position:relative}
  .communes{display:flex;flex-wrap:wrap;gap:8px}
  .communes span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px}
  .communes span.hl{border-color:var(--coral);color:var(--coral-d);font-weight:700}
  table.prices{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  table.prices td,table.prices th{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:15.5px}
  table.prices th{background:#FBF1EC;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
  table.prices td:last-child{font-weight:700;white-space:nowrap}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px}
  .kpi{flex:1 1 220px;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
  .kpi .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--coral-l);color:var(--coral-d);display:grid;place-items:center}
  .kpi .ic svg{width:22px;height:22px}
  .kpi b{display:block;font-family:"Bricolage Grotesque";font-size:20px;font-weight:800;line-height:1.15}
  .kpi span{display:block;color:var(--mute);font-size:13px;line-height:1.3}
  .highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .hl-item{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .hl-item .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--coral-l);display:grid;place-items:center;font-size:20px}
  .hl-item b{display:block;margin-bottom:3px}
  .hl-item p{margin:0;color:var(--ink-2);font-size:15px}
  details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px}
  summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  summary::after{content:"+";color:var(--coral-d);font-size:22px;line-height:1}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;color:var(--ink-2)}
  footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--mute);font-size:13.5px}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

  /* page "Bienvenue à <ville>" (ouverte au clic sur une ville de la carte) */
  .welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:center;padding:36px 0 56px}
  .welcome #mapslot{width:auto;margin-left:0;min-width:0}
  .welcome .mapcard{height:clamp(480px,72vh,760px)}
  .wloc{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
  .wloc a{color:var(--coral-d);font-weight:700}
  .welcome h1{font-size:clamp(48px,7vw,96px);font-weight:800;overflow-wrap:anywhere}
  .welcome h1 em{font-style:normal;color:var(--coral)}
  .welcome .tags{margin:18px 0 0}
  .welcome .lead{font-size:17px;color:var(--ink-2);margin:14px 0 0;max-width:46ch}
  .wmodes{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:24px 0 14px}
  .wmodes button{border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
  .wmodes button.on{background:var(--ink);color:#fff}
  .wform{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-width:440px;position:relative}
  .wform label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--cream)}
  .wform label+label{margin-top:8px}
  .wform input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .wform .pt{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
  .wform .pt.sq{border-radius:2px;background:var(--coral)}
  .wform:before{content:"";position:absolute;left:24px;top:36px;height:32px;border-left:2px dotted var(--mute)}
  .wsugg{list-style:none;margin:14px 0 0;padding:0;max-width:440px}
  .wsugg a{display:flex;align-items:center;gap:12px;padding:10px 6px;text-decoration:none;border-bottom:1px solid var(--line)}
  .wsugg a:hover b{color:var(--coral-d)}
  .wsugg .ic{width:32px;height:32px;border-radius:50%;background:var(--coral-l);display:grid;place-items:center;flex:none;font-size:15px}
  .wsugg small{display:block;color:var(--mute);font-size:13px}
  .welcome .cta-row{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .welcome .guide{font-weight:700;color:var(--coral-d)}

  /* page Sécurité + quiz */
  .secu-hero{padding:48px 0 8px}
  .secu-hero h1{font-size:clamp(44px,6.5vw,84px);font-weight:800;max-width:14ch}
  .secu-hero h1 em{font-style:normal;color:var(--coral)}
  .secu-hero .lead{font-size:18px;color:var(--ink-2);max-width:60ch;margin:18px 0 0}
  .rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:34px}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .rule .ic{font-size:26px;line-height:1}
  .rule b{display:block;font-size:17px;margin:12px 0 6px}
  .rule p{margin:0;color:var(--ink-2);font-size:15px}
  .quizband{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:24px;padding:34px 38px;margin:40px 0 0}
  .quizband h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}
  .quizband p{margin:8px 0 0;color:#D8CFCC;max-width:52ch}
  .quiz{max-width:720px;margin:0 auto;padding:40px 0 20px}
  .qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);font-weight:700}
  .qbar{height:8px;background:var(--line);border-radius:99px;margin:10px 0 30px;overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .35s ease}
  .quiz h1{font-size:clamp(28px,4vw,42px);font-weight:800}
  .qopts{display:grid;gap:10px;margin:26px 0 0}
  .qopt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
  .qopt:hover:not(:disabled){border-color:var(--coral)}
  .qopt .k{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-weight:700;flex:none}
  .qopt:disabled{cursor:default}
  .qopt.ok{border-color:var(--mint-ink);background:var(--mint)}
  .qopt.ok .k{background:var(--mint-ink);color:#fff}
  .qopt.ko{border-color:var(--coral-d);background:var(--coral-l)}
  .qopt.ko .k{background:var(--coral-d);color:#fff}
  .qexp{margin:18px 0 0;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
  .qexp b{color:var(--ink)}
  .qnext{margin-top:22px}
  .qscore{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(72px,12vw,130px);font-weight:800;color:var(--coral);line-height:1;margin:18px 0 6px}
  .qrecap{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:8px}

        tooltip.text && tooltip.text(`${c.flag} ${c.name} · ${c.cities.length}${c.more?"+":""} villes`);
      },
      onRegionClick(e, code){
        const c=COUNTRIES.find(x=>x.code===code);
        if(c) navTo(c.id);
      },
      onMarkerClick(e, g){ g=+g; if(g>=ALL.length){ spotClick(g-ALL.length); return; } handleMarker(g); },
      onViewportChange(){ labelsWhileMoving(); }
    });
    mapReady=true;
    applyView(false);   /* first display: straight to the right place, no animation */
  }catch(err){ fallbackMode=true; mapReady=true; applyView(false); }
}

/* Move the map to VIEW.target. One single zoom from wherever the map currently is. */
function applyView(animate){
  if(!mapReady) return;
  if(fallbackMode){ drawFallback(); return placeLabels(); }
  paintSelection();
  const t=VIEW.target;
  const pin=MAPCARD.querySelector("#mappin");
  if(pin) pin.hidden=true;
  const showPin=()=>{};
  const cfg = t.type==="spot" ? {coords:t.coords, scale:SPOT_SCALE}
            : t.type==="city" ? {coords:t.coords, scale:CITY_SCALE}
            : t.type==="country" ? (countryCfg(VIEW.country) || {regions:[t.code]})
            : {regions: EUROPE};
  LABELS.classList.add("hide");
  clearTimeout(__lblTimer);
  const showLabels=()=>{ clearTimeout(__lblTimer); __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); showPin(); }, 40); };
  if(animate && glideTo(cfg, showLabels)) return;
  try{ currentMap.setFocus(Object.assign(cfg,{animate:!!animate})); }
  catch(e){ try{ currentMap.setFocus(cfg); }catch(_){} }
  __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); showPin(); }, animate?700:80);
}
const SPOT_SCALE=90;

/* Frame a country on its Voi cities (not on its whole territory: the "FR" shape
   also contains overseas departments, which pulled the view far to the side). */
function countryCfg(c){
  const m=currentMap; if(!m || !c) return null;
  const base=m._baseScale || m.baseScale;
  if(!base || typeof m.scale!=="number") return null;
  const nodes=markerNodes(); if(nodes.length<ALL.length) return null;
  const by=(f,dir)=>ALL.reduce((best,x,i)=> best<0 || (dir*(f(x)-f(ALL[best]))>0) ? i : best, -1);
  const iW=by(x=>x.lng,-1), iE=by(x=>x.lng,1), iS=by(x=>x.lat,-1), iN=by(x=>x.lat,1);
  const R=i=>nodes[i].getBoundingClientRect();
  const kx=(R(iE).left-R(iW).left)/(ALL[iE].lng-ALL[iW].lng)/m.scale;
  const ky=(R(iS).top-R(iN).top)/(ALL[iN].lat-ALL[iS].lat)/m.scale;
  if(!(kx>0) || !(ky>0)) return null;
  const la=c.cities.map(x=>x.lat), lo=c.cities.map(x=>x.lng);
  const minLa=Math.min(...la), maxLa=Math.max(...la), minLo=Math.min(...lo), maxLo=Math.max(...lo);
  const W=MAPEL.clientWidth, H=MAPEL.clientHeight;
  const spanLo=Math.max(maxLo-minLo, 1.6), spanLa=Math.max(maxLa-minLa, 1.0);
  const sAbs=Math.min(W*0.72/(spanLo*kx), H*0.62/(spanLa*ky));
  const rel=Math.min(sAbs/base, CITY_SCALE*0.8);
  return {coords:[(minLa+maxLa)/2, (minLo+maxLo)/2], scale:rel};
}

/* Keep the framing right if the map box changes size (fonts, window, mobile rotation) */
if(typeof ResizeObserver!=="undefined"){
  let lastW=0, lastH=0, rT=null;
  new ResizeObserver(()=>{
    const w=MAPEL.clientWidth, h=MAPEL.clientHeight;
    if(!w || !h || (w===lastW && h===lastH)) return; lastW=w; lastH=h;
    clearTimeout(rT); rT=setTimeout(fitMapToBox, 120);
  }).observe(MAPEL);
}
/* Make the drawing fill the whole map box (the library only measures its box on window resize) */
/* The map library measures its box only once: whenever the box size differs from
   the size the map was drawn at, redraw it at the right size, at the same place. */
function fitMapToBox(){
  if(!currentMap || fallbackMode) return;
  const w=MAPEL.clientWidth, h=MAPEL.clientHeight;
  if(!w || !h) return;
  if(Math.abs(w-__builtW)>2 || Math.abs(h-__builtH)>2) createMap();
}

/* Smooth camera move: eased glide (and zoom if needed) from the current view to the target,
   drawn frame by frame. Between two nearby cities it is a pure slide at the same zoom. */
let __anim=null, __gliding=false;
function glideTo(cfg, done){
  const m=currentMap;
  if(!m || typeof m._applyTransform!=="function" || typeof m.scale!=="number") return false;
  const W=MAPEL.clientWidth, H=MAPEL.clientHeight; if(!W||!H) return false;
  cancelAnimationFrame(__anim);
  const s0=m.scale, x0=m.transX, y0=m.transY;
  try{ m.setFocus(Object.assign({},cfg,{animate:false})); }catch(e){ return false; }
  const s1=m.scale, x1=m.transX, y1=m.transY;
  const set=(s,x,y)=>{ m.scale=s; m.transX=x; m.transY=y; m._applyTransform(); };
  set(s0,x0,y0);
  const c0x=W/(2*s0)-x0, c0y=H/(2*s0)-y0, c1x=W/(2*s1)-x1, c1y=H/(2*s1)-y1;
  const zoomChange=Math.abs(Math.log(s1/s0));
  const dist=Math.hypot((c1x-c0x)*s0,(c1y-c0y)*s0);            /* on-screen distance in px */
  const dur=Math.min(1300, 550 + zoomChange*170 + Math.min(dist,1500)*0.12);
  const ease=p=>p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
  const t0=performance.now(); __gliding=true;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    const s=s0*Math.pow(s1/s0,e);
    const cx=c0x+(c1x-c0x)*e, cy=c0y+(c1y-c0y)*e;
    set(s, W/(2*s)-cx, H/(2*s)-cy);
    if(p<1) __anim=requestAnimationFrame(step);
    else { set(s1,x1,y1); __gliding=false; paintSelection(); done&&done(); }
  };
  __anim=requestAnimationFrame(step);
  return true;
}
function goTo(target, sel, country, animate){
  VIEW.target=target; VIEW.sel=(sel==null?-1:sel); VIEW.country=country||null;
  applyView(animate && mapReady);
}

function markerNodes(){
  let n=[...MAPEL.querySelectorAll("circle.jvm-marker, circle[data-index]")];
  n=[...new Set(n)];
  if(n.length && n[0].hasAttribute("data-index")) n.sort((p,q)=>(+p.getAttribute("data-index"))-(+q.getAttribute("data-index")));
  return n;
}
function spotClick(j){

  if(btn) zonePick(btn); else goTo({type:"spot", coords:[s.lat,s.lng], label:s.label, key:s.key}, VIEW.sel, VIEW.country, true);

function paintSelection(){
  const spots=spotArr();
  markerNodes().forEach((n,i)=>{
    if(i>=ALL.length){
      const sp=spots[i-ALL.length]; if(!sp) return;
      const show = VIEW.spotsFor===sp.city, on = VIEW.target.type==="spot" && VIEW.target.key===sp.key;
      n.style.display = show ? "" : "none";
      n.setAttribute("fill", on?"#B8372C":"#ffffff"); n.style.fill = on?"#B8372C":"#ffffff";
      n.setAttribute("stroke", on?"#ffffff":"#D9564B"); n.style.stroke = on?"#ffffff":"#D9564B";
      n.setAttribute("stroke-width", on?3:2.5); n.setAttribute("r", on?8:4.5);
      return;
    }

    n.setAttribute("fill", s?"#B8372C":"#F26A5E"); n.style.fill = s?"#B8372C":"";
    n.setAttribute("stroke", s?"#5E1A14":"#ffffff"); n.style.stroke = s?"#5E1A14":"";
    n.setAttribute("stroke-width", s?2.5:2); n.setAttribute("r", s?7.5:6);
  });
}

/* names written on the map */
let __lblTimer=null;
function labelsWhileMoving(){
  if(__gliding) return;
  LABELS.classList.add("hide");
  clearTimeout(__lblTimer);
  __lblTimer=setTimeout(()=>{ placeLabels(); LABELS.classList.remove("hide"); }, 180);
}
function placeLabels(){
  if(!document.body.contains(MAPCARD)) return;
  const base=LABELS.getBoundingClientRect();
  const nodes = fallbackMode ? [...MAPEL.querySelectorAll(".fb circle")] : markerNodes();
  const idx = fallbackMode ? (MAPEL.__fbIdx||[]) : ALL.map((_,i)=>i);
  const pos = g => { const k=idx.indexOf(g); const n=nodes[k]; if(!n) return null; const r=n.getBoundingClientRect(); return {x:r.left+r.width/2-base.left, y:r.top+r.height/2-base.top, top:r.top-base.top, bottom:r.bottom-base.top}; };
  let html="";
  if(VIEW.country){
    const pts=VIEW.country.cities.map(ct=>pos(ct.g)).filter(Boolean).filter(p=>p.x>-40&&p.x<base.width+40&&p.y>-40&&p.y<base.height+40);
    if(pts.length){
      const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length;
      const y=Math.min(Math.max(...pts.map(p=>p.bottom))+16, base.height-40);
      html+=`<div class="mlabel country" style="left:${Math.min(Math.max(cx,90),base.width-90)}px;top:${y}px">${esc(VIEW.country.name)}</div>`;
    }
  }
  if(!fallbackMode && VIEW.spotsFor && (VIEW.target.type==="city" || VIEW.target.type==="spot")){
    spotArr().forEach((sp,j)=>{
      if(sp.city!==VIEW.spotsFor) return;
      const n=nodes[ALL.length+j]; if(!n) return;
      const r=n.getBoundingClientRect(); const x=r.left+r.width/2-base.left, y=r.top+r.height/2-base.top;
      if(x<-20||x>base.width+20||y<-20||y>base.height+20) return;
      const on=VIEW.target.type==="spot" && VIEW.target.key===sp.key;
      html+=`<div class="mlabel spot${on?" on":""}" style="left:${x}px;top:${y}px">${esc(on?sp.label:sp.short)}</div>`;
    });
  }
  if(VIEW.sel>=0 && VIEW.target.type!=="spot"){
    const p=pos(VIEW.sel);
    if(p) html+=`<div class="mlabel city" style="left:${p.x}px;top:${p.top}px">${esc(ALL[VIEW.sel].name)}</div>`;
  }
  LABELS.innerHTML=html;
}
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ fitMapToBox(); placeLabels(); },150); });

/* fallback (map library unavailable): simple projected dot map of the current view */
function drawFallback(){
  const list = VIEW.country ? VIEW.country.cities.map(c=>c.g) : ALL.map((_,i)=>i);
  MAPEL.__fbIdx=list;
  const markers=list.map(g=>ALL[g]);
  const lats=markers.map(m=>m.lat), lngs=markers.map(m=>m.lng);
  let minLa=Math.min(...lats), maxLa=Math.max(...lats), minLo=Math.min(...lngs), maxLo=Math.max(...lngs);
  const padLa=Math.max(.6,(maxLa-minLa)*.15), padLo=Math.max(.9,(maxLo-minLo)*.15);
  minLa-=padLa;maxLa+=padLa;minLo-=padLo;maxLo+=padLo;
  const W=1000,H=600, k=Math.cos((minLa+maxLa)/2*Math.PI/180);
  const s=Math.min(W/((maxLo-minLo)*k), H/(maxLa-minLa));
  const ox=(W-(maxLo-minLo)*k*s)/2, oy=(H-(maxLa-minLa)*s)/2;
  MAPEL.innerHTML=`<div class="fallback"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${
    markers.map((m,i)=>{const x=ox+(m.lng-minLo)*k*s, y=oy+(maxLa-m.lat)*s, on=list[i]===VIEW.sel;
      return `<g class="fb" data-g="${list[i]}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?10:9}" fill="${on?"#B8372C":"#F26A5E"}" stroke="${on?"#5E1A14":"#fff"}" stroke-width="3"/>${on?"":`<text x="${x+13}" y="${y+5}" font-family="DM Sans" font-size="17" font-weight="600" fill="#1B1716">${esc(m.name)}</text>`}</g>`}).join("")
  }</svg></div>`;
  MAPEL.querySelectorAll(".fb").forEach(gr=>gr.addEventListener("click",()=>handleMarker(+gr.dataset.g)));
}

function scrollToMap(behavior){

function rulesBox(m){
  const c=m.country, cr=COUNTRY_RULES[c.id]||{items:[],src:[]}, lr=CITY_RULES[m.slug]||{items:[],src:[]};
  const fits=it=>!it[3] || [...it[3]].some(x=>m.m.includes(x)) || !m.m;
  const local=lr.items.filter(fits), nat=cr.items.filter(fits);
  const li=it=>`<li><span class="ic">${it[0]}</span><div><b>${esc(it[1])}</b><p>${esc(it[2])}</p></div></li>`;
  const src=[...lr.src,...cr.src];
  return `<section class="lrules" aria-labelledby="lr-${m.slug}">
    <div class="lrules-head"><span class="lrules-badge">Règles locales</span>
      <h2 id="lr-${m.slug}">À savoir avant de rouler à ${esc(m.name)}</h2></div>
    ${lr.alert?`<p class="lrules-alert">⚠️ ${esc(lr.alert)}</p>`:""}
    ${local.length?`<h3>À ${esc(m.name)}</h3><ul>${local.map(li).join("")}</ul>`:""}
    ${(!local.length && !nat.length && !lr.alert)?`<p class="lrules-none">Nous n'avons pas encore de règles locales détaillées pour ${esc(m.name)}. Suivez le code de la route du pays et les zones indiquées dans l'application.</p>`:""}
    ${nat.length?`<h3>${c.flag} ${c.prep==="aux"?"Aux":c.prep==="au"?"Au":"En"} ${esc(c.name)}</h3><ul>${nat.map(li).join("")}</ul>`:""}
    <p class="lrules-foot">🅿️ Les zones de stationnement, les zones lentes et les zones interdites exactes s'affichent sur la carte de l'application Voi : elles priment sur ce résumé.
      Règles relevées en ${RULES_UPDATED}${src.length?` · Sources : ${src.map(s=>`<a href="${s[1]}">${esc(s[0])}</a>`).join(", ")}`:""}.</p>
  </section>`;
}

function spotKey(slug,chip){ const a=chip.split(" · ")[0]; return SPOTS[slug+"|"+a] ? slug+"|"+a : (SPOTS[chip] ? chip : null); }
function zonePick(btn){
  const box=btn.closest(".zones,.block"), key=btn.dataset.spot, s=SPOTS[key]; if(!s) return;
  box.querySelectorAll(".zchip").forEach(b=>b.classList.toggle("on",b===btn));
  const d=box.querySelector(".zdetail");
  const osm=`https://www.openstreetmap.org/?mlat=${s[0]}&mlon=${s[1]}#map=15/${s[0]}/${s[1]}`;
  if(d){ d.hidden=false; d.innerHTML=`<b>📍 ${esc(s[3])}</b>
      ${s[2].length?`<p>Repères du secteur : ${s[2].map(esc).join(" · ")}</p>`:`<p>Centre de la commune.</p>`}
      <p class="zd-actions"><a href="${osm}">Voir le plan détaillé (rues) →</a></p>
      <p class="note">Les véhicules disponibles et les zones de stationnement exactes s'affichent en temps réel dans l'application Voi.</p>`; }
  const go=()=>goTo({type:"spot", coords:[s[0],s[1]], label:s[3], key}, VIEW.sel, VIEW.country, true);
  if(mapOnScreen()) go(); else { scrollToMap(); setTimeout(go,420); }
}
document.addEventListener("click",e=>{ const b=e.target.closest(".zchip"); if(b){ e.preventDefault(); zonePick(b); } });

const ARTICLES_READY = (async()=>{ try{
  const bin=Uint8Array.from(atob(ARTICLES_Z),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  Object.assign(ARTICLES,(new Function("return "+txt))());
}catch(e){ console.error("articles",e); } })();

function articlesBlock(slug, cityName){
  const list=ARTICLES[slug]; if(!list) return "";
  const card=(a,i)=>`<article class="acard" data-a="${slug}|${i}" tabindex="0" role="button" aria-label="Lire : ${esc(a.title)}">
      <div class="aimg" data-emoji="${a.emoji}"${a.photo?"":` data-auto="${slug}|${i}"`}>${a.photo?`<img loading="lazy" src="${WM(a.photo)}" alt="${esc(a.title)}" onerror="this.remove()">`:""}</div>
      <div class="abody"><span class="atag">${esc(a.tag)}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p>
        <div class="ameta">${esc(a.meta)}</div><span class="aread">Lire l'article →</span></div>
    </article>`;
  return `<section class="articles">
    <div class="ahead"><div><span class="lrules-badge">Le blog</span><h2>Idées de sorties à vélo</h2></div>
      <div class="anav"><button type="button" class="aprev" aria-label="Article précédent">←</button><button type="button" class="anext" aria-label="Article suivant">→</button></div></div>
    <div class="acar-track">${list.map(card).join("")}</div>
    <div class="adots">${list.map((_,i)=>`<button type="button" aria-label="Article ${i+1}" class="${i?"":"on"}" data-i="${i}"></button>`).join("")}</div>
    <p class="note">Distances et durées indicatives, à vélo électrique. Cliquez sur un article pour le lire. Photos : Wikimedia Commons (licences libres, auteur indiqué dans chaque article).</p>
  </section>`;
}


/* ── Photos automatiques pour les articles sans photo choisie à la main ──
   On cherche sur Wikimedia Commons (licences libres) une photo du lieu principal de l'article,
   puis du quartier / thème dans la ville, puis de la ville. Une même photo n'est jamais utilisée
   deux fois dans le blog d'une ville. L'auteur est crédité en bas de l'article. */
const CITY_Q = {"dusseldorf":"Düsseldorf","stuttgart":"Stuttgart","nuremberg":"Nürnberg","hanovre":"Hannover","aix-la-chapelle":"Aachen","lubeck":"Lübeck","magdebourg":"Magdeburg","mannheim":"Mannheim","darmstadt":"Darmstadt","potsdam":"Potsdam","kiel":"Kiel","brunswick":"Braunschweig","wurtzbourg":"Würzburg","tubingen":"Tübingen","birmingham":"Birmingham","bristol":"Bristol","northampton":"Northampton","peterborough":"Peterborough","coventry-univ-de-warwick":"Coventry","portsmouth":"Portsmouth","southampton":"Southampton","ile-de-wight":"Isle of Wight","glasgow":"Glasgow","edimbourg":"Edinburgh","swansea":"Swansea","goteborg":"Göteborg","malmo":"Malmö","uppsala":"Uppsala","lund":"Lund Sweden","helsingborg":"Helsingborg","linkoping":"Linköping","trondheim":"Trondheim","bergen":"Bergen Norway","drammen":"Drammen","aarhus":"Aarhus","aalborg":"Aalborg","odense":"Odense","tampere":"Tampere","turku":"Turku","vantaa":"Vantaa","berne":"Bern","winterthour":"Winterthur","bale":"Basel","saint-gall":"St. Gallen","frauenfeld":"Frauenfeld","illnau-effretikon":"Effretikon","innsbruck":"Innsbruck","turin":"Torino","bologne":"Bologna","genes":"Genova","reggio-d-emilie":"Reggio Emilia","naples":"Napoli","malaga":"Málaga","anvers":"Antwerpen","hilversum":"Hilversum","gooise-meren-bussum":"Naarden","soest":"Soest Utrecht","baarn":"Baarn","huizen":"Huizen","laren":"Laren Noord-Holland","blaricum":"Blaricum","eemnes":"Eemnes","wijdemeren":"Loosdrecht","madrid":"Madrid","lisbonne":"Lisboa"};
const TAG_Q = {"En famille":"park","Entre amis":"park","Sortie":"market","En amoureux":"sunset","City trip":"old town","Photo":"panorama","Bien-être":"cycling","Quotidien":"street tram","Escapade":"lake","Soirée":"night","Curiosités":"street","Saisons":"autumn"};
const PHOTO_CACHE = {}, PHOTO_USED = {};
function placeCore(n){ return n.replace(/^(Le tour d[eu] |Le long d[eu] (la |l')?|Les rives d[eu] (la |l')?|Les quais d[eu] (la |l')?|Le quartier d[eu] |Le parc d[eu] |Le coucher de soleil (sur|à|depuis|au) (le |la |l')?|Le soir (sur|à|au|dans) (le |la |les |l')?|Le |La |Les |L'|Un |Une )/i,"").replace(/^(d[eu] |des |l')/i,""); }
function photoQueries(slug,a){
  const c=CITY_Q[slug]||slug, r=(a.body||[]).find(p=>p&&p.route), q=[];
  if(r && !/journée|boucle|itinéraire| : /i.test(r.route.name)) q.push(placeCore(r.route.name)+" "+c.split(" ")[0]);
  q.push(c+" "+(TAG_Q[a.tag]||"")); q.push(c);
  return q;
}
async function commonsSearch(q){
  const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12"
    +"&gsrsearch="+encodeURIComponent(q+" filetype:bitmap -map -karte -plan -logo -diagram -drawing -painting")
    +"&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=900";
  const r=await fetch(u); if(!r.ok) return [];
  const j=await r.json(); const pages=Object.values((j.query||{}).pages||{}).sort((x,y)=>x.index-y.index);
  return pages.map(p=>({title:p.title,ii:(p.imageinfo||[])[0]})).filter(x=>x.ii && x.ii.mime==="image/jpeg" && x.ii.width>=800 && x.ii.width>=x.ii.height*1.15);
}
function findAutoPhoto(key){
  if(PHOTO_CACHE[key]) return PHOTO_CACHE[key];
  const [slug,i]=key.split("|"), a=(ARTICLES[slug]||[])[+i];
  return PHOTO_CACHE[key]=(async()=>{
    const used=PHOTO_USED[slug]||(PHOTO_USED[slug]=new Set());
    for(const q of photoQueries(slug,a)){
      let res=[]; try{ res=await commonsSearch(q); }catch(e){ return null; }
      const hit=res.find(x=>!used.has(x.title));
      if(hit){ used.add(hit.title);
        const md=hit.ii.extmetadata||{}, strip=h=>(h||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
        return {src:hit.ii.thumburl||hit.ii.url, page:hit.ii.descriptionurl, artist:strip((md.Artist||{}).value)||"auteur crédité sur la page du fichier", lic:strip((md.LicenseShortName||{}).value)}; }
    }
    return null;
  })();
}
function fillAutoPhotos(root){
  (root||document).querySelectorAll("[data-auto]:not([data-busy])").forEach(box=>{
    box.dataset.busy="1";
    findAutoPhoto(box.dataset.auto).then(ph=>{
      if(!ph) return;
      const img=document.createElement("img"); img.src=ph.src; img.alt=""; img.loading="lazy"; img.onerror=()=>img.remove(); box.appendChild(img);
    });
  });
  (root||document).querySelectorAll("[data-autocredit]:not([data-busy])").forEach(p=>{
    p.dataset.busy="1";
    findAutoPhoto(p.dataset.autocredit).then(ph=>{
      if(!ph) return;
      p.innerHTML=`Photo : <a href="${ph.page}">${esc(ph.artist)}${ph.lic?" ("+esc(ph.lic)+")":""}, via Wikimedia Commons</a>`; p.hidden=false;
    });
  });
}
new MutationObserver(()=>fillAutoPhotos()).observe(document.documentElement,{childList:true,subtree:true});

/* carrousel : boutons, points, glisser à la souris, défilement fluide */
function acarStep(track){ const c=track.querySelector(".acard"); return c ? c.getBoundingClientRect().width+16 : 300; }
function acarDots(track){
  const sec=track.closest(".articles"); if(!sec) return;
  const i=Math.round(track.scrollLeft/acarStep(track));
  sec.querySelectorAll(".adots button").forEach((b,k)=>b.classList.toggle("on",k===i));
  const max=track.scrollWidth-track.clientWidth-4;
  sec.querySelector(".aprev").disabled = track.scrollLeft<=4;
  sec.querySelector(".anext").disabled = track.scrollLeft>=max;
}
document.addEventListener("click",e=>{
  const sec=e.target.closest(".articles"); if(!sec) return;
  const track=sec.querySelector(".acar-track");
  if(e.target.closest(".aprev")) track.scrollBy({left:-acarStep(track),behavior:"smooth"});
  else if(e.target.closest(".anext")) track.scrollBy({left:acarStep(track),behavior:"smooth"});
  else if(e.target.closest(".adots button")) track.scrollTo({left:+e.target.dataset.i*acarStep(track),behavior:"smooth"});
  else { const c=e.target.closest(".acard"); if(c && !track.__dragged) openArticle(c.dataset.a); }
});
document.addEventListener("keydown",e=>{ const c=e.target.closest && e.target.closest(".acard"); if(c && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openArticle(c.dataset.a); } if(e.key==="Escape") closeArticle(); });
document.addEventListener("scroll",e=>{ if(e.target.classList && e.target.classList.contains("acar-track")) acarDots(e.target); }, true);
/* glisser à la souris (le tactile défile nativement) */
document.addEventListener("pointerdown",e=>{
  const track=e.target.closest && e.target.closest(".acar-track"); if(!track || e.pointerType!=="mouse") return;
  const x0=e.clientX, s0=track.scrollLeft; track.__dragged=false; track.classList.add("drag");
  const move=ev=>{ const dx=ev.clientX-x0; if(Math.abs(dx)>5) track.__dragged=true; track.scrollLeft=s0-dx; };
  const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); track.classList.remove("drag");
    const step=acarStep(track); track.scrollTo({left:Math.round(track.scrollLeft/step)*step,behavior:"smooth"}); setTimeout(()=>track.__dragged=false,50); };
  document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
});

/* lecture d'un article */
function openArticle(key){
  const [slug,i]=key.split("|"), list=ARTICLES[slug]||[], a=list[+i]; if(!a) return;
  let m=document.getElementById("amodal");
  if(!m){ m=document.createElement("div"); m.id="amodal"; m.className="amodal"; document.body.appendChild(m);
    m.addEventListener("click",e=>{
      if(e.target===m || e.target.closest(".aclose")) closeArticle();
      if(e.target.closest(".aback")){ closeArticle(); const sec=document.querySelector(".articles"); if(sec) sec.scrollIntoView({behavior:"smooth",block:"start"}); }
      const nx=e.target.closest(".anextart"); if(nx) openArticle(nx.dataset.a);
    }); }
  const txt=[a.lead||"",...a.body.map(p=>typeof p==="string"?p:p.route?p.route.text:(p.h||p.tip||p.quote||(p.ul||[]).join(" ")))].join(" ");
  const mins=Math.max(1,Math.ceil(txt.split(/\s+/).length/200));
  const nIdx=(+i+1)%list.length, next=list[nIdx];
  const nRoutes=a.body.filter(p=>p&&p.route).length; let rNum=0;
  const part=(p,idx,arr)=>{
    if(typeof p==="string") return `<p>${esc(p)}</p>`;
    if(p.h) return `<h2 class="ah">${esc(p.h)}</h2>`;
    if(p.route){ const r=p.route; rNum++;
      return `<section class="aroute"><h2>${nRoutes>1?`<span class="rn">${rNum}</span>`:""}${esc(r.name)}</h2>
        <dl class="afacts">${r.facts.map(f=>`<div><dt>${f[0]} ${esc(f[1])}</dt><dd>${esc(f[2])}</dd></div>`).join("")}</dl>
        <p class="astory">${esc(r.text)}</p></section>`; }
    if(p.quote) return `<blockquote class="aquote"><p>« ${esc(p.quote)} »</p>${p.who?`<cite>${esc(p.who)}</cite>`:""}</blockquote>`;
    if(p.tip) return `<p class="anote"><b>Notre conseil · </b>${esc(p.tip)}</p>`;
    if(p.ul){
      const prev=arr[idx-1], ordered=prev && prev.route;          /* a list right after an itinerary = its stops, numbered */
      const item=x=>{
        const t=x.match(/^(\d{1,2}\s?h(?:\s?\d{2})?)\s·\s(.*)$/); if(t) return `<li><span class="tm">${esc(t[1])}</span>${esc(t[2])}</li>`;
        const k=x.indexOf(" : "); if(k>0 && k<40) return `<li><b>${esc(x.slice(0,k))}</b> : ${esc(x.slice(k+3))}</li>`;
        return `<li>${esc(x)}</li>`;
      };
      return ordered ? `<ol class="alist">${p.ul.map(item).join("")}</ol>` : `<ul class="alist">${p.ul.map(item).join("")}</ul>`;
    }
    return "";
  };
  m.innerHTML=`<div class="awrap"><button type="button" class="aclose" aria-label="Fermer l'article">← Retour</button>
    <article class="apanel" role="dialog" aria-modal="true" aria-label="${esc(a.title)}">
    <div class="aprog" aria-hidden="true"><i></i></div>
    <div class="acover" data-emoji="${a.emoji}"${a.photo?"":` data-auto="${slug}|${i}"`}>${a.photo?`<img src="${WM(a.photo)}" alt="" onerror="this.remove()">`:""}</div>
    <div class="acol">
      <div class="akicker"><span class="k1">${esc(a.tag)}</span><i></i><span class="amins">${mins} min de lecture</span><i></i><span>${esc(a.meta)}</span></div>
      <h1>${esc(a.title)}</h1>
      ${a.q?`<p class="asub">« ${esc(a.q)} »</p>`:""}
      ${a.lead?`<p class="alead">${esc(a.lead)}</p>`:""}
      ${a.body.map(part).join("")}
      ${a.key?`<aside class="akey"><h2><span>✓</span>L'essentiel à retenir</h2><ul>${a.key.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></aside>`:""}
      <div class="afoot">
        ${list.length>1?`<button type="button" class="anextart" data-a="${slug}|${nIdx}"><small>Article suivant →</small><span>${esc(next.title)}</span></button>`:""}
        <button type="button" class="btn coral aback">← Voir tous les articles</button>
      </div>
      ${a.photo?`<p class="acredit-l">Photo : <a href="${WMPAGE(a.photo)}">${esc(a.credit)}, via Wikimedia Commons</a></p>`:`<p class="acredit-l" data-autocredit="${slug}|${i}" hidden></p>`}
    </div></article></div>`;
  /* reading time from the text actually shown (≈ 220 words per minute) */
  const shown=m.querySelector(".acol").innerText.split(/\s+/).length;
  m.querySelector(".amins").textContent=Math.max(1,Math.round(shown/220))+" min de lecture";
  const panel=m.querySelector(".apanel"), bar=m.querySelector(".aprog i");
  panel.addEventListener("scroll",()=>{ const h=panel.scrollHeight-panel.clientHeight; bar.style.width=(h>0?panel.scrollTop/h*100:0)+"%"; });
  m.classList.add("open"); document.body.style.overflow="hidden";
  panel.scrollTop=0; panel.setAttribute("tabindex","-1"); panel.focus({preventScroll:true});
}
function closeArticle(){ const m=document.getElementById("amodal"); if(m){ m.classList.remove("open"); document.body.style.overflow=""; } }

/* ---------------- MINI FAQ (sur chaque page ville, générée à partir des données) ---------------- */
function miniFaq(m){
  const c=m.country, cr=COUNTRY_RULES[c.id]||{items:[]}, lr=CITY_RULES[m.slug]||{items:[]};
  const fits=it=>!it[3] || [...it[3]].some(x=>m.m.includes(x));
  const all=[...lr.items.filter(fits),...cr.items.filter(fits)];
  const find=icons=>all.find(it=>icons.includes(it[0]));
  const bikes=m.m.includes("b"), scoot=m.m.includes("s");
  const veh = bikes&&scoot ? "des vélos électriques et des trottinettes" : bikes ? "des vélos électriques" : scoot ? "des trottinettes électriques" : "des véhicules en libre-service";
  const one = bikes&&!scoot ? "mon vélo" : scoot&&!bikes ? "ma trottinette" : "mon véhicule";
  const qa=[];
  if(lr.alert) qa.push([`Voi est-il toujours disponible à ${m.name} ?`, lr.alert]);
  qa.push([`Quels véhicules Voi trouve-t-on à ${m.name} ?`, `Voi propose ${veh} à ${m.name}.${m.note?" "+m.note:""} La carte de l'application affiche en temps réel les véhicules disponibles autour de vous.`]);
  const zz=ZONES[m.slug];
  if(zz){ const list=zz.groups.map(g=>(g[0]?g[0]+" : ":"")+g[1].map(x=>x.split(" · ")[0]).join(", ")).join(" · "); qa.push([`Dans quelles communes peut-on utiliser Voi ?`, list+"."+(zz.note?" "+zz.note:"")]); }
  const park=find(["🅿️"]);
  qa.push([`Où garer ${one} à ${m.name} ?`, park ? `${park[1]} : ${park[2].charAt(0).toLowerCase()+park[2].slice(1)}` : `Garez-vous uniquement dans les zones de stationnement autorisées affichées sur la carte de l'application, sans gêner les piétons. Prenez une photo pour terminer la location.`]);
  const age=find(["🎂","🪪"]);
  qa.push([`Quel âge faut-il avoir ?`, age ? `${age[1]}. ${age[2]}` : `L'âge minimum pour louer est indiqué dans l'application au moment de créer votre compte.`]);
  const helmet=find(["⛑️"]);
  if(helmet) qa.push([`Le casque est-il obligatoire ?`, `${helmet[1]}. ${helmet[2]}`]);
  qa.push([`Combien coûte un trajet ?`, `Les tarifs de ${m.name} (prix à la minute, pass et abonnements) sont détaillés dans le tableau « Tarifs » plus haut sur cette page.`]);
  return `<section class="minifaq" aria-labelledby="mf-${m.slug}">
    <h2 id="mf-${m.slug}">Questions fréquentes à ${esc(m.name)}</h2>
    ${qa.map((q,i)=>`<details${i===0&&lr.alert?" open":""}><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("")}
    <p class="minifaq-more">D'autres questions ? <a href="#faq">Voir toute la FAQ →</a></p>
  </section>`;
}

function pricesBlock(name, t, country){
  let rows, src, scope="";
  if(t && t.prices){ rows=t.prices; src=t.pricesSrc; }
  else {
    const cid = country && country.id;
    const own = CITY_PRICES[name];
    const ref = own || COUNTRY_PRICES[cid] || ["1 € + 0,20 à 0,30 € / min","fourchette européenne Voi 2026"];
    rows=[["À la minute", own ? "Déverrouillage + prix à la minute" : "Tarif indicatif Voi "+(country?country.prep+" "+country.name:"en Europe"), ref[0]]];
    if(COUNTRY_PASS[cid]) rows.push(["Voi Pass mensuel","Trajets de 30 min illimités", COUNTRY_PASS[cid]]);
    src=ref[1];
    if(!own) scope=` Aucun tarif propre à ${esc(name)} n'est publié : le prix indiqué est celui relevé dans le reste du pays.`;
  }
  const k=CITY_STATS[name];
  const ksrc = k && k.src ? ` Chiffres clés : ${esc(k.src)}.` : "";
  return `<section class="block" style="margin-top:0"><h2>Tarifs à ${esc(name)}</h2>
    ${kpisBlock(name)}
    <table class="prices"><thead><tr><th>Formule</th><th>Détail</th><th>Prix</th></tr></thead><tbody>
    ${rows.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join("")}
    </tbody></table>
    <p class="note">Tarifs relevés en novembre 2026, susceptibles d'évoluer${src?` (source : ${esc(src)})`:""}.${scope}${ksrc}</p></section>`;
}

/* ---------------- DEPARTURE / DESTINATION, AVAILABILITY AND TRIP MAP ----------------
   - Addresses are looked up with Photon (free OpenStreetMap geocoder) while the
     user types.
   - The pill next to "Trouver un véhicule" says whether Voi bikes are offered
     within AVAIL_RADIUS_KM of the departure (list of served cities above).
   - Once a departure is set, a street map (Leaflet + Esri / CyclOSM / OpenStreetMap tiles)
     replaces the Europe map and zooms on it. With a destination, the trip is
     drawn: walk to the bike → ride → walk from the parking spot to the
     destination (routes from routing.openstreetmap.de).
   - Voi's live vehicle positions are not public: the bike and the parking spot
     are placed a short walk from the addresses and labelled as examples. */
const AVAIL_RADIUS_KM = 15;
const MAX_TRIP_KM = 30;
const GEO_API = "https://photon.komoot.io";
const ROUTE_API = "https://routing.openstreetmap.de";
const BIKE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8M9 9 12 17h-1M15 9l-1.5-3H11"/></svg>`;
function kmBetween(a,b){
  const R=6371, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestServed(pt){
  let best=null, dist=Infinity;
  ALL.forEach(c=>{ const d=kmBetween(pt,c); if(d<dist){dist=d;best=c;} });
  return {city:best, km:dist};
}
const bikesAt = pt => { const n=nearestServed(pt); return n.city && n.km<=AVAIL_RADIUS_KM && n.city.m.includes("b") ? n.city : null; };
function setPill(state,text){
  const el=document.getElementById("avail"); if(!el) return;
  el.className="avail"+(state?" "+state:"");
  el.querySelector(".lbl").textContent=text;
}
function pillForPoint(pt){
  const n=nearestServed(pt);
  if(n.city && n.km<=AVAIL_RADIUS_KM && n.city.m.includes("b")) setPill("yes",`Vélo disponible · ${n.city.name}`);
  else if(n.city && n.km<=AVAIL_RADIUS_KM) setPill("no",`Pas de vélo ici · trottinettes à ${n.city.name}`);
  else setPill("no","Pas de vélo Voi à cette adresse");
}
function cityInText(text){
  const t=" "+norm(text).replace(/[^a-z0-9]+/g," ")+" ";
  const clean=x=>norm(x).replace(/[^a-z0-9]+/g," ").trim();
  let best=null, bestLen=0;
  ALL.forEach(c=>{
    const names=new Set([clean(c.name), clean(c.name.replace(/\b(Métropole|Metropole)\b/i,"")), clean(c.name.split(/[&(]/)[0])]);
    names.forEach(n=>{ if(n && t.includes(" "+n+" ") && n.length>bestLen){ best=c; bestLen=n.length; } });
  });
  return best;
}
function pillFromText(text,pageCity){            /* offline fallback */
  const c=cityInText(text)||pageCity;
  setPill(c.m.includes("b")?"yes":"no", (c.m.includes("b")?"Vélo disponible":"Pas de vélo disponible")+" · "+c.name);
}
function addrLabel(p){
  const street=[p.housenumber,p.street].filter(Boolean).join(" ");
  const main=p.name && p.name!==p.street ? p.name : (street||p.city||"");
  const rest=[p.name && street && p.name!==p.street ? street : "", p.postcode, p.city && p.city!==main ? p.city : "", p.country].filter(Boolean).join(", ");
  return {main, rest, full:[main,rest].filter(Boolean).join(", ")};
}
/* one address field with suggestions; onPick(point,label) when an address is settled */
function addressField(inp,list,pageCity,{onTyping,onTop,onPick,onFail}){
  let timer=null, seq=0, items=[], active=-1, top=null;
  const close=()=>{ list.hidden=true; list.innerHTML=""; items=[]; active=-1; };
  const pt=f=>({lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]});
  const choose=f=>{ inp.value=addrLabel(f.properties).full; close(); seq++; onPick(pt(f),inp.value); };
  inp.addEventListener("input",()=>{
    clearTimeout(timer); top=null;
    const q=inp.value.trim();
    onTyping && onTyping(q);
    if(q.length<3){ close(); return; }
    const my=++seq;
    timer=setTimeout(()=>{
      fetch(`${GEO_API}/api/?q=${encodeURIComponent(q)}&limit=5&lang=fr&lat=${pageCity.lat}&lon=${pageCity.lng}`)
        .then(r=>r.json()).then(d=>{
          if(my!==seq) return;
          items=(d.features||[]).filter(f=>f.geometry); active=-1;
          top=items[0]||null;
          onTop && onTop(top?pt(top):null);
          if(!items.length || document.activeElement!==inp){ close(); return; }
          list.innerHTML=items.map((f,i)=>{ const l=addrLabel(f.properties); return `<li data-i="${i}">${esc(l.main)}${l.rest?`<small>${esc(l.rest)}</small>`:""}</li>`; }).join("");
          list.hidden=false;
        })
        .catch(()=>{ if(my===seq){ close(); onFail && onFail(q); } });
    },300);
  });
  list.addEventListener("mousedown",e=>{ const li=e.target.closest("li"); if(li){ e.preventDefault(); choose(items[+li.dataset.i]); } });
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      if(!list.hidden && active>=0) choose(items[active]);
      else if(top) choose(top);
      return;
    }
    if(list.hidden) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      active=(active+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;
      [...list.children].forEach((li,i)=>li.classList.toggle("on",i===active));
    } else if(e.key==="Escape") close();
  });
  inp.addEventListener("blur",()=>setTimeout(()=>{ const wasOpen=!list.hidden; close(); if(wasOpen && top) choose(top); },150));
  return { cancel:()=>{ seq++; clearTimeout(timer); close(); } };
}

/* ----- street map (Leaflet, loaded on first use) ----- */
let LEAFLET=null;
function loadLeaflet(){
  if(LEAFLET) return LEAFLET;
  const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
  LEAFLET=loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js")
    .catch(()=>{ css.href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"; return loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); })
    .then(()=>typeof L!=="undefined").catch(()=>false);
  return LEAFLET;
}
const TRIP={map:null, layer:null, dep:null, dst:null, seq:0, city:null};
function mk(cls,html,size){ return L.divIcon({className:"",html:`<div class="mk ${cls}" style="width:${size}px;height:${size}px">${html||""}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]}); }
/* Fonds de carte : Plan (Esri gris clair épuré + noms des rues), Détaillé (Esri, proche de Google Maps), Vélo (CyclOSM :
   pistes et bandes cyclables) et Satellite (Esri). Tuiles en <img> classiques ;
   si un serveur refuse une tuile, on bascule sur le serveur suivant de la liste. */
const ROUTE_ATTR=' · itinéraires <a href="https://routing.openstreetmap.de/">FOSSGIS</a>';
const ESRI=(svc)=>(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/${z}/${y}/${x}`;
const OSM=(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;   /* CARTO exige maintenant une clé API : retiré */
const BASEMAPS={
  "Plan":{ src:[ESRI("Canvas/World_Light_Gray_Base"), OSM], native:16,
           labels:ESRI("Canvas/World_Light_Gray_Reference"),
           attr:'Plan &copy; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'+ROUTE_ATTR },
  "Détaillé":{ src:[ESRI("World_Street_Map"), OSM],
           attr:'Plan &copy; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'+ROUTE_ATTR },
  "Vélo":{ src:[(z,x,y)=>`https://${"abc"[(x+y)%3]}.tile-cyclosm.openstreetmap.fr/cyclosm/${z}/${x}/${y}.png`, OSM],
           attr:'<a href="https://www.cyclosm.org">CyclOSM</a> · &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'+ROUTE_ATTR },
  "Satellite":{ src:[ESRI("World_Imagery"), ESRI("World_Street_Map")],
           attr:'Imagerie &copy; Esri, Maxar, Earthstar Geographics'+ROUTE_ATTR }
};
let StreetTiles=null;
function defineStreetTiles(){
  if(StreetTiles) return;
  StreetTiles=L.GridLayer.extend({
    createTile(c,done){
      const src=this.options.src, r=(window.devicePixelRatio||1)>1, img=document.createElement("img");
      let i=0;
      img.alt=""; img.setAttribute("role","presentation"); img.decoding="async";
      img.onload=()=>done(null,img);
      img.onerror=()=>{ if(++i<src.length) img.src=src[i](c.z,c.x,c.y,r); else done(new Error("tile"),img); };
      img.src=src[0](c.z,c.x,c.y,r);
      return img;
    }
  });
}
async function ensureStreetMap(){
  const ok=await loadLeaflet();
  const card=document.getElementById("tripcard"), slot=document.getElementById("mapslot");
  if(!ok || !card) return false;
  defineStreetTiles();
  if(card.hidden){ card.hidden=false; slot.style.display="none"; }
  const el=document.getElementById("streetmap");
  if(!TRIP.map || TRIP.map.getContainer()!==el){
    TRIP.map=L.map(el,{zoomControl:true,scrollWheelZoom:false});
    const layers={};
    Object.entries(BASEMAPS).forEach(([k,b])=>{
      const base=new StreetTiles({src:b.src, attribution:b.attr, maxZoom:19, maxNativeZoom:b.native||19, tileSize:256});
      layers[k]=b.labels ? L.layerGroup([base, new StreetTiles({src:[b.labels], maxZoom:19, maxNativeZoom:b.native||19, tileSize:256, zIndex:2})]) : base;
    });
    layers["Plan"].addTo(TRIP.map);
    L.control.layers(layers,null,{position:"topright",collapsed:false}).addTo(TRIP.map);
    TRIP.layer=L.layerGroup().addTo(TRIP.map);
  }
  setTimeout(()=>TRIP.map.invalidateSize(),0);
  return true;
}
/* deterministic "nearby" point: same address → same example position */
function nearby(pt,minM,maxM,salt){
  let h=2166136261; const k=`${pt.lat.toFixed(5)},${pt.lng.toFixed(5)},${salt}`;
  for(let i=0;i<k.length;i++){ h^=k.charCodeAt(i); h=Math.imul(h,16777619); }
  const u=((h>>>0)%10000)/10000, v=(((h>>>0)/10000|0)%10000)/10000;
  const d=minM+(maxM-minM)*u, ang=v*2*Math.PI;
  return {lat:pt.lat+(d*Math.cos(ang))/111320, lng:pt.lng+(d*Math.sin(ang))/(111320*Math.cos(pt.lat*Math.PI/180))};
}
function routeLeg(profile,a,b){
  const url=`${ROUTE_API}/routed-${profile}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  return fetch(url).then(r=>r.json()).then(d=>{
    const r=d.routes&&d.routes[0]; if(!r) throw 0;
    return {line:r.geometry.coordinates.map(c=>[c[1],c[0]]), m:r.distance, s:r.duration};
  }).catch(()=>{                                  /* no routing: straight line, estimated time */
    const m=kmBetween(a,b)*1000*1.3, speed=profile==="foot"?1.35:4.4;
    return {line:[[a.lat,a.lng],[b.lat,b.lng]], m, s:m/speed, approx:true};
  });
}
const fmtMin = s => { const m=Math.max(1,Math.round(s/60)); return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`; };
const fmtDist = m => m<1000?`${Math.round(m/10)*10} m`:`${(m/1000).toFixed(1).replace(".",",")} km`;
function tripSummary(html){ const el=document.getElementById("tripsum"); if(el) el.innerHTML=html; }
const EXAMPLE_NOTE = `<p class="note">Vélo et zone de stationnement donnés à titre d'exemple : les vélos libres en temps réel sont dans l'application Voi.</p>`;

/* Vélos Voi autour du départ (positions d'exemple : les vélos libres en temps réel ne sont
   visibles que dans l'application). Mélange de vélos seuls et de zones Voi avec plusieurs vélos.
   Triés du plus proche au plus loin ; le premier est sélectionné par défaut. */
function bikeSpots(dep){
  const out=[];
  for(let k=0;k<6;k++){
    const p=nearby(dep,90+k*55,170+k*75,"bike"+k);
    const h=Math.abs(Math.round((p.lat*1e5+p.lng*1e5)))%100;
    const zone = k===1 || k===4;
    out.push({lat:p.lat,lng:p.lng,zone,n:zone?2+h%5:1,bat:40+h%60});
  }
  return out.sort((a,b)=>kmBetween(dep,a)-kmBetween(dep,b));
}
/* ----- prix estimé d'un trajet -----
   Tarif de la ville du départ : tableau de la page ville (CITIES), sinon CITY_PRICES.
   Prix = déverrouillage + prix/minute × minutes de vélo commencées (la marche n'est pas payée).
   Si un pass (30 min, 1 h…) coûte moins cher pour cette durée, on l'indique. */
const parseNum = s => parseFloat(String(s).replace(/\s/g,"").replace(",","."));
function cityRate(city){
  const c=CITIES.find(x=>x.name===city.name);
  let txt=null, rows=[], label="à la minute";
  if(c && c.prices){
    rows=c.prices;
    const r=rows.find(r=>/minute|course/i.test(r[0]) && /\/ ?min/.test(r[2])) || rows.find(r=>/\/ ?min/.test(r[2]));
    txt=r && r[2];
    if(r && !/^à la (minute|course)$/i.test(r[0])) label=r[0].toLowerCase();
  }
  if(!txt && CITY_PRICES[city.name]) txt=CITY_PRICES[city.name][0];
  if(!txt) return null;
  const cur=(txt.match(/€|£|kr|zł|CHF/)||["€"])[0];
  const m=txt.match(/(?:([\d,.]+)\s*(?:€|£|kr|zł|CHF)\s*\+\s*)?([\d,.]+)\s*(?:€|£|kr|zł|CHF)\s*\/\s*min/);
  if(!m) return null;
  const passes=rows.map(r=>{ const d=r[0].match(/Pass\s*(\d+)\s*(minutes?|min|heures?|h)\b/i); const v=String(r[2]).match(/^([\d,.]+)\s*€$/);
    return d&&v?{name:r[0], min:+d[1]*(/^h/i.test(d[2])?60:1), price:parseNum(v[1])}:null; }).filter(Boolean);
  return {unlock:m[1]?parseNum(m[1]):0, perMin:parseNum(m[2]), cur, passes, label};
}
const fmtMoney = (v,cur) => cur==="€" ? v.toFixed(2).replace(".",",")+" €" : cur==="£" ? "£"+v.toFixed(2) : v.toFixed(2).replace(".",",")+" "+cur;
function tripPrice(city,rideSec){
  const r=city && cityRate(city); if(!r) return {inline:"",note:""};
  const mins=Math.max(1,Math.ceil(rideSec/60)), payg=r.unlock+r.perMin*mins;
  const pass=r.passes.filter(p=>p.min>=mins && p.price<payg).sort((a,b)=>a.price-b.price)[0];
  const detail=(r.unlock?fmtMoney(r.unlock,r.cur)+" + ":"")+`${mins} min × ${fmtMoney(r.perMin,r.cur)}`;
  return { inline:`<span class="tprice" title="Prix estimé ${esc(r.label)} : ${detail}">≈ ${fmtMoney(payg,r.cur)}</span>`,
           note:`<p class="note">Prix estimé ${esc(r.label)} : ${detail}${pass?` · ou <b>${esc(pass.name)} : ${fmtMoney(pass.price,r.cur)}</b>`:""}.</p>` };
}
async function drawTrip(){
  const my=++TRIP.seq;
  if(!TRIP.dep) return;
  if(!await ensureStreetMap() || my!==TRIP.seq) return;
  const map=TRIP.map, lay=TRIP.layer; lay.clearLayers();
  const dep=TRIP.dep, dst=TRIP.dst;
  L.marker([dep.lat,dep.lng],{icon:mk("me","",18),zIndexOffset:500}).bindTooltip("Vous êtes ici",{direction:"top",offset:[0,-12],className:"tlab"}).addTo(lay);
  const city=bikesAt(dep);
  if(!city){
    map.setView([dep.lat,dep.lng],16);
    if(dst){ L.marker([dst.lat,dst.lng],{icon:mk("dest","",18)}).bindTooltip("Destination",{direction:"top",offset:[0,-12],className:"tlab"}).addTo(lay);
             map.fitBounds(L.latLngBounds([[dep.lat,dep.lng],[dst.lat,dst.lng]]),{padding:[50,50]}); }
    tripSummary(`<span class="msg">Aucun vélo Voi à proximité de votre position de départ.</span>`);
    return;
  }
  const spots=bikeSpots(dep);
  if(TRIP.bikeIdx==null || !spots[TRIP.bikeIdx]) TRIP.bikeIdx=0;
  const sel=spots[TRIP.bikeIdx];
  if(!TRIP.keepView) map.setView([dep.lat,dep.lng],17);
  tripSummary(`<span class="msg">Itinéraire vers ${sel.zone?"la zone Voi":"le vélo"} sélectionné…</span>`);
  const walk1=await routeLeg("foot",dep,sel);
  if(my!==TRIP.seq) return;
  const bike=[sel.lat,sel.lng];
  L.polyline(walk1.line.concat([bike]),{color:"#4A4240",weight:4,dashArray:"2 9",lineCap:"round"}).addTo(lay);
  spots.forEach((s,k)=>{
    const on=k===TRIP.bikeIdx, walkMin=Math.max(1,Math.round(kmBetween(dep,s)*1000*1.3/1.35/60));
    const html=s.zone?`${BIKE_ICON}<b class="cnt">${s.n}</b>`:BIKE_ICON;
    const tip=on ? (s.zone?`Zone Voi · ${s.n} vélos`:"Vélo Voi sélectionné")
                 : `${s.zone?`Zone Voi · ${s.n} vélos`:`Vélo Voi · 🔋 ${s.bat} %`} · ${walkMin} min à pied<br><small>Cliquez pour y aller</small>`;
    L.marker([s.lat,s.lng],{icon:mk("bike"+(on?" on":" alt")+(s.zone?" zone":""),html,on?32:(s.zone?28:24)),zIndexOffset:on?450:380,keyboard:true,title:s.zone?"Zone Voi":"Vélo Voi"})
      .bindTooltip(tip,{direction:"top",offset:[0,on?-17:-14],className:"tlab",permanent:on})
      .on("click",()=>{ if(k===TRIP.bikeIdx) return; TRIP.bikeIdx=k; TRIP.keepView=true; drawTrip().finally(()=>TRIP.keepView=false); })
      .addTo(lay);
  });
  if(!dst){
    map.fitBounds(L.latLngBounds([[dep.lat,dep.lng]].concat(spots.map(s=>[s.lat,s.lng]))),{padding:[60,60],maxZoom:17});
    tripSummary(`<div class="steps"><span class="st"><i></i>🚶 ${fmtMin(walk1.s)} jusqu'${sel.zone?"à la zone Voi":"au vélo"} · ${fmtDist(walk1.m)}</span><span class="msg">Touchez un autre vélo sur la carte pour changer. Ajoutez votre destination pour voir le trajet.</span></div>${EXAMPLE_NOTE}`);
    return;
  }
  if(kmBetween(dep,dst)>MAX_TRIP_KM){
    L.marker([dst.lat,dst.lng],{icon:mk("dest","",18)}).bindTooltip("Destination",{direction:"top",offset:[0,-12],className:"tlab"}).addTo(lay);
    map.fitBounds(L.latLngBounds([[dep.lat,dep.lng],[dst.lat,dst.lng]]),{padding:[50,50]});
    tripSummary(`<span class="msg">Destination trop éloignée pour un trajet à vélo (plus de ${MAX_TRIP_KM} km).</span>`);
    return;
  }
  tripSummary(`<span class="msg">Calcul du trajet…</span>`);
  const bikePt={lat:bike[0],lng:bike[1]};
  const ride=await routeLeg("bike",bikePt,nearby(dst,50,140,"park"));
  if(my!==TRIP.seq) return;
  const park=ride.line[ride.line.length-1];
  const walk2=await routeLeg("foot",{lat:park[0],lng:park[1]},dst);
  if(my!==TRIP.seq) return;
  L.polyline(ride.line,{color:"#F26A5E",weight:6,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(lay);
  L.polyline(walk2.line,{color:"#4A4240",weight:4,dashArray:"2 9",lineCap:"round"}).addTo(lay);
  L.marker(park,{icon:mk("park","P",24),zIndexOffset:300}).bindTooltip("Rendre le vélo",{direction:"top",offset:[0,-14],className:"tlab"}).addTo(lay);
  L.marker([dst.lat,dst.lng],{icon:mk("dest","",18),zIndexOffset:350}).bindTooltip("Destination",{direction:"top",offset:[0,-12],className:"tlab"}).addTo(lay);
  map.fitBounds(L.latLngBounds([[dep.lat,dep.lng],bike,park,[dst.lat,dst.lng]].concat(ride.line)),{padding:[40,40]});
  const total=walk1.s+ride.s+walk2.s, price=tripPrice(city,ride.s);
  tripSummary(`<div class="steps">
      <span class="st"><i></i>🚶 ${fmtMin(walk1.s)}</span>
      <span class="st"><i class="ride"></i>🚲 ${fmtMin(ride.s)} · ${fmtDist(ride.m)}</span>
      <span class="st"><i></i>🚶 ${fmtMin(walk2.s)}</span>
      <span class="tot">${fmtMin(total)}${price.inline}</span>
    </div>${price.note}<p class="note pick">🚲 ${spots.length} vélos Voi autour du départ : touchez-en un sur la carte pour recalculer le trajet depuis celui-ci.</p>${(walk1.approx||ride.approx||walk2.approx)?`<p class="note">Itinéraire indisponible : tracé et durée approximatifs.</p>`:""}${EXAMPLE_NOTE}`);
}

function setupDeparture(pageCity){
  TRIP.dep=null; TRIP.dst=null; TRIP.bikeIdx=null; TRIP.seq++; TRIP.map=null;
  const inp=document.getElementById("dep");
  const dstInp=document.getElementById("dst");
  addressField(inp,document.getElementById("sugg"),pageCity,{
    onTyping:q=>{ setPill(q.length>=3?"wait":"", q.length>=3?"Vérification…":q?"Continuez à saisir l'adresse…":"Saisissez une adresse de départ"); },
    onTop:p=>{ if(p) pillForPoint(p); else setPill("no","Adresse introuvable"); },
    onPick:(p)=>{ pillForPoint(p); TRIP.dep=p; TRIP.bikeIdx=null; drawTrip(); },

  });
  addressField(dstInp,document.getElementById("sugg2"),pageCity,{
    onPick:(p)=>{ TRIP.dst=p; drawTrip(); }
  });
}

function renderQuiz(){
  document.title="Quiz sécurité — Voi";
  let i=0, score=0; const answers=[];
  const L="ABC";
  const draw=()=>{
    if(i>=QUIZ.length) return drawEnd();
    const Q=QUIZ[i];
    $app.innerHTML=`
    <div class="wrap"><section class="quiz">
      <div class="crumbs" style="padding-top:0"><a href="#securite">Sécurité</a> / Quiz</div>
      <div class="qtop" style="margin-top:18px"><span>Question ${i+1} sur ${QUIZ.length}</span><span>Score : ${score}</span></div>
      <div class="qbar"><i style="width:${i/QUIZ.length*100}%"></i></div>
      <h1>${esc(Q.q)}</h1>
      <div class="qopts">${Q.a.map((t,k)=>`<button type="button" class="qopt" data-k="${k}"><span class="k">${L[k]}</span>${esc(t)}</button>`).join("")}</div>
      <div id="qafter"></div>
    </section></div>`;
    const btns=[...$app.querySelectorAll(".qopt")];
    btns.forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k, good=k===Q.ok;
      if(good) score++;
      answers.push(good);
      btns.forEach(x=>{ x.disabled=true; if(+x.dataset.k===Q.ok) x.classList.add("ok"); });
      if(!good) b.classList.add("ko");
      $app.querySelector(".qtop span:last-child").textContent=`Score : ${score}`;
      $app.querySelector(".qbar i").style.width=`${(i+1)/QUIZ.length*100}%`;
      const last=i===QUIZ.length-1;
      document.getElementById("qafter").innerHTML=`
        <div class="qexp"><b>${good?"✓ Bonne réponse !":"✗ Pas tout à fait."}</b> ${esc(Q.e)}</div>
        <button type="button" class="btn qnext" id="qnext">${last?"Voir mon score":"Question suivante →"}</button>`;
      const nx=document.getElementById("qnext"); nx.focus({preventScroll:true});
      nx.addEventListener("click",()=>{ i++; draw(); window.scrollTo(0,0); });
    }));
  };
  const drawEnd=()=>{
    const msg = score===10?"Parfait ! Vous êtes prêt à rouler en toute sécurité."
              : score>=7?"Très bien ! Revoyez les quelques points manqués avant votre prochain trajet."
              : "Prenez un moment pour relire les règles : votre sécurité en dépend.";
    $app.innerHTML=`
    <div class="wrap"><section class="quiz">
      <div class="crumbs" style="padding-top:0"><a href="#securite">Sécurité</a> / Quiz</div>
      <div class="qscore">${score}/${QUIZ.length}</div>
      <h1>${esc(msg)}</h1>
      <div class="cta-row" style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
        <button type="button" class="btn coral" id="qagain">Recommencer le quiz</button>
        <a class="btn ghost" href="#securite">Revoir les règles</a>
      </div>
      <ul class="qrecap">${QUIZ.map((Q,k)=>`<li><span class="mk ${answers[k]?"ok":"ko"}">${answers[k]?"✓":"✗"}</span><span>${esc(Q.q)}<small>${esc(Q.a[Q.ok])}</small></span></li>`).join("")}</ul>
    </section></div>`;
    document.getElementById("qagain").addEventListener("click",()=>{ i=0; score=0; answers.length=0; draw(); window.scrollTo(0,0); });
  };
  draw();
}

/* ---------------- ROUTER ----------------
   The current page is kept in CURRENT instead of being read from the URL, so
   changing page also works where the address bar can't change (previews,
   embedded frames). Internal links lose their href and keep their target in
   data-to: some previews block every click on an <a href>. */
let CURRENT=(location.hash||"").slice(1);
function navTo(id){
  if(id===CURRENT){ return; }
  CURRENT=id;
  try{ history.pushState(null,"","#"+id); }catch(e){}
  route();
}
function unlinkInternal(){
  document.querySelectorAll('a[href^="#"]:not([href="#"])').forEach(a=>{
    if(a.closest(".leaflet-container")) return;
    a.dataset.to=a.getAttribute("href").slice(1);
    a.removeAttribute("href");
    a.setAttribute("role","link"); if(!a.hasAttribute("tabindex")) a.tabIndex=0;
  });
}
new MutationObserver(muts=>{ if(muts.some(m=>m.addedNodes.length)) unlinkInternal(); })
  .observe(document.documentElement,{childList:true,subtree:true});
function onNav(e){
  const a=e.target.closest && e.target.closest("[data-to]");
  if(!a) return;
  if(e.type==="keydown" && e.key!=="Enter") return;
  e.preventDefault(); e.stopPropagation();
  navTo(a.dataset.to);
}
document.addEventListener("click",onNav,true);
document.addEventListener("keydown",onNav,true);
const syncFromUrl=()=>{ const id=(location.hash||"").slice(1); if(id!==CURRENT){ CURRENT=id; route(); } };
function initCarousels(){ document.querySelectorAll(".acar-track").forEach(acarDots); }
function route(){
  const id=CURRENT;
  VIEW.spotsFor=null;
  const country=COUNTRIES.find(x=>x.id===id);
  const city=CITIES.find(x=>x.id===id);
  const welcome=id.startsWith("ville/") ? ALL.find(x=>x.slug===id.slice(6)) : null;
  const safety = id==="securite" || id==="securite/quiz";
  const faq = id==="faq";
  if(faq) renderFaq();
  else if(id==="securite") renderSafety();
  else if(id==="securite/quiz") renderQuiz();
  else if(welcome) renderWelcome(welcome);
  else if(country) renderCountry(country);
  else if(city) renderCity(city);
  else renderHub();
  document.getElementById("nav-pays").classList.toggle("on", !city && !welcome && !safety && !faq);
  document.getElementById("nav-secu").classList.toggle("on", safety);
  document.getElementById("nav-faq").classList.toggle("on", faq);
  if(welcome || safety || faq) window.scrollTo(0,0);
  else if(country || city) scrollToMap("auto");
  else window.scrollTo(0,0);
  closeArticle(); requestAnimationFrame(initCarousels);
}
window.addEventListener("hashchange",syncFromUrl);
window.addEventListener("popstate",syncFromUrl);
unlinkInternal();
ARTICLES_READY.then(route,route);
