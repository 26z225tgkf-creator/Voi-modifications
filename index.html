"Veiligheid", "", "Download de app", "Voi in Europa", "In welke landen kun je rijden met", "Deelfietsen en -steps in meer dan 130 Europese steden. Kies een land op de kaart of in de lijst om de steden te zien.", "landen", "steden in Europa", "voertuigen", "ritten gemaakt", "Stad met Voi", "Stadsdeel / gemeente", "Geselecteerde stad", "De derde markt van Voi in 2026: e-bikes in Parijs en Nantes, fietsen en steps in Marseille, Grenoble, Le Havre en de Yvelines.", "Bekijk steden ▾", "De grootste markt van Voi, met meer dan 50 actieve steden — van Berlijn, de Europese hoofdstad van micromobiliteit, tot Maagdenburg, waar Voi de enige aanbieder is.", "Elektrische fietsen en steps in Londen en de grote universiteitssteden, plus een e-bikenetwerk in Schotland.", "Het thuisland van Voi, opgericht in Stockholm in 2018. Hier werd de nieuwe generatie voertuigen van 2026 als eerste ingezet.", "Voi-steps in Oslo (ook te reserveren in de Ruter-app), Bergen, Trondheim en Drammen.", "Voi-steps van het noorden tot het zuiden van het schiereiland: Milaan, Rome, Turijn, Bologna, Genua, Napels…", "Elektrische Voi-steps in de belangrijkste Finse steden, waaronder Helsinki en Vantaa, waar Voi een van de vergunde aanbieders is.", "Voi is actief in 16 Zwitserse steden en gemeenten. Zürich was de eerste stad van het land met de elektrische fiets Explorer 4.", "Sinds 2019 actief in Aarhus en Aalborg, en nu terug in Kopenhagen met 4.500 elektrische fietsen.", "Elektrische Voi-steps in Andalusië en Madrid.", "Elektrische Voi-steps in Lissabon en Porto.", "Elektrische Voi-fietsen en -steps in Brussel en Antwerpen.", "Meer dan 2 miljoen Voi-ritten in Wenen, en een nieuwe stad in 2026: Innsbruck.", "Sinds april 2026 het 13e land van Voi: 800 fietsen (elektrisch en gewoon) in de regio's Amersfoort en Gooi & Vechtstreek. Je kunt een fiets in de ene gemeente pakken en in een andere terugzetten.", "Voi is hier nog niet beschikbaar. Open de app om de dekking bij jou in de buurt te bekijken.", "Hoe het werkt", "Download de app", "Gratis in de App Store en Google Play. Maak een account aan en voeg een betaalmethode toe.", "Zoek & scan", "De kaart toont de beschikbare voertuigen bij jou in de buurt. Scan de QR-code om te ontgrendelen.", "Rijd & parkeer", "Eindig in een toegestane parkeerzone, maak een foto en klaar.", "Klaar om te rijden?", "Download de Voi-app en vind het dichtstbijzijnde voertuig.", "© Voi Technology — Elektrische deelfietsen en -steps in Europa", "Actuele dekking en tarieven: bekijk de Voi-app.", "Voi — home", "Land of stad (bijv. München, Rezé…)", "Zoek een land of stad", "Voi in Europa — Onze landen", "Hulp", "Veelgestelde", "vragen", "Alles wat je moet weten voor je eerste Voi-rit: registratie, ontgrendelen, tarieven, veiligheid en hulp.", "Alle", "Aan de slag", "Tijdens de rit", "Tarieven en betaling", "Problemen en hulp", "Hoe begin ik met Voi?", "Download de Voi-app in de App Store of Google Play, maak een account aan met je telefoonnummer of e-mailadres en voeg een betaalmethode toe. Daarna zoek je een voertuig op de kaart en kun je vertrekken.", "Hoe oud moet je zijn om een Voi-voertuig te huren?", "Meestal moet je 18 zijn. In sommige landen of steden kan de minimumleeftijd anders zijn: die staat in de app bij het registreren.", "Heb ik een rijbewijs nodig?", "Nee, je hebt geen rijbewijs nodig om een Voi-fiets of -step te huren. In sommige landen kan de app wel om een identiteitscontrole vragen.", "In welke steden is Voi beschikbaar?", "Voi is actief in meer dan 130 steden in 14 Europese landen. Bekijk ‘Onze landen’ of open de app om de beschikbare voertuigen bij jou in de buurt te zien.", "Hoe ontgrendel ik een fiets of step?", "Open de app, kies een voertuig op de kaart en scan de QR-code op het stuur. Het voertuig wordt binnen enkele seconden ontgrendeld.", "Kan ik een voertuig vooraf reserveren?", "Afhankelijk van de stad kun je in de app een voertuig een paar minuten reserveren, zodat je er rustig naartoe kunt lopen. De optie verschijnt wanneer je een voertuig selecteert.", "Kan ik mijn rit pauzeren?", "In veel steden kun je je rit in de app pauzeren: het voertuig blijft vergrendeld en voor jou gereserveerd. De pauze wordt wel aangerekend, tegen het tarief in de app.", "Waar mag ik rijden?", "Op fietspaden en fietsstroken als die er zijn, anders op de rijbaan. Het trottoir is verboden. Sommige zones in de stad beperken de snelheid of verbieden het rijden: ze staan in kleur op de kaart in de app.", "Hoe beëindig ik mijn rit?", "Parkeer in een toegestane parkeerzone uit de app, tik op ‘Rit beëindigen’ en maak een foto van het goed geparkeerde voertuig. De rit wordt dan afgesloten en afgerekend.", "Wat kost een rit?", "De prijs hangt af van de stad: meestal ontgrendelkosten plus een prijs per minuut. Bijvoorbeeld € 0,25/min zonder ontgrendelkosten in Parijs, € 0,49 + € 0,25/min in Grenoble, € 1 + € 0,20/min in Marseille: elke stadspagina vermeldt de tarieven.", "Zijn er passen of abonnementen?", "Ja, afhankelijk van de stad biedt de app passen (per dag, per maand…) en minutenbundels die goedkoper uitvallen als je vaak rijdt. Je vindt ze in het speciale onderdeel van de app.", "Welke betaalmethoden worden geaccepteerd?", "Bankkaarten en, afhankelijk van het land, Apple Pay, Google Pay of andere lokale betaalmethoden. Je voegt ze toe en beheert ze in de app.", "Waarom zijn er extra kosten aangerekend?", "Er kunnen kosten gelden als het voertuig buiten een toegestane zone wordt geparkeerd of buiten het servicegebied wordt achtergelaten. De details van elke rit staan in je geschiedenis. Twijfel je, neem dan via de app contact op met de klantenservice.", "Is een helm verplicht?", "Hij wordt bij elke rit sterk aangeraden en is in sommige gevallen verplicht, bijvoorbeeld op een step buiten de bebouwde kom in Frankrijk. Voi levert geen helm: neem je eigen helm mee.", "Mag je met z'n tweeën op een step?", "Nee. Een Voi-voertuig vervoert maar één persoon, zonder passagier of kind.", "Kan ik rijden in de regen of 's nachts?", "Ja, maar voorzichtig: rij langzamer op een natte ondergrond, want de remafstand wordt langer. 's Nachts gaan de lichten automatisch aan; draag indien mogelijk reflecterende kleding.", "Bekijk de veiligheidsregels →", "Wat moet ik doen bij een ongeval?", "Zorg dat je veilig bent en bel de hulpdiensten als iemand gewond is (112 in heel Europa). Meld het ongeval daarna aan Voi via het hulpgedeelte van de app.", "Het voertuig is beschadigd of werkt niet: wat nu?", "Gebruik het niet. Meld het probleem in de app (voertuigkaart of hulpgedeelte) en kies een ander voertuig. Je meldingen helpen de teams van Voi snel in te grijpen.", "De batterij is bijna leeg: wat gebeurt er?", "Het batterijniveau van elk voertuig zie je voordat je het ontgrendelt. Raakt de batterij tijdens de rit leeg, dan kan de snelheid worden verlaagd: beëindig je rit in een toegestane zone en neem een ander voertuig.", "Mijn rit wil niet stoppen: wat nu?", "Controleer of je in een toegestane parkeerzone staat en of je telefoon bereik heeft en locatie aanstaat. Blijft het probleem, neem dan via de app contact op met de klantenservice zonder het voertuig te verlaten.", "Ik ben iets vergeten op een voertuig of heb hulp nodig", "Neem contact op met de klantenservice van Voi via het hulpgedeelte van de app en vermeld om welke rit het gaat.", "Hoe verwijder ik mijn account?", "Je kunt de verwijdering van je account aanvragen via de instellingen van de app of door contact op te nemen met de klantenservice.", "Categorieën", "FAQ — Veelgestelde vragen | Voi", "Rij", "veilig", ", bij elke rit", "Elektrische fiets of step: een paar eenvoudige regels beschermen jou en andere weggebruikers. Fris ze op en test jezelf met onze quiz.", "Op het fietspad", "Rij op fietspaden en fietsstroken, anders op de rijbaan. Nooit op het trottoir.", "Maximaal 25 km/h", "Pas je snelheid aan het verkeer, voetgangers en de staat van de weg aan.", "Eén persoon", "Eén voertuig, één berijder: geen passagier, geen kind v Van de ene gemeente naar de andere", "Je kunt een fiets in de ene gemeente pakken en in een andere gemeente in de zone terugzetten.", "‘Welke fietsroute kan ik veilig met kinderen in Parijs doen?’", "Met kinderen is de juiste route kort, vlak, weg van auto's en met pauzes. Hier zijn drie tochten in Parijs die aan alles voldoen.", "1. Het Bassin de la Villette en het Parc de la Villette", "Afstand: ongeveer 2,5 km van Stalingrad naar het Parc de la Villette, enkele reis.", "Niveau: heel makkelijk, helemaal vlak.", "Het extraatje: de kades langs het bassin zijn autovrij en het park heeft grote speeltuinen, waaronder de beroemde Drakenglijbaan.", "Wil je verder, dan loopt het fietspad door langs het Canal de l'Ourcq richting Pantin. Let op: de Voi-zone van Parijs stopt bij de stadsgrens. Parkeer de fiets weer in Parijs om de huur te beëindigen.", "2. Rondje Lac Daumesnil, Bois de Vincennes", "Afstand: ongeveer 2 km voor de lus rond het meer, tot 6 km als je doorrijdt in het bos.", "Niveau: makkelijk.", "Het extraatje: roeiboten te huur op het meer, grote grasvelden om te picknicken en het Parc Floral vlakbij.", "3. De autovrije Seine-oevers", "Afstand: ongeveer 2 km op de linkeroever (van het Musée d'Orsay naar de Pont de l'Alma), 3 km op de rechteroever (van de Tuileries naar het Hôtel de Ville).", "Niveau: makkelijk, maar erg druk in het weekend.", "Het extraatje: uitzicht op de monumenten, zonder auto's. Rij stapvoets: voetgangers hebben voorrang.", "Vanaf welke leeftijd kan een kind meefietsen op een eigen fiets?", "Er is geen officiële leeftijd. Meestal kan een kind dat goed fietst en op verzoek kan remmen en stoppen vanaf 6 of 7 jaar meefietsen op een apart pad, en in de stad op een fietspad eerder vanaf 9 of 10 jaar. Laat het voor je rijden zodat je het in het oog houdt.", "💡 Goed om te weten", "Een helm is op de fiets verplicht voor kinderen onder de 12, of ze nu zelf trappen of passagier zijn. Een Voi-fiets vervoert maar één persoon: het kind rijdt dus op zijn eigen fiets. De minimumleeftijd om een Voi-fiets te huren staat in de app.", "Foto:", "Sluiten", "‘Idee voor een fietstochtje op zondag bij mij in de buurt’", "Op zondag is de stad rustiger en dat is het beste moment om haar op de fiets te herontdekken. Hier is een idee voor een uitje in elke Franse stad waar Voi actief is.", "Eén idee per stad", "Parijs: op zondag zijn sommige straten en wijken voorbehouden aan voetgangers en fietsers (actie ‘Paris Respire’). Ideaal om rustig van het Canal Saint-Martin naar Montmartre te fietsen.", "Nantes: fiets langs de Erdre vanuit het centrum naar het Île de Versailles met zijn Japanse tuin en volg dan de rivier naar het noorden.", "Marseille: de Corniche Kennedy, van de Oude Haven naar de stranden van de Prado, met een stop bij de Vallon des Auffes.", "Grenoble: de kades van de Isère aan de voet van de Bastille en daarna het Parc Paul-Mistral.", "Le Havre: de boulevard, van het strand tot Sainte-Adresse, met uitzicht op zee.", "Saint-Quentin-en-Yvelines: een rondje om het recreatie-eiland en de vijver.", "Markten, terrasjes aan het water en brunches", "Op zondagochtend hebben de meeste wijken een markt: de kans om een mand te vullen voor een picknick. Zoek 's middags een terras aan het water; in de zomer gaan de guinguettes langs de kanalen en rivieren weer open.", "Autovrije straten", "Veel steden sluiten op zondag sommige straten voor auto's of houden één keer per jaar een ‘autoloze dag’. De data veranderen elk jaar: kijk op de website van je gemeente voordat je vertrekt.", "Op zondag zijn de fietsen bij parken en oevers snel weg. Open de app iets eerder om de dichtstbijzijnde te vinden.", "‘Originele date-ideeën in Parijs’", "Een date op de fiets is ontspannener dan een etentje met z'n tweeën: je praat tijdens het fietsen, stopt waar je wilt en de stad is het decor.", "De mooiste zonsondergangen", "Het Square du Vert-Galant, op de punt van het Île de la Cité, vlak aan het water.", "De Pont Alexandre-III, met de Eiffeltoren en de Invalides aan weerszijden.", "Het Parc de Belleville, een van de mooiste uitzichten over heel Parijs.", "De Sacré-Cœur: de klim is steil, maar de elektrische ondersteuning doet het werk.", "Waar stoppen", "Voor een drankje zijn de kades van het Canal Saint-Martin en het Bassin de la Villette tot 's avonds laat gezellig. Neem voor een picknick een kleed mee en ga zitten aan de Seine of op het Champ-de-Mars.", "De formule ‘1 uur, 1 tocht, 1 ijsje’", "Vertrek bij de Jardin des Tuileries.", "De kades op de rechteroever tot het Hôtel de Ville, ongeveer 15 minuten.", "Steek over naar het Île Saint-Louis, bekend om zijn ijssalons.", "Rustig terug over de kades op de linkeroever tot het Musée d'Orsay.", "Parkeer de fietsen voordat je gaat zitten: gebruik op de kades en eilanden de toegestane fietsplekken uit de app.", "‘Wat zie je in Marseille in 1 dag?’", "Eén dag is genoeg om het belangrijkste van een stad op de fiets te zien, als je de volgorde goed kiest. Voorbeeld: Marseille, waar Voi fietsen en steps aanbiedt.", "De route", "9 uur · De Oude Haven, vóór de drukte: de vismarkt op de kade.", "10 uur · Het Mucem en het Fort Saint-Jean, langs de haven.", "11 uur · Le Panier, de oudste wijk van de stad. De steegjes zijn steil en vaak met trappen: parkeer de fiets beneden en ga te voet verder.", "14 uur · De Corniche Kennedy, langs de zee, tot de Vallon des Auffes.", "16 uur · De stranden van de Prado en het Parc Borély om rustig af te sluiten.", "Het verborgen plekje", "De Vallon des Auffes, een klein vissershaventje verstopt onder de corniche, met zijn hutjes en kleurige bootjes. Je gaat er via een trap naartoe: laat de fiets op de corniche staan.", "De volgorde die heuvels en drukte vermijdt", "Begin vroeg in de ochtend in het centrum, als het nog koel en rustig is, en volg dan de zee naar het zuiden: de corniche is bijna vlak. Notre-Dame-de-la-Garde is de enige echte klim; met elektrische ondersteuning gaat dat, maar bewaar hem voor het eind van de ochtend, vóór de hitte.", "Waar eten", "Rond de Oude Haven voor de lunch, of een picknick met zeezicht op de corniche. Bij de Vallon des Auffes vind je visrestaurants.", "In Marseille worden steps in stations geparkeerd. Laat nooit een voertuig achter bij het water, in de Oude Haven of op de corniche.", "‘Waar maak je mooie foto's in Parijs?’", "De fiets is ideaal voor fotografie: je gaat van plek naar plek zonder de metro te zoeken en kunt terugkomen als het licht beter is.", "De lus, op volgorde", "Het Trocadéro bij zonsopgang, voor de Eiffeltoren zonder drukte.", "De Pont de Bir-Hakeim en zijn zuilengalerij, 's ochtends.", "De Pont Alexandre-III, in het zachte licht van de late ochtend.", "De piramide van het Louvre, vroeg of laat voor de reflecties.", "Het Square du Vert-Galant, op de punt van het Île de la Cité.", "De Place des Vosges en zijn arcaden, 's middags in de schaduw.", "Het Canal Saint-Martin, de loopbruggen en sluizen, 's middags.", "Het Parc de Belleville, uitzicht over heel Parijs aan het eind van de dag.", "De trappen van Montmartre, tijdens het gouden uur.", "De Sacré-Cœur, bij zonsondergang.", "Tips", "Het ‘gouden uur’, ongeveer een uur na zonsopgang en voor zonsondergang, geeft het mooiste licht.", "Parkeer de fiets voordat je de camera pakt: nooit fotograferen tijdens het rijden.", "Wees in bewoonde, veel gefotografeerde straten discreet en respecteer de bewoners.", "Doe de lus in twee delen: 's ochtends het westen (Trocadéro, bruggen, Louvre), 's avonds het oosten en noorden (kanaal, Belleville, Montmartre).", "‘Hoeveel calorieën verbrand je op een e-bike?’", "Vaak denkt men dat de elektrische ondersteuning al het werk doet. In werkelijkheid moet je trappen om haar te laten werken: een e-bike blijft lichaamsbeweging.", "Wat de onderzoeken zeggen", "Europese mobiliteitsonderzoeken tonen dat e-bikers langere en vaker ritten maken dan gewone fietsers. In totaal is hun wekelijkse lichaamsbeweging vergelijkbaar. De inspanning per minuut is lichter, maar ze rijden vaker.", "Wat calorieën betreft hangt alles af van het ondersteuningsniveau, je gewicht en het reliëf: reken grofweg op een paar honderd kilocalorieën per uur, minder dan op een gewone fiets en veel meer dan zittend in de metro.", "De Wereldgezondheidsorganisatie raadt minstens 150 minuten matige activiteit per week aan. Twee ritten van 15 minuten per werkdag zijn genoeg.", "Eenvoudige uitdagingen", "Vervang 2 ritten per week door de fiets, bijvoorbeeld op maandag en vrijdag.", "Een halte eerder uitstappen en verder fietsen.", "Een heuvel op met minder ondersteuning: Montmartre, de Bastille in Grenoble, Notre-Dame-de-la-Garde in Marseille.", "Houd je ritten een maand bij en zie de kilometers oplopen.", "Voorbeeld (fictief)", "‘Vroeger deed ik Bastille – Canal Saint-Martin met de metro. Nu fiets ik: 11 minuten, en ik wacht niet meer op het perron.’ — Camille, 29 jaar. Deze getuigenis is een verzonnen voorbeeld ter illustratie van het artikel.", "Begin rustig: een of twee korte ritten in de eerste week en bouw dan op. Regelmaat is het belangrijkst.", "‘Waar kun je bij Grenoble lekker aan het water zitten?’", "Je hoeft niet ver te gaan voor wat groen: in elke Voi-stad ligt een plek aan het water of in de natuur op minder dan 30 minuten fietsen.", "Per stad", "Grenoble: de oevers van de Isère en het Parc Paul-Mistral om te picknicken met uitzicht op de bergen; de Jardin de Ville aan de voet van de Bastille.", "Parijs: het Bassin de la Villette, met bewaakt zwemmen in de zomer; sinds 2025 zijn er 's zomers ook zwemplekken in de Seine. Het Bois de Vincennes en zijn meren om te picknicken.", "Nantes: de oevers van de Erdre en het Île de Versailles; aan de Loire de terrasjes en guinguettes van het Île de Nantes.", "Marseille: de stranden van de Prado en Les Catalans, op een paar minuten van het centrum; het Parc Borély voor de schaduw.", "Wat neem je mee", "Een rugzak: Voi-fietsen hebben geen kinderzitje of aanhanger.", "Water, zonnebrand, een kleed.", "Een zak om je afval mee terug te nemen.", "Waar laat je de fiets ter plaatse", "Controleer voor vertrek in de app of je bestemming in de Voi-zone ligt en zoek de dichtstbijzijnde parkeerzone. Parkeer bij de ingang van het park of strand, nooit op het zand of aan het water.", "De tijden en plekken voor bewaakt zwemmen veranderen elke zomer: kijk op de website van de gemeente voordat je gaat.", "‘Na een avondje uit naar huis fietsen, goed idee?’", "Een fiets is handig om naar huis te gaan als er weinig openbaar vervoer is. Maar 's nachts zie je minder en word je minder gezien. Een paar goede gewoontes zijn genoeg.", "Kies de juiste route", "Kies grote wegen met fietspaden, die beter verlicht zijn, ook al is het iets langer.", "Vermijd 's nachts parken en oevers: slecht verlicht en soms gesloten.", "Bekijk je route voordat je het feest verlaat, niet tijdens het rijden.", "Zorg dat je zichtbaar bent", "Voi-fietsen hebben voor- en achterlicht: controleer of ze werken voordat je vertrekt. Lichte kleding of een reflecterende armband maakt een groot verschil. Buiten de bebouwde kom is 's nachts een reflecterend hesje verplicht op de fiets.", "Samen naar huis", "Neem ieder een fiets en rijd achter elkaar. Laat iemand weten wanneer je thuis bent.", "Wat je niet moet doen", "Fietsen na het drinken: ook op de fiets wordt alcohol bestraft, en vooral vertraagt het je reflexen. Heb je gedronken, ga dan te voet, met de taxi of met het openbaar vervoer naar huis.", "Bellen of op je scherm kijken tijdens het rijden.", "Rijden met oordopjes: het is verboden en je hoort niet wat er aankomt.", "Met z'n tweeën op één fiets: één fiets, één persoon.", "De beste avond is die je je herinnert. Twijfel je of je de fiets moet nemen, dan is het niet de juiste avond.", "‘Onbekende wijken van Parijs om te bezoeken’", "Met de metro rijd je onder de wijken door zonder ze te zien. Op de fiets ontdek je kasseistraatjes, huizen met tuin en beschilderde muren die geen enkele gids laat zien.", "De route ‘bezienswaardigheden’ (ongeveer 2 uur, 13e en 14e)", "De Butte-aux-Cailles: een echt dorp, met smalle straatjes, lage gevels en street art.", "De Cité Florale: een paar straatjes met bloemennamen (rue des Glycines, rue des Orchidées), met huizen met tuin. Stap af, het is piepklein.", "Het Parc Montsouris: pauze in een groot Engels park met meer en waterval.", "De Boulevard Vincent-Auriol: een openluchtgalerij van gigantische muurschilderingen op de gevels.", "Voor een volgende keer", "La Mouzaïa (19e): rustige, bloemrijke kasseistraatjes.", "De overdekte passages van het 2e (Galerie Vivienne, Passage des Panoramas): te voet bezoeken, met de fiets geparkeerd bij de ingang.", "De Rue Dénoyez (20e): muren vol graffiti die steeds veranderen.", "In deze wijken wonen mensen: rij stapvoets, praat zachtjes en parkeer de fiets op een toegestane plek voordat je te voet gaat rondkijken.", "‘Welke fietstocht doe je in de herfst?’", "Elk seizoen verandert de stad: dezelfde straten zien er in april heel anders uit dan in december. Hier is één tocht per seizoen.", "🌸 Lente: bomen in bloei", "De Jardin des Plantes met zijn kersenbomen, daarna het Square Jean-XXIII achter de Notre-Dame. De lente is het ideale seizoen: niet te warm en niet te koud. Een licht jasje is genoeg.", "☀️ Zomer: rijden in de schaduw", "Vertrek vroeg in de ochtend of na 18 uur. Kies het Bois de Vincennes en het Bois de Boulogne en schaduwrijke kades. Neem water, een pet en zonnebrand mee. In juli en augustus veranderen de Seine-oevers in stranden.", "🍁 Herfst: de kleuren", "De Buttes-Chaumont en het Bois de Vincennes zijn prachtig in oktober. De Jardin du Luxembourg ook, maar fietsen mogen er niet in: parkeer bij de ingang. Neem een extra laag mee en let op natte bladeren, die zijn glad.", "🎄 Winter: de lichtjes", "De verlichting van de Champs-Élysées en de etalages van de warenhuizen op de Boulevard Haussmann. Handschoenen, een muts onder je capuchon en lichten aan: het wordt vroeg donker.", "Evenementen per seizoen", "Juni: de Fête de la Musique, op 21 juni. Met de fiets ga je van het ene concert naar het andere, maar sommige straten zijn afgeladen.", "Zomer: Paris Plages en de openluchtbioscopen.", "Herfst: de Nuit Blanche, met kunstwerken door de hele stad.", "Winter: de kerstmarkten en de verlichting.", "Rem bij regen eerder en vermijd wegmarkeringen en kasseien, die erg glad zijn. De data van evenementen veranderen elk jaar: controleer ze voordat je vertrekt.", "Het trottoir is voor voetgangers. Rij op fietspaden en -stroken als die er zijn, anders op de rijbaan.", "Wat is de maximumsnelheid van een elektrische step?", "Elektrische steps zijn begrensd op 25 km/h. Rij langzamer bij voetgangers en op een natte weg.", "Met hoeveel personen mag je op een step?", "Maar één", "Twee als de tweede een kind is", "Maximaal twee volwassenen", "Eén step is één persoon. Met z'n tweeën worden evenwicht en remmen gevaarlijk.", "Wat doe je tijdens de rit met je oordopjes en telefoon?", "Eén oordopje mag", "Telefoon in de hand om de gps te volgen", "Opbergen: beide zijn verboden tijdens het rijden", "Oordopjes en een telefoon in de hand zijn verboden. Je moet horen en zien wat er om je heen gebeurt.", "Een helm is…", "Overbodig in de stad", "Sterk aangeraden en verplicht buiten de bebouwde kom", "Alleen voor fietsen", "Een helm vermindert de ernst van hoofdletsel sterk. Buiten de bebouwde kom is hij verplicht op een step.", "Vanaf welke leeftijd mag je in Frankrijk een elektrische step besturen?", "12 jaar", "14 jaar", "16 jaar", "De wettelijke minimumleeftijd is 14 jaar. De Voi-app kan een hogere minimumleeftijd hanteren om te huren.", "Wat zegt de regel als je alcohol hebt gedronken?", "Dezelfde limieten als voor automobilisten gelden", "Op een step is er geen limiet", "Alleen cannabis is verboden", "Alcohol en drugs zijn aan het stuur net zo verboden als achter het stuur. Ga na een avondje uit op een andere manier naar huis.", "Wat controleer je voordat je vertrekt?", "Niets, het voertuig is vast in orde", "Alleen de batterij", "De remmen, de banden en de verlichting", "Een snelle blik is genoeg. Klopt er iets niet, kies dan een ander voertuig en meld het probleem in de app.", "Waar parkeer je aan het einde van de rit?", "Midden op het trottoir, dan valt het op", "In een toegestane parkeerzone uit de app", "Voor de ingang van een gebouw", "Parkeer alleen in toegestane zones, zonder voetgangers, rolstoelen of kinderwagens te hinderen.", "Hoe zorg je dat anderen je 's nachts zien?", "Lichten aan en reflecterende kleding of een hesje dragen", "Regelmatig toeteren", "Midden op de weg rijden", "Lichten aan en reflecterende uitrusting. Buiten de bebouwde kom is een reflecterend hesje 's nachts verplicht.", "✓ Goed antwoord!", "✗ Niet helemaal.", "Bekijk mijn score", "Volgende vraag →", "Perfect! Je bent klaar om veilig te rijden.", "Heel goed! Bekijk de paar gemiste punten nog even voor je volgende rit.", "Neem even de tijd om de regels opnieuw te lezen: je veiligheid hangt ervan af.", "Quiz opnieuw doen", "Regels bekijken", "Adres niet gevonden", "Voeg je bestemming toe om de route te zien.", "Geen Voi-fiets in de buurt van je vertrekpunt.", "Route berekenen…", "Typ verder…", "Controleren…", "Dichtstbijzijnde fiets zoeken…", "Geen Voi-fiets op dit adres", "Fiets en parkeerzone als voorbeeld: de beschikbare fietsen in realtime zie je in de Voi-app.", "Je bent hier", "Fiets terugzetten", "Bekijk de gedetailleerde plattegrond →", "Gebruikers en ritten", "Tijdwinst", "thuisstad van Voi", "Binnen-Parijs (75001 → 75020)", "In Parijs zijn deelsteps niet toegestaan: Voi biedt er alleen elektrische fietsen aan.", "+ 16 andere gemeenten van de agglomeratie", "+ 18 andere gemeenten (geleidelijke uitrol)", "De dienst dekt 17 gemeenten in de regio Grenoble. De gedetailleerde zonekaart staat in de app.", "Uitrol in 3 fasen: 6 gemeenten bij de start, daarna alle 24 gemeenten van de metropool op 1 januari 2027. Vanaf april 2027 komen er steps bij.", "Afzetzones en verboden zon pattini Voi a Oslo (prenotabili anche nell'app Ruter), Bergen, Trondheim e Drammen.", "Monopattini Voi da nord a sud della penisola: Milano, Roma, Torino, Bologna, Genova, Napoli…", "Monopattini elettrici Voi nelle principali città finlandesi, tra cui Helsinki e Vantaa, dove Voi è tra gli operatori autorizzati.", "Voi è presente in 16 città e comuni svizzeri. Zurigo è stata la prima città del paese ad accogliere la bici elettrica Explorer 4.", "Presente dal 2019 ad Aarhus e Aalborg, Voi torna a Copenaghen con 4.500 bici elettriche.", "Monopattini elettrici Voi in Andalusia e a Madrid.", "Monopattini elettrici Voi a Lisbona e Porto.", "Bici e monopattini elettrici Voi a Bruxelles e Anversa.", "Oltre 2 milioni di corse Voi a Vienna e una nuova città nel 2026: Innsbruck.", "13° paese di Voi da aprile 2026: 800 bici (elettriche e tradizionali) nelle regioni di Amersfoort e Gooi & Vechtstreek. Puoi prendere una bici in un comune e lasciarla in un altro.", "Voi non è ancora presente qui. Apri l'app per verificare la copertura intorno a te.", "Come funziona", "Scarica l'app", "Gratis su App Store e Google Play. Crea il tuo account e aggiungi un metodo di pagamento.", "Trova e scansiona", "La mappa mostra i veicoli disponibili intorno a te. Scansiona il codice QR per sbloccare.", "Guida e parcheggia", "Termina in una zona di parcheggio autorizzata, scatta una foto ed è fatta.", "Pronto a partire?", "Scarica l'app Voi e trova il veicolo più vicino.", "© Voi Technology — Bici e monopattini elettrici in sharing in Europa", "Copertura e tariffe in tempo reale: consulta l'app Voi.", "Voi — home", "Paese o città (es. Monaco, Rezé…)", "Cerca un paese o una città", "Voi in Europa — I nostri paesi", "Aiuto", "Domande", "frequenti", "Tutto quello che devi sapere prima della tua prima corsa Voi: registrazione, sblocco, tariffe, sicurezza e assistenza.", "Tutte", "Per iniziare", "Durante la corsa", "Tariffe e pagamento", "Problemi e assistenza", "Come inizio a usare Voi?", "Scarica l'app Voi da App Store o Google Play, crea il tuo account con il numero di telefono o l'e-mail, poi aggiungi un metodo di pagamento. Potrai quindi trovare un veicolo sulla mappa e partire.", "Quanti anni bisogna avere per noleggiare un veicolo Voi?", "In genere bisogna avere 18 anni. In alcuni paesi o città l'età minima può essere diversa: è indicata nell'app al momento della registrazione.", "Serve la patente?", "No, non serve alcuna patente per noleggiare una bici o un monopattino Voi. In alcuni paesi, però, l'app può chiedere una verifica dell'identità.", "In quali città è disponibile Voi?", "Voi è presente in oltre 130 città di 14 paesi europei. Consulta «I nostri paesi» o apri l'app per vedere i veicoli disponibili intorno a te.", "Come si sblocca una bici o un monopattino?", "Apri l'app, scegli un veicolo sulla mappa e scansiona il codice QR sul manubrio. Il veicolo si sblocca in pochi secondi.", "Posso prenotare un veicolo in anticipo?", "A seconda della città, l'app permette di prenotare un veicolo per qualche minuto, il tempo di raggiungerlo. L'opzione compare quando selezioni un veicolo.", "Posso fare una pausa durante la corsa?", "In molte città puoi mettere in pausa la corsa dall'app: il veicolo resta bloccato e riservato a te. La pausa viene comunque addebitata, alla tariffa indicata nell'app.", "Dove posso circolare?", "Sulle piste e corsie ciclabili quando ci sono, altrimenti sulla carreggiata. Il marciapiede è vietato. Alcune zone della città limitano la velocità o vietano la circolazione: compaiono a colori sulla mappa dell'app.", "Come termino la corsa?", "Parcheggia in una zona autorizzata indicata nell'app, tocca «Termina corsa» e scatta una foto del veicolo parcheggiato bene. La corsa viene chiusa e addebitata.", "Quanto costa una corsa?", "Il prezzo dipende dalla città: in genere un costo di sblocco più un prezzo al minuto. Per esempio 0,25 €/min senza sblocco a Parigi, 0,49 € + 0,25 €/min a Grenoble, 1 € + 0,20 €/min a Marsiglia: ogni pagina città indica le sue tariffe.", "Esistono pass o abbonamenti?", "Sì, a seconda della città l'app propone pass (giornalieri, mensili…) e pacchetti di minuti che convengono se ti sposti spesso. Li trovi nella sezione dedicata dell'app.", "Quali metodi di pagamento sono accettati?", "La carta di pagamento e, a seconda del paese, Apple Pay, Google Pay o altri metodi locali. Li aggiungi e gestisci nell'app.", "Perché mi sono stati addebitati costi aggiuntivi?", "Possono essere applicati costi se il veicolo viene parcheggiato fuori da una zona autorizzata o lasciato fuori dall'area di servizio. Il dettaglio di ogni corsa è nel tuo storico. In caso di dubbi, contatta l'assistenza dall'app.", "Il casco è obbligatorio?", "È fortemente consigliato a ogni corsa e obbligatorio in alcuni casi, per esempio in monopattino fuori dai centri abitati in Francia. Voi non fornisce caschi: ricordati di portare il tuo.", "Si può andare in due su un monopattino?", "No. Un veicolo Voi trasporta una sola persona, senza passeggeri né bambini.", "Posso circolare con la pioggia o di notte?", "Sì, ma con prudenza: rallenta sul bagnato, perché lo spazio di frenata aumenta. Di notte le luci si accendono automaticamente; se puoi, indossa indumenti riflettenti.", "Rivedi le regole di sicurezza →", "Cosa fare in caso di incidente?", "Mettiti al sicuro e chiama i soccorsi se qualcuno è ferito (112 in tutta Europa). Poi segnala l'incidente a Voi dalla sezione di aiuto dell'app.", "Il veicolo è danneggiato o non funziona: cosa faccio?", "Non usarlo. Segnala il problema dall'app (scheda del veicolo o sezione di aiuto), poi scegli un altro veicolo. Le tue segnalazioni aiutano i team di Voi a intervenire rapidamente.", "La batteria è quasi scarica: cosa succede?", "Il livello di batteria di ogni veicolo è indicato prima dello sblocco. Se si abbassa durante la corsa, la velocità può essere ridotta: termina la corsa in una zona autorizzata e prendi un altro veicolo.", "La corsa non si chiude: cosa faccio?", "Verifica di essere in una zona di parcheggio autorizzata e che il telefono abbia campo e la localizzazione attiva. Se il problema persiste, contatta l'assistenza dall'app senza lasciare il veicolo.", "Ho dimenticato un oggetto su un veicolo o ho bisogno di aiuto", "Contatta l'assistenza Voi dalla sezione di aiuto dell'app, indicando la corsa interessata.", "Come elimino il mio account?", "Puoi chiedere l'eliminazione del tuo account dalle impostazioni dell'app o contattando l'assistenza.", "Categorie", "FAQ — Domande frequenti | Voi", "Viaggia", "sicuro", ", a ogni corsa", "Bici o monopattino elettrico: poche regole semplici proteggono te e gli altri utenti della strada. Ripassale, poi mettiti alla prova con il nostro quiz.", "Sulla pista ciclabile", "Circola su piste e corsie ciclabili, altrimenti sulla carreggiata. Mai sul marciapiede.", "25 km/h al massimo", "Adatta la velocità al traffico, ai pedoni e allo stato della strada.", "Una sola persona", "Un veicolo, una persona: niente passeggeri, niente bambini davanti a te.", "Orecchie e mani libere", "Auricolari e telefono in mano sono vietati durante la corsa.", "Sempre il casco", "Fortemente consigliato in città, obbligatorio fuori dai centri abitati.", "Parcheggia bene", "Solo nelle zone di parcheggio indicate nell'app.", "Il quiz sulla sicurezza", "10 domande per verificare che conosci le regole. Una spiegazione dopo ogni risposta.", "Inizia il quiz →", "Viaggia sicuro con Voi", "Domanda 1 di 10", "Punteggio: 0", "In città, dove devi circolare con un monopattino elettrico?", "Sul marciapiede, facendo attenzione ai pedoni", "Su piste o corsie ciclabili, altrimenti sulla carreggiata", "Dove voglio, purché vada piano", "Quiz sulla sicurezza — Voi", "veicoli (stima)", "territori", "comuni", "bici elettriche", "6.000 bici elettriche nuove nei 20 arrondissement.", "Novità", "Bici elettriche", "Monopattini e bici elettriche, dal Porto Vecchio ai quartieri nord.", "Monopattini", "Bici e monopattini in 17 comuni della metro o: noleggio di barche sul lago, grandi prati per il picnic e il Parc Floral vicinissimo.", "3. Le rive pedonali della Senna", "Distanza: circa 2 km sulla riva sinistra (dal museo d'Orsay al ponte dell'Alma), 3 km sulla riva destra (dalle Tuileries verso l'Hôtel de Ville).", "Livello: facile, ma molto frequentato nel fine settimana.", "Il bello: vista sui monumenti, senza nessuna auto. Vai a passo d'uomo: i pedoni hanno la precedenza.", "A che età un bambino può seguirti con la sua bici?", "Non c'è un'età ufficiale. In genere, un bambino sicuro sulla bici, che sa frenare e fermarsi quando glielo chiedi, può seguirti su una corsia separata verso i 6 o 7 anni e in città, su pista ciclabile, piuttosto verso i 9 o 10. Mettilo davanti a te per tenerlo d'occhio.", "💡 Buono a sapersi", "Il casco è obbligatorio in bici per i minori di 12 anni, che pedalino o siano passeggeri. Una bici Voi trasporta una sola persona: il bambino va quindi con la sua bici. L'età minima per noleggiare una bici Voi è indicata nell'app.", "Foto:", "Chiudi", "«Idea per un'uscita in bici la domenica vicino a casa»", "La domenica la città è più tranquilla ed è il momento migliore per riscoprirla in bici. Ecco un'idea di uscita per ogni città in cui Voi è presente in Francia.", "Un'idea per città", "Parigi: la domenica alcune strade e quartieri sono riservati a pedoni e bici (iniziativa «Paris Respire»). Ideale per passeggiare dal canale Saint-Martin a Montmartre.", "Nantes: risali l'Erdre dal centro fino all'isola di Versailles e al suo giardino giapponese, poi costeggia il fiume verso nord.", "Marsiglia: la Corniche Kennedy, dal Porto Vecchio alle spiagge del Prado, con sosta al Vallon des Auffes.", "Grenoble: i lungofiume dell'Isère ai piedi della Bastiglia, poi il parco Paul-Mistral.", "Le Havre: il lungomare, dalla spiaggia fino a Sainte-Adresse, di fronte al mare.", "Saint-Quentin-en-Yvelines: il giro dell'isola del tempo libero e del suo laghetto.", "Mercati, chioschi sull'acqua e brunch", "La domenica mattina quasi tutti i quartieri hanno il mercato: l'occasione per riempire un cestino per il picnic. A pranzo cerca una terrazza sull'acqua; d'estate le guinguette riaprono lungo canali e fiumi.", "Le strade senza auto", "Molte città chiudono alcune strade alle auto la domenica o organizzano una «giornata senz'auto» una volta all'anno. Le date cambiano ogni anno: consulta il sito del tuo Comune prima di partire.", "La domenica le bici vicino ai parchi e alle rive vanno a ruba. Apri l'app un po' prima per individuare la più vicina.", "«Idea per un appuntamento originale a Parigi»", "Un appuntamento in bici è più rilassato di una cena a due: si chiacchiera pedalando, ci si ferma dove si vuole e la città fa da sfondo.", "I tramonti più belli", "Lo square du Vert-Galant, sulla punta dell'Île de la Cité, a pelo d'acqua.", "Il ponte Alessandro III, con la Torre Eiffel e gli Invalides ai due lati.", "Il parco di Belleville, uno dei panorami più belli su tutta Parigi.", "Il Sacré-Cœur: la salita è ripida, ma la pedalata assistita fa il lavoro.", "Dove fermarsi", "Per un drink, le banchine del canale Saint-Martin e del bacino della Villette sono animate fino a sera. Per un picnic, porta una tovaglia e mettiti sulle rive della Senna o al Campo di Marte.", "La formula «1 ora, 1 passeggiata, 1 gelato»", "Partenza dal giardino delle Tuileries.", "I lungosenna della riva destra fino all'Hôtel de Ville, circa 15 minuti.", "Attraversamento verso l'Île Saint-Louis, famosa per le sue gelaterie.", "Ritorno tranquillo lungo i lungosenna della riva sinistra fino al museo d'Orsay.", "Parcheggia le bici prima di sistemarti: sui lungosenna e sulle isole, usa gli stalli autorizzati indicati nell'app.", "«Cosa vedere a Marsiglia in 1 giorno?»", "Un giorno basta per vedere l'essenziale di una città in bici, a patto di scegliere bene l'ordine delle visite. Esempio: Marsiglia, dove Voi offre bici e monopattini.", "Il percorso", "Ore 9 · Il Porto Vecchio, prima della folla: il mercato del pesce sulla banchina.", "Ore 10 · Il Mucem e il forte Saint-Jean, costeggiando il porto.", "Ore 11 · Le Panier, il quartiere più antico della città. I vicoli sono in pendenza e spesso a gradini: parcheggia la bici in basso e visitalo a piedi.", "Ore 14 · La Corniche Kennedy, in riva al mare, fino al Vallon des Auffes.", "Ore 16 · Le spiagge del Prado e il parco Borély per finire in tranquillità.", "L'angolo poco noto", "Il Vallon des Auffes, un piccolo porto di pescatori nascosto sotto la corniche, con le sue casette e le barche colorate. Si scende da una scala: lascia la bici sulla corniche.", "L'ordine che evita salite e folla", "Comincia dal centro di primo mattino, quando fa fresco e c'è poca gente, poi segui il mare verso sud: la corniche è quasi pianeggiante. Notre-Dame-de-la-Garde è l'unica vera salita; con la pedalata assistita si fa, ma tienila per la tarda mattinata, prima del caldo.", "Dove mangiare", "Intorno al Porto Vecchio per il pranzo, o un picnic vista mare sulla corniche. Al Vallon des Auffes ci sono ristoranti di pesce.", "A Marsiglia i monopattini si parcheggiano nelle stazioni. Non lasciare mai un veicolo vicino all'acqua, al Porto Vecchio o sulla corniche.", "«Dove fare belle foto a Parigi?»", "La bici è ideale per la fotografia: si passa da un posto all'altro senza cercare la metro e si può tornare quando la luce è migliore.", "L'anello, in ordine", "Il Trocadéro all'alba, per la Torre Eiffel senza folla.", "Il ponte di Bir-Hakeim e il suo viale di colonne, al mattino.", "Il ponte Alessandro III, nella luce morbida di fine mattinata.", "La piramide del Louvre, presto o tardi per i riflessi.", "Lo square du Vert-Galant, sulla punta dell'Île de la Cité.", "Place des Vosges e i suoi portici, a mezzogiorno all'ombra.", "Il canale Saint-Martin, le sue passerelle e chiuse, nel pomeriggio.", "Il parco di Belleville, vista su tutta Parigi a fine giornata.", "Le scalinate di Montmartre, all'ora d'oro.", "Il Sacré-Cœur, al tramonto.", "Consigli", "L'«ora d'oro», circa un'ora dopo l'alba e prima del tramonto, regala la luce più bella.", "Parcheggia la bici prima di tirare fuori la macchina fotografica: mai foto mentre pedali.", "Nelle strade abitate e molto fotografate, sii discreto e rispetta i residenti.", "Fai l'anello in due volte: al mattino a ovest (Trocadéro, ponti, Louvre), la sera a est e a nord (canale, Belleville, Montmartre).", "«Quante calorie si bruciano in bici elettrica?»", "Si pensa spesso che la pedalata assistita faccia tutto. In realtà bisogna pedalare perché funzioni: la bici elettrica resta un'attività fisica.", "Cosa dicono gli studi", "Gli studi europei sulla mobilità mostrano che chi usa la bici elettrica fa tragitti più lunghi e frequenti dei ciclisti tradizionali. In totale, la loro attività fisica settimanale è paragonabile. Lo sforzo al minuto è minore, ma si pedala più spesso.", "Quanto alle calorie, tutto dipende dal livello di assistenza, dal peso e dal dislivello: come ordine di grandezza, qualche centinaio di chilocalorie l'ora, meno che in bici tradizionale e molto più che seduti in metro.", "L'Organizzazione mondiale della sanità raccomanda almeno 150 minuti di attività moderata a settimana. Due tragitti di 15 minuti per giorno lavorativo bastano per raggiungerli.", "Sfide semplici", "Sostituire 2 tragitti a settimana con la bici, per esempio il lunedì e il venerdì.", "Scendere una fermata prima e finire in bici.", "Salire una collina abbassando l'assistenza: Montmartre, la Bastiglia a Grenoble, Notre-Dame-de-la-Garde a Marsiglia.", "Annotare i tragitti per un mese per vedere i chilometri accumularsi.", "Esempio (fittizio)", "«Facevo Bastille – Canal Saint-Martin in metro. Ora lo faccio in bici: 11 minuti, e non aspetto più sulla banchina.» — Camille, 29 anni. Questa testimonianza è un esempio inventato per illustrare l'articolo.", "Inizia piano: uno o due tragitti brevi la prima settimana, poi aumenta. L'importante è la regolarità.", "«Dove rilassarsi in riva all'acqua vicino a Grenoble?»", "Non serve andare lontano per staccare: in ogni città Voi c'è un angolo d'acqua o di natura a meno di 30 minuti in bici.", "Per città", "Grenoble: le rive dell'Isère e il parco Paul-Mistral per un picnic davanti alle montagne; il giardino di città ai piedi della Bastiglia.", "Parigi: il bacino della Villette, con balneazione sorvegliata d'estate; dal 2025 aprono d'estate anche siti di balneazione nella Senna. Il bosco di Vincennes e i suoi laghi per il picnic.", "Nantes: le rive dell'Erdre e l'isola di Versailles; lungo la Loira, le terrazze e le guinguette dell'Île de Nantes.", "Marsiglia: le spiagge del Prado e dei Catalans, a pochi minuti dal centro; il parco Borély per l'ombra.", "Cosa portare", "Uno zaino: le bici Voi non hanno seggiolino né rimorchio.", "Acqua, crema solare, una tovaglia.", "Un sacchetto per riportare via i rifiuti.", "Dove lasciare la bici sul posto", "Prima di partire, verifica nell'app che il luogo d'arrivo sia nella zona Voi e individua la zona di parcheggio più vicina. Parcheggia all'ingresso del parco o della spiaggia, mai sulla sabbia o in riva all'acqua.", "Orari e luoghi di balneazione sorvegliata cambiano ogni estate: verifica sul sito del Comune prima di spostarti.", "«Tornare dalla serata in bici, buona idea?»", "La bici è comoda per rientrare quando i mezzi scarseggiano. Ma di notte si vede meno e si è meno visibili. Bastano alcune buone abitudini.", "Scegliere il percorso giusto", "Preferisci i grandi assi con piste ciclabili, meglio illuminati, anche se un po' più lunghi.", "Evita parchi e rive di notte: poco illuminati e a volte chiusi.", "Studia il percorso prima di lasciare la serata, non mentre pedali.", "Farsi vedere", "Le bici Voi hanno luci anteriori e posteriori: verifica che funzionino prima di partire. Un indumento chiaro o una fascia riflettente fanno la differenza. Fuori dai centri abitati, di notte, il giubbotto riflettente è obbligatorio in bici.", "Rientrare in gruppo", "Prendete una bici a testa e procedete in fila, uno dietro l'altro. Avvisa qualcuno quando sei arrivato.", "Cosa non fare", "Pedalare dopo aver bevuto: anche in bici l'alcol è sanzionato e soprattutto rallenta i riflessi. Se hai bevuto, torna a piedi, in taxi o con i mezzi.", "Telefonare o guardare lo schermo mentre pedali.", "Pedalare con gli auricolari: è vietato e non senti cosa arriva.", "Salire in due su una bici: una bici, una persona.", "La serata migliore è quella che ricordi. Se esiti a prendere la bici, non è la sera giusta.", "«Quartieri poco noti di Parigi da visitare»", "In metro passi sotto i quartieri senza vederli. In bici scopri strade lastricate, case con giardino e muri dipinti che nessuna guida mostra.", "Il percorso «curiosità» (circa 2 h, 13° e 14°)", "La Butte-aux-Cailles: un vero villaggio, con le sue stradine, le facciate basse e le opere di street art.", "La Cité Florale: qualche via con nomi di fiori (rue des Glycines, rue des Orchidées), fiancheggiata da case con giardino. Scendi dalla bici, è minuscola.", "Il parco Montsouris: pausa in un grande parco all'inglese, con lago e cascata.", "Il boulevard Vincent-Auriol: una galleria a cielo aperto di murales giganti sulle facciate dei palazzi.", "Per la prossima volta", "La Mouzaïa (19°): vicoli lastricati e fioriti, in tranquillità.", "I passaggi coperti del 2° (galleria Vivienne, passage des Panoramas): da visitare a piedi, con la bici parcheggiata all'ingresso.", "Rue Dénoyez (20°): muri coperti di graffiti che cambiano continuamente.", "Questi quartieri sono abitati: vai a passo d'uomo, parla piano e parcheggia la bici in uno stallo autorizzato prima di passeggiare a piedi.", "«Che giro in bici fare in autunno?»", "Ogni stagione cambia la città: le stesse strade hanno tutt'altro volto ad aprile e a dicembre. Ecco una passeggiata per stagione.", "🌸 Primavera: gli alberi in fiore", "Il Jardin des Plantes e i suoi ciliegi, poi lo square Jean-XXIII, dietro Notre-Dame. La primavera è la stagione ideale: né troppo caldo né troppo freddo. Basta una giacca leggera.", "☀️ Estate: pedalare all'ombra", "Parti presto al mattino o dopo le 18. Preferisci i boschi di Vincennes e di Boulogne e i lungosenna ombreggiati. Porta acqua, un cappellino e crema solare. A luglio e agosto le rive della Senna diventano spiagge.", "🍁 Autunno: i colori", "I Buttes-Chaumont e il bosco di Vincennes sono splendidi a ottobre. Anche il giardino del Lussemburgo, ma le bici non possono entrare: parcheggia all'ingresso. Porta uno strato in più e attenzione alle foglie bagnate, che scivolano.", "🎄 Inverno: le luci", "Le luminarie degli Champs-Élysées e le vetrine dei grandi magazzini del boulevard Haussmann. Guanti, berretto sotto il cappuccio e luci accese: la notte arriva presto.", "Gli eventi di stagione", "Giugno: la Festa della musica, il 21 giugno. La bici permette di passare da un concerto all'altro, ma alcune strade sono gremite.", "Estate: Paris Plages e i cinema all'aperto.", "Autunno: la Notte Bianca, con opere da vedere in tutta la città.", "Inverno: i mercatini di Natale e le luminarie.", "Con la pioggia frena prima ed evita la segnaletica orizzontale e il pavé, molto scivolosi. Le date degli eventi cambiano ogni anno: verificale prima di partire.", "Il marciapiede è riservato ai pedoni. Si circola su piste e corsie ciclabili quando ci sono, altrimenti sulla carreggiata.", "Qual è la velocità massima di un monopattino elettrico?", "I monopattini elettrici sono limitati a 25 km/h. Rallenta vicino ai pedoni e quando la strada è bagnata.", "Quante persone possono salire su un monopattino?", "Una sola", "Due se il secondo è un bambino", "Due adulti al massimo", "Un monopattino è per una sola persona. In due, equilibrio e frenata diventano pericolosi.", "Durante la corsa, cosa fai con auricolari e telefono?", "Un solo auricolare è consentito", "Il telefono in mano per seguire il GPS", "Metterli via: sono vietati entrambi durante la guida", "Auricolari e telefono in mano sono vietati. Devi sentire e vedere cosa succede intorno a te.", "Il casco è…", "Inutile in città", "Fortemente consigliato e obbligatorio fuori dai centri abitati", "Solo per le bici", "Il casco riduce molto la gravità delle ferite alla testa. Fuori dai centri abitati è obbligatorio in monopattino.", "Da che età si può guidare un monopattino elettrico in Francia?", "12 anni", "14 anni", "16 anni", "L'età minima legale è di 14 anni. L'app Voi può richiedere un'età minima più alta per noleggiare.", "Dopo aver bevuto alcol, cosa dice la regola?", "Valgono gli stessi limiti degli automobilisti", "In monopattino non c'è limite", "È vietata solo la cannabis", "Alcol e stupefacenti sono vietati al manubrio come al volante. Dopo una serata, rientra in altro modo.", "Prima di partire, cosa controlli?", "Niente, il veicolo è per forza in buono stato", "Solo la batteria", "Freni, pneumatici e luci", "Basta un'occhiata veloce. Se qualcosa non va, scegli un altro veicolo e segnala il problema nell'app.", "A fine corsa, dove parcheggi il veicolo?", "In mezzo al marciapiede, si vede di più", "In una zona di parcheggio autorizzata indicata nell'app", "Davanti all'ingresso di un palazzo", "Parcheggia solo nelle zone autorizzate, senza intralciare pedoni, sedie a rotelle o passeggini.", "Di notte, come farsi vedere dagli altri?", "Accendere le luci e indossare un indumento o un giubbotto riflettente", "Suonare il clacson spesso", "Circolare in mezzo alla strada", "Luci accese ed equipaggiamento riflettente. Fuori dai centri abitati il giubbotto retroriflettente è obbligatorio di notte.", "✓ Risposta giusta!", "✗ Non proprio.", "Vedi il mio punteggio", "Domanda successiva →", "Perfetto! Sei pronto a viaggiare in tutta sicurezza.", "Molto bene! Rivedi i pochi punti sbagliati prima della prossima corsa.", "Prenditi un momento per rileggere le regole: ne va della tua sicurezza.", "Rifai il quiz", "Rivedi le regole", "Indirizzo non trovato", "Aggiungi la destinazione per vedere il percorso.", "Nessuna bici Voi vicino al t   return s.match(/^\s*/)[0]+out+s.match(/\s*$/)[0];
}
/* each text node / attribute keeps its French original, so the language can change back and forth */
const I18N_ORIG=new WeakMap(), I18N_LAST=new WeakMap(), I18N_ATTRS=["placeholder","aria-label","title","alt"];
function i18nSkip(el){ return !el || el.closest("script,style,noscript,[data-noi18n]"); }
function i18nText(n){
  if(i18nSkip(n.parentElement)) return;
  let orig=I18N_ORIG.get(n);
  if(orig===undefined || I18N_LAST.get(n)!==n.nodeValue){ orig=n.nodeValue; I18N_ORIG.set(n,orig); }
  const t=trText(orig);
  if(t!==n.nodeValue) n.nodeValue=t;
  I18N_LAST.set(n,n.nodeValue);
}
function i18nAttr(el,a){
  if(!el.hasAttribute(a) || i18nSkip(el)) return;
  let rec=I18N_ORIG.get(el); if(!rec){ rec={}; I18N_ORIG.set(el,rec); }
  const cur=el.getAttribute(a);
  if(!rec[a] || rec[a][1]!==cur) rec[a]=[cur,cur];
  const t=trText(rec[a][0]);
  if(t!==cur) el.setAttribute(a,t);
  rec[a][1]=t;
}
function i18nWalk(root){
  if(root.nodeType===3){ i18nText(root); return; }
  if(root.nodeType!==1) return;
  if(i18nSkip(root)) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=tw.nextNode())) i18nText(n);
  I18N_ATTRS.forEach(a=>{ if(root.hasAttribute(a)) i18nAttr(root,a); root.querySelectorAll("["+a+"]").forEach(el=>i18nAttr(el,a)); });
}
new MutationObserver(muts=>{
  for(const m of muts){
    if(m.type==="childList") m.addedNodes.forEach(i18nWalk);
    else if(m.type==="characterData") i18nText(m.target);
    else if(m.type==="attributes") i18nAttr(m.target,m.attributeName);
  }
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTRS});
function setLang(l, rerender){
  LANG=l; i18nBuild();
  document.documentElement.lang=l;
  try{ localStorage.setItem("voi-lang",l); }catch(e){}
  const sel=document.getElementById("langsel"); if(sel) sel.value=l;
  i18nWalk(document.documentElement);
  if(rerender) route();
}
(function(){
  const sel=document.getElementById("langsel");
  sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" title="${n}">${c.toUpperCase()}</option>`).join("");
  sel.addEventListener("change",()=>setLang(sel.value,true));
  setLang(LANG,false);
})();

/* ---------------- ROUTER ----------------
   The current page is kept in CURRENT instead of being read from the URL, so
   changing page also works where the address bar can't change (previews,
   embedded frames). Internal links lose their href and keep their target in
   data-to: some previews block every click on an <a href>. */
let CURRENT=(location.hash||"").slice(1);
function navTo(id){
  if(id===CURRENT){ return; }
  CURRENT=id;
  try{ history.pushState(null,"","#"+id); }catch(e){}
  route();
}
function unlinkInternal(){
  document.querySelectorAll('a[href^="#"]:not([href="#"])').forEach(a=>{
    if(a.closest(".leaflet-container")) return;
    a.dataset.to=a.getAttribute("href").slice(1);
    a.removeAttribute("href");
    a.setAttribute("role","link"); if(!a.hasAttribute("tabindex")) a.tabIndex=0;
  });
}
new MutationObserver(muts=>{ if(muts.some(m=>m.addedNodes.length)) unlinkInternal(); })
  .observe(document.documentElement,{childList:true,subtree:true});
function onNav(e){
  const a=e.target.closest && e.target.closest("[data-to]");
  if(!a) return;
  if(e.type==="keydown" && e.key!=="Enter") return;
  e.preventDefault(); e.stopPropagation();
  navTo(a.dataset.to);
}
document.addEventListener("click",onNav,true);
document.addEventListener("keydown",onNav,true);
const syncFromUrl=()=>{ const id=(location.hash||"").slice(1); if(id!==CURRENT){ CURRENT=id; route(); } };
function initCarousels(){ document.querySelectorAll(".acar-track").forEach(acarDots); }
function route(){
  const id=CURRENT;
  VIEW.spotsFor=null;
  const country=COUNTRIES.find(x=>x.id===id);
  const city=CITIES.find(x=>x.id===id);
  const welcome=id.startsWith("ville/") ? ALL.find(x=>x.slug===id.slice(6)) : null;
  const safety = id==="securite" || id==="securite/quiz";
  const faq = id==="faq";
  if(faq) renderFaq();
  else if(id==="securite") renderSafety();
  else if(id==="securite/quiz") renderQuiz();
  else if(welcome) renderWelcome(welcome);
  else if(country) renderCountry(country);
  else if(city) renderCity(city);
  else renderHub();
  document.getElementById("nav-pays").classList.toggle("on", !city && !welcome && !safety && !faq);
  document.getElementById("nav-secu").classList.toggle("on", safety);
  document.getElementById("nav-faq").classList.toggle("on", faq);
  if(welcome || safety || faq) window.scrollTo(0,0);
  else if(country || city) scrollToMap("auto");
  else window.scrollTo(0,0);
  closeArticle(); requestAnimationFrame(initCarousels);
}
window.addEventListener("hashchange",syncFromUrl);
window.addEventListener("popstate",syncFromUrl);
unlinkInternal();
route();
</script>
