tivité début 2025. Vérifiez la disponibilité dans l'application.", "🅿️ Les zones de stationnement, les zones lentes et les zones interdites exactes s'affichent sur la carte de l'application Voi : elles priment sur ce résumé. Règles relevées en novembre 2026.", "⚠️ La mairie de Lisbonne a annoncé en octobre 2026 vouloir suspendre les trottinettes partagées. Vérifiez la disponibilité dans l'application.", "Limite fixée par la ville pour les trottinettes partagées.", "Stationnement obligatoire en « hotspots »", "Interdit sur les trottoirs, dans les quartiers historiques et devant les monuments ou les accès au métro.", "La mairie de Lisbonne a annoncé en octobre 2026 vouloir suspendre les trottinettes partagées. Vérifiez la disponibilité dans l'application.", "Stationnement obligatoire en « hotspots » : interdit sur les trottoirs, dans les quartiers historiques et devant les monuments ou les accès au métro.", "⚠️ Après une décision du Conseil d'État, tous les vélos et trottinettes partagés ont dû quitter Bruxelles le 1er septembre 2026. Vérifiez la disponibilité dans l'application.", "16 ans minimum", "Âge légal pour rouler en trottinette électrique sur la voie publique.", "Piste cyclable ou chaussée obligatoire.", "Ville d'Anvers (réponse parlementaire 2026)", "Après une décision du Conseil d'État, tous les vélos et trottinettes partagés ont dû quitter Bruxelles le 1er septembre 2026. Vérifiez la disponibilité dans l'application.", "16 ans minimum. Âge légal pour rouler en trottinette électrique sur la voie publique.", "20 km/h, 8 km/h en zone lente", "Les trottinettes partagées sont limitées à 20 km/h et ralentissent automatiquement dans les zones piétonnes.", "Zones interdites", "Dans certaines zones, on ne peut ni rouler ni se garer : la trottinette s'arrête ou ralentit toute seule.", "Dropzones", "Garez-vous de préférence dans les zones de dépôt marquées.", "Ville d'Anvers", "Dropzones : garez-vous de préférence dans les zones de dépôt marquées.", "Garez-vous sur les emplacements rouges marqués au sol ; s'il n'y en a pas, rangez la trottinette dans la file de stationnement (amende de 25 €).", "Nombre limité en centre-ville", "500 trottinettes au maximum dans la Innere Stadt (1er arrondissement).", "Casque obligatoire jusqu'à 16 ans", "Abaissé de 0,8 à 0,5 ‰ le 1er mai 2026.", "Pas de téléphone", "Téléphoner en roulant est interdit.", "Ville de Vienne", "Jamais sur le trottoir : garez-vous sur les emplacements rouges marqués au sol ; s'il n'y en a pas, rangez la trottinette dans la file de stationnement (amende de 25 €).", "Casque obligatoire jusqu'à 16 ans. Depuis le 1er mai 2026.", "Les vélos Voi suivent le code de la route des cyclistes : piste cyclable dès qu'elle existe.", "D'une commune à l'autre", "Vous pouvez prendre un vélo dans une commune et le rendre dans une autre de la zone.", "« Quel trajet à vélo faire avec des enfants à Paris sans danger ? »", "Avec des enfants, le bon parcours est court, plat, à l'écart des voitures et ponctué de pauses. Voici trois balades qui cochent toutes les cases, dans Paris.", "1. Le bassin de la Villette et le parc de la Villette", "Distance : environ 2,5 km de Stalingrad au parc de la Villette, aller simple.", "Niveau : très facile, tout plat.", "Le plus : les quais du bassin sont fermés aux voitures, et le parc a de grands jardins de jeux, dont le célèbre toboggan du Dragon.", "Pour aller plus loin, la piste cyclable continue le long du canal de l'Ourcq vers Pantin. Attention : la zone Voi de Paris s'arrête aux limites de la ville. Revenez garer le vélo dans Paris pour terminer la location.", "2. Le tour du lac Daumesnil, bois de Vincennes", "Distance : environ 2 km pour la boucle du lac, jusqu'à 6 km en prolongeant dans le bois.", "Niveau : facile.", "Le plus : location de barques sur le lac, grandes pelouses pour pique-niquer, et le Parc floral tout proche.", "3. Les berges de Seine piétonnes", "Distance : environ 2 km rive gauche (du musée d'Orsay au pont de l'Alma), 3 km rive droite (des Tuileries vers l'Hôtel de Ville).", "Niveau : facile, mais très fréquenté le week-end.", "Le plus : vue sur les monuments, sans aucune voiture. Roulez au pas : les piétons sont prioritaires.", "À quel âge un enfant peut-il suivre sur son vélo ?", "Il n'y a pas d'âge officiel. En général, un enfant à l'aise sur son vélo, qui sait freiner et s'arrêter à la demande, peut suivre sur une voie séparée vers 6 ou 7 ans, et en ville, sur piste cyclable, plutôt vers 9 ou 10 ans. Placez-le devant vous pour le garder à l'œil.", "💡 Bon à savoir", "Le casque est obligatoire à vélo pour les moins de 12 ans, qu'ils pédalent ou soient passagers. Un vélo Voi ne transporte qu'une personne : l'enfant roule donc sur son propre vélo. L'âge minimum pour louer un vélo Voi est indiqué dans l'application.", "Photo :", "Fermer", "« Idée de sortie à vélo le dimanche près de chez moi »", "Le dimanche, la ville est plus calme et c'est le meilleur moment pour la redécouvrir à vélo. Voici une idée de sortie dans chaque ville où Voi est présent en France.", "Une idée par ville", "Paris : le dimanche, certaines rues et certains quartiers sont réservés aux piétons et aux vélos (opération « Paris Respire »). Idéal pour flâner du canal Saint-Martin à Montmartre.", "Nantes : remontez l'Erdre depuis le centre jusqu'à l'île de Versailles et son jardin japonais, puis longez la rivière vers le nord.", "Marseille : la corniche Kennedy, du Vieux-Port aux plages du Prado, avec arrêt au vallon des Auffes.", "Grenoble : les quais de l'Isère au pied de la Bastille, puis le parc Paul-Mistral.", "Le Havre : le front de mer, de la plage jusqu'à Sainte-Adresse, face à la mer.", "Saint-Quentin-en-Yvelines : le tour de l'île de loisirs et de son étang.", "Marchés, guinguettes et brunchs", "Le dimanche matin, la plupart des quartiers ont leur marché : c'est l'occasion de remplir un panier pour un pique-nique. À midi, cherchez une terrasse au bord de l'eau ; l'été, les guinguettes rouvrent le long des canaux et des fleuves.", "Les rues sans voitures", "Beaucoup de villes ferment certaines rues aux voitures le dimanche ou organisent une « journée sans voiture » une fois par an. Les dates changent chaque année : consultez le site de votre mairie avant de partir.", "Le dimanche, les vélos partent vite près des parcs et des berges. Ouvrez l'application un peu avant pour repérer le plus proche.", "« Idée de date originale à Paris »", "Un rendez-vous à vélo, c'est plus détendu qu'un dîner en tête-à-tête : on discute en roulant, on s'arrête où on veut, et la ville sert de décor.", "Les plus beaux couchers de soleil", "Le square du Vert-Galant, à la pointe de l'île de la Cité, au ras de l'eau.", "Le pont Alexandre-III, avec la Tour Eiffel et les Invalides de chaque côté.", "Le parc de Belleville, l'un des plus beaux panoramas sur tout Paris.", "Le Sacré-Cœur : la montée est raide, mais l'assistance électrique fait le travail.", "Où s'arrêter", "Pour un verre, les quais du canal Saint-Martin et du bassin de la Villette sont animés jusqu'au soir. Pour un pique-nique, prévoyez une nappe et posez-vous sur les berges de Seine ou au Champ-de-Mars.", "La formule « 1 heure, 1 balade, 1 glace »", "Départ du jardin des Tuileries.", "Les quais rive droite jusqu'à l'Hôtel de Ville, environ 15 minutes.", "Traversée vers l'île Saint-Louis, réputée pour ses glaciers.", "Retour tranquille par les quais rive gauche, jusqu'au musée d'Orsay.", "Garez les vélos avant de vous installer : sur les quais et les îles, utilisez les emplacements vélos autorisés indiqués dans l'application.", "« Que voir à Marseille en 1 jour ? »", "Une journée suffit pour voir l'essentiel d'une ville à vélo, à condition de bien choisir l'ordre des visites. Exemple à Marseille, où Voi propose vélos et trottinettes.", "Le circuit", "9 h · Le Vieux-Port, avant la foule : le marché aux poissons du quai.", "10 h · Le Mucem et le fort Saint-Jean, en longeant le port.", "11 h · Le Panier, le plus vieux quartier de la ville. Ses ruelles sont en pente et souvent en escalier : garez le vélo en bas et visitez à pied.", "14 h · La corniche Kennedy, en bord de mer, jusqu'au vallon des Auffes.", "16 h · Les plages du Prado et le parc Borély pour finir au calme.", "Le coin méconnu", "Le vallon des Auffes, un petit port de pêcheurs caché sous la corniche, avec ses cabanons et ses barques colorées. On y descend par un escalier : laissez le vélo sur la corniche.", "L'ordre qui évite les montées et la foule", "Commencez par le centre tôt le matin, quand il fait frais et qu'il y a peu de monde, puis suivez la mer vers le sud : la corniche est presque plate. Notre-Dame-de-la-Garde est la seule vraie montée ; avec l'assistance électrique, c'est faisable, mais gardez-la pour la fin de matinée, avant la chaleur.", "Où manger", "Autour du Vieux-Port pour le déjeuner, ou un pique-nique face à la mer sur la corniche. Au vallon des Auffes, on trouve des restaurants de poisson.", "À Marseille, les trottinettes se garent en station. Ne laissez jamais un véhicule près de l'eau, sur le Vieux-Port ou la corniche.", "« Où faire de belles photos à Paris ? »", "Le vélo est idéal pour la photo : on enchaîne les lieux sans chercher de métro, et on peut revenir quand la lumière est meilleure.", "La boucle, dans l'ordre", "Le Trocadéro, au lever du soleil, pour la Tour Eiffel sans la foule.", "Le pont de Bir-Hakeim et son allée de colonnes, le matin.", "Le pont Alexandre-III, en lumière douce de fin de matinée.", "La pyramide du Louvre, tôt ou tard pour les reflets.", "Le square du Vert-Galant, à la pointe de l'île de la Cité.", "La place des Vosges et ses arcades, à midi à l'ombre.", "Le canal Saint-Martin, ses passerelles et ses écluses, l'après-midi.", "Le parc de Belleville, vue sur tout Paris en fin de journée.", "Les escaliers de Montmartre, à l'heure dorée.", "Le Sacré-Cœur, au coucher du soleil.", "Conseils", "L'« heure dorée », environ une heure après le lever et avant le coucher du soleil, donne la plus belle lumière.", "Garez le vélo avant de sortir l'appareil : jamais de photo en roulant.", "Dans les rues habitées et très photographiées, restez discret et respectez les riverains.", "Faites la boucle en deux fois : le matin à l'ouest (Trocadéro, ponts, Louvre), le soir à l'est et au nord (canal, Belleville, Montmartre).", "« Combien de calories on brûle en vélo électrique ? »", "On pense souvent que l'assistance électrique fait tout le travail. En réalité, il faut pédaler pour qu'elle fonctionne : le vélo électrique reste une activité physique.", "Ce que disent les études", "Les études européennes sur la mobilité montrent que les utilisateurs de vélo électrique font des trajets plus longs et plus fréquents que les cyclistes classiques. Au total, leur activité physique de la semaine est comparable. L'effort par minute est plus léger, mais on roule plus souvent.", "Côté calories, tout dépend du niveau d'assistance, du poids et du relief : comptez en ordre de grandeur quelques centaines de kilocalories par heure, moins qu'à vélo classique, beaucoup plus qu'assis dans le métro.", "L'Organisation mondiale de la santé recommande au moins 150 minutes d'activité modérée par semaine. Deux trajets de 15 minutes par jour de travail suffisent à les atteindre.", "Des défis simples", "Remplacer 2 trajets par semaine par le vélo, par exemple le lundi et le vendredi.", "Descendre un arrêt plus tôt et finir à vélo.", "Monter une colline en baissant l'assistance : Montmartre, la Bastille à Grenoble, Notre-Dame-de-la-Garde à Marseille.", "Noter ses trajets pendant un mois pour voir les kilomètres s'accumuler.", "Exemple (fictif)", "« Je faisais Bastille – Canal Saint-Martin en métro. Maintenant je le fais à vélo : 11 minutes, et je n'attends plus sur le quai. » — Camille, 29 ans. Ce témoignage est un exemple inventé pour illustrer l'article.", "Commencez doucement : un ou deux trajets courts la première semaine, puis augmentez. L'important, c'est la régularité.", "« Où aller se poser au bord de l'eau près de Grenoble ? »", "Pas besoin de partir loin pour se mettre au vert : dans chaque ville Voi, il y a un coin d'eau ou de nature à moins de 30 minutes de vélo.", "Par ville", "Grenoble : les berges de l'Isère et le parc Paul-Mistral pour pique-niquer face aux montagnes ; le jardin de ville au pied de la Bastille.", "Paris : le bassin de la Villette, avec baignade surveillée l'été ; depuis 2025, des sites de baignade ouvrent aussi en Seine en été. Le bois de Vincennes et ses lacs pour le pique-nique.", "Nantes : les bords de l'Erdre et l'île de Versailles ; au bord de la Loire, les terrasses et guinguettes de l'île de Nantes.", "Marseille : les plages du Prado et des Catalans, à quelques minutes du centre ; le parc Borély pour l'ombre.", "Ce qu'il faut emporter", "Un sac à dos : les vélos Voi n'ont pas de siège enfant ni de remorque.", "De l'eau, de la crème solaire, une nappe.", "Un sac pour repartir avec ses déchets.", "Où laisser le vélo sur place", "Avant de partir, vérifiez dans l'application que votre lieu d'arrivée est dans la zone Voi et repérez la zone de stationnement la plus proche. Garez-vous à l'entrée du parc ou de la plage, jamais sur le sable ni au bord de l'eau.", "Les horaires et lieux de baignade surveillée changent chaque été : vérifiez sur le site de la mairie avant de vous déplacer.", "« Rentrer de soirée à vélo, bonne idée ? »", "Le vélo, c'est pratique pour rentrer quand les transports se font rares. Mais la nuit, on voit moins et on est moins vu. Quelques réflexes suffisent.", "Choisir le bon itinéraire", "Préférez les grands axes équipés de pistes cyclables, mieux éclairés, même si c'est un peu plus long.", "Évitez les parcs et les berges la nuit : peu éclairés, et parfois fermés.", "Repérez votre trajet avant de partir de la soirée, pas en roulant.", "Se rendre visible", "Les vélos Voi ont des feux avant et arrière : vérifiez qu'ils fonctionnent avant de démarrer. Un vêtement clair ou un brassard réfléchissant change tout. Hors agglomération, la nuit, le gilet réfléchissant est obligatoire à vélo.", "Rentrer à plusieurs", "Prenez chacun un vélo et roulez en file, l'un derrière l'autre. Prévenez quelqu'un quand vous êtes arrivé.", "Ce qu'il ne faut pas faire", "Rouler après avoir bu : à vélo aussi, l'alcool est sanctionné, et surtout il ralentit les réflexes. Si vous avez bu, rentrez à pied, en taxi ou en transports.", "Téléphoner ou regarder son écran en roulant.", "Rouler avec des écouteurs : c'est interdit, et on n'entend plus ce qui arrive.", "Monter à deux sur un vélo : un vélo, une personne.", "La meilleure soirée est celle dont on se souvient. Si vous hésitez à prendre le vélo, c'est que ce n'est pas le bon soir.", "« Quartiers méconnus de Paris à visiter »", "En métro, on passe sous les quartiers sans les voir. À vélo, on découvre des rues pavées, des maisons à jardin et des murs peints qu'aucun guide ne montre.", "Le parcours « curiosités » (environ 2 h, 13e et 14e)", "La Butte-aux-Cailles : un vrai village, avec ses petites rues, ses façades basses et ses œuvres de street art.", "La Cité florale : quelques rues aux noms de fleurs (rue des Glycines, rue des Orchidées), bordées de maisons à jardin. Descendez du vélo, c'est minuscule.", "Le parc Montsouris : pause dans un grand parc à l'anglaise, avec lac et cascade.", "Le boulevard Vincent-Auriol : une galerie de fresques murales géantes en plein air, sur les façades des immeubles.", "Pour une prochaine fois", "La Mouzaïa (19e) : des villas pavées et fleuries, au calme.", "Les passages couverts du 2e (galerie Vivienne, passage des Panoramas) : à visiter à pied, vélo garé à l'entrée.", "La rue Dénoyez (20e) : murs couverts de graffitis, qui changent sans cesse.", "Ces quartiers sont habités : roulez au pas, parlez doucement, et garez le vélo sur un emplacement autorisé avant de vous balader à pied.", "« Quelle balade à vélo faire en automne ? »", "Chaque saison change la ville : les mêmes rues ont un tout autre visage en avril et en décembre. Voici une balade par saison.", "🌸 Printemps : les arbres en fleurs", "Le Jardin des Plantes et ses cerisiers, puis le square Jean-XXIII, derrière Notre-Dame. Le printemps est la saison idéale : ni trop chaud ni trop froid. Une veste légère suffit.", "☀️ Été : rouler à l'ombre", "Partez tôt le matin ou après 18 h. Privilégiez les bois de Vincennes et de Boulogne, et les quais ombragés. Prévoyez de l'eau, une casquette et de la crème solaire. En juillet-août, les bords de Seine se transforment en plages.", "🍁 Automne : les couleurs", "Les Buttes-Chaumont et le bois de Vincennes sont superbes en octobre. Le jardin du Luxembourg aussi, mais les vélos n'y entrent pas : garez-le à l'entrée. Prévoyez une couche de plus, et attention aux feuilles mouillées qui glissent.", "🎄 Hiver : les lumières", "Les illuminations des Champs-Élysées et les vitrines des grands magasins du boulevard Haussmann. Gants, bonnet sous la capuche et feux allumés : la nuit tombe tôt.", "Les événements de saison", "Juin : la Fête de la musique, le 21 juin. Le vélo permet de passer d'un concert à l'autre, mais certaines rues sont bondées.", "Été : Paris Plages et les cinémas en plein air.", "Automne : la Nuit Blanche, avec des œuvres à voir dans toute la ville.", "Hiver : les marchés de Noël et les illuminations.", "Par temps de pluie, freinez plus tôt et évitez les marquages au sol et les pavés, très glissants. Les dates des événements changent chaque année : vérifiez-les avant de partir.", "Le trottoir est réservé aux piétons. On roule sur les pistes et bandes cyclables quand il y en a, sinon sur la chaussée.", "Quelle est la vitesse maximale d'une trottinette électrique ?", "Les trottinettes électriques sont bridées à 25 km/h. Ralentissez près des piétons et quand la route est mouillée.", "Combien de personnes peuvent monter sur une trottinette ?", "Une seule", "Deux si le second est un enfant", "Deux adultes maximum", "Une trottinette, c'est une seule personne. À deux, l'équilibre et le freinage deviennent dangereux.", "Pendant le trajet, que faire de vos écouteurs et de votre téléphone ?", "Un seul écouteur, c'est autorisé", "Le téléphone en main pour suivre le GPS", "Les ranger : les deux sont interdits en roulant", "Écouteurs et téléphone tenu en main sont interdits. Vous devez entendre et voir ce qui se passe autour de vous.", "Le casque, c'est…", "Inutile en ville", "Fortement recommandé, et obligatoire hors agglomération", "Seulement pour les vélos", "Le casque réduit fortement la gravité des blessures à la tête. Hors agglomération, il est obligatoire en trottinette.", "À partir de quel âge peut-on conduire une trottinette électrique en France ?", "12 ans", "14 ans", "16 ans", "L'âge minimum légal est de 14 ans. L'application Voi peut imposer un âge minimum plus élevé pour louer.", "Après avoir bu de l'alcool, que dit la règle ?", "Les mêmes limites que pour les automobilistes s'appliquent", "Il n'y a pas de limite en trottinette", "Seul le cannabis est interdit", "L'alcool et les stupéfiants sont interdits au guidon comme au volant. Après une soirée, rentrez autrement.", "Avant de démarrer, que vérifiez-vous ?", "Rien, le véhicule est forcément en bon état", "La batterie uniquement", "Les freins, les pneus et l'éclairage", "Un rapide coup d'œil suffit. Si quelque chose ne va pas, choisissez un autre véhicule et signalez le problème dans l'application.", "En fin de trajet, où garer votre véhicule ?", "Au milieu du trottoir, c'est plus visible", "Sur une zone de stationnement autorisée indiquée dans l'app", "Devant l'entrée d'un immeuble", "Garez-vous uniquement sur les zones autorisées, sans gêner les piétons, les fauteuils roulants ou les poussettes.", "La nuit, comment être vu des autres ?", "Allumer les feux et porter un vêtement ou un gilet réfléchissant", "Klaxonner régulièrement", "Rouler au milieu de la route", "Feux allumés et équipement réfléchissant. Hors agglomération, le gilet rétroréfléchissant est obligatoire la nuit.", "✓ Bon ed and reserved for you. The pause is still charged, at the rate shown in the app.", "Where am I allowed to ride?", "On cycle paths and lanes where there are any, otherwise on the road. The pavement is off-limits. Some parts of the city limit speed or ban riding: they are shown in colour on the map in the app.", "How do I end my ride?", "Park in an authorised parking zone shown in the app, tap “End ride”, then take a photo of the properly parked vehicle. The ride is then closed and charged.", "How much does a ride cost?", "The price depends on the city: usually an unlock fee plus a per-minute rate. For example €0.25/min with no unlock fee in Paris, €0.49 + €0.25/min in Grenoble, €1 + €0.20/min in Marseille: each city page lists its prices.", "Are there passes or subscriptions?", "Yes, depending on the city the app offers passes (daily, monthly…) and minute bundles that work out cheaper if you ride often. You'll find them in the dedicated section of the app.", "Which payment methods are accepted?", "Bank cards and, depending on the country, Apple Pay, Google Pay or other local payment methods. You add and manage them in the app.", "Why was I charged extra fees?", "Fees may apply if the vehicle is parked outside an authorised zone or left outside the service area. The details of every ride are in your history. If in doubt, contact support from the app.", "Is a helmet mandatory?", "It is strongly recommended on every ride, and mandatory in some cases, for example on e-scooters outside built-up areas in France. Voi doesn't provide helmets: remember to bring your own.", "Can two people ride one e-scooter?", "No. A Voi vehicle carries one person only, with no passenger or child.", "Can I ride in the rain or at night?", "Yes, but carefully: slow down on wet ground, as braking distances get longer. At night the lights switch on automatically; wear reflective clothing if you can.", "Review the safety rules →", "What should I do in an accident?", "Get to safety and call the e ndatory on e-scooters outside built-up areas (with a reflective vest); on bikes, mandatory for under-12s. Recommended for everyone.", "Any other questions?", "See the full FAQ →", "Vehicle type", "Enter your starting address", "Starting point", "Enter your destination", "", "Map of your trip", "E-scooter", "The 16 arrondissements: 1st, 2nd, 3rd, 4th, 5th, 6th, 7th, 8th, 9th, 10th, 11th, 12th, 13th, 14th, 15th, 16th. Vehicles are available throughout the city of Marseille, in all 16 arrondissements. The neighbourhoods listed are landmarks, not a complete list.", "Station-based parking: e-scooters are parked in dedicated stations, no longer just anywhere.", "14 years minimum. Legal age to ride an e-scooter (since September 2023).", "17 municipalities in the metropolitan area: Corenc, Échirolles, Eybens, Fontaine, Gières, Grenoble, La Tronche, Le Pont-de-Claix, Meylan, Montbonnot-Saint-Martin, Poisat, Saint-Égrève, Saint-Martin-d'Hères, Saint-Martin-le-Vinoux, Sassenage, Seyssinet-Pariset, Seyssins. List of municipalities from the metropolitan area's previous contract (2022). The map in the app shows the exact area.", "Only park in the authorised parking zones shown on the map in the app, without getting in pedestrians' way. Take a photo to end the rental.", "Where can I find Voi bikes in Nantes Métropole?", "Launch municipalities: Nantes, Rezé, Carquefou, La Chapelle-sur-Erdre, Sainte-Luce-sur-Loire, Thouaré-sur-Loire. The service is gradually being extended to the other municipalities of Nantes Métropole.", "Spots marked on the ground: no docks, bikes are returned to geolocated spots shown in the app. If one is full, the app shows you the nearest one.", "The 12 municipalities of the conurbation: Coignières, Élancourt, Guyancourt, La Verrière, Les Clayes-sous-Bois, Magny-les-Hameaux, Maurepas, Montigny-le-Bretonneux, Plaisir, Trappes, Villepreux, Voisins-le-Bretonneux.", "Mantes hub: Buchelay, Limay, Mantes-la-Jolie, Mantes-la-Ville · Les Mureaux hub: Hardricourt, Les Mureaux, Meulan-en-Yvelines, Tessancourt-sur-Aubette · Poissy hub: Andrésy, Carrières-sous-Poissy, Conflans-Sainte-Honorine, Poissy. The three hubs are separate zones: you can't ride from one hub to another on a Voi vehicle. Start and end your ride in the same hub.", "Stations marked on the ground: about 360 stations are spread across the 12 municipalities, and that's where you must park your vehicle.", "25 million rides", "since launch", "No licence is needed for an e-scooter.", "", "Maximum speed for e-scooters in Germany.", "No pavements, no pedestrian zones", "Cycle path mandatory, otherwise the road. Riding the wrong way down one-way streets is also banned.", "Same alcohol limits as for cars", "The permitted alcohol level is the same as for drivers; 0‰ for novice drivers.", "Helmet recommended", "It isn't mandatory, but strongly advised.", "14 years minimum. No licence is needed for an e-scooter.", "Helmet recommended. It isn't mandatory, but strongly advised.", "€0 to €0.49 + €0.22 to €0.30 / min", "£0.49 + £0.18 / min · capped at £1.75 per 30 min in Hackney", "Zones by borough", "The service covers 10 boroughs. Outside the zone, the rental can't be ended.", "Driving licence required", "For a rental e-scooter you need a full or provisional UK licence (category Q). The minimum age is set by the operator.", "25 km/h (15.5 mph)", "Maximum speed for rental e-scooters.", "E-scooters may only ride on roads and cycle paths.", "No passenger, no towing, no phone in hand.", "Not mandatory, but advised.", "Driving licence required. For a rental e-scooter you need a full or provisional UK licence (category Q). The minimum age is set by the operator.", "Helmet recommended. Not mandatory, but advised.", "£0 to £1 + £0.16 to £0.25 / min", "10 million rides", "West of England region", "2 million rides", "1 in 4 residents has already ridden", "4 million rides", "including 1.5 million in 2025", "1.15 million rides", "90,000 regular users", "Voi's first city in the UK", "5.55 million rides", "Solent region", "170,000 rides", "£0.16 / min, no unlock fee (launch offer)", "nearly 1 million rides", "July 2026", "Voi offers shared vehicles in Edinburgh. The map in the app shows the vehicles available around you in real time.", "0 to 10 kr + 2.50 to 3 kr / min", "Helmet mandatory under 15", "Recommended for everyone else.", "Above that, the e-scooter is no longer treated as a bicycle.", "Not on the pavement", "Ride on the cycle path; no passengers.", "Parking", "You may not leave the vehicle on a cycle path or on a pavement without a designated bike parking spot.", "Parking: you may not leave the vehicle on a cycle path or on a pavement without a designated bike parking spot.", "Helmet mandatory under 15. Recommended for everyone else.", "89% of rides faster", "than walking or public transport", "21 million rides", "650,000 users (2023)", "Monthly Voi Pass", "Unlimited 30-min rides", "Also in the Ruter app", "15 or 16 to rent", "The minimum age depends on the operator.", "Minimum age", "12 by law, but 15 or 16 to rent depending on the operator. In October 2026 the government proposed raising it to 16.", "Recommended for everyone.", "0.2‰ alcohol maximum", "The same very low limit as for cars.", "End-of-ride photo", "Take a photo of your parked vehicle at the end of every rental.", "15 or 16 to rent. The minimum age depends on the operator.", "Helmet mandatory under 15. Recommended for everyone.", "0 to 10 kr + 2.50 kr / min", "Minimum age. 12 by law, but 15 or 16 to rent depending on the operator. In October 2026 the government proposed raising it to 16.", "Helmet mandatory for everyone", "Whatever your age, including on shared vehicles (fine of €50 to €250).", "No licence needed.", "20 km/h, 6 km/h in pedestrian zones", "Speed limits for e-scooters.", "Reflective vest at night", "Mandatory at night.", "14 years minimum. No licence needed.", "Helmet mandatory for everyone. Whatever your age, including on shared vehicles (fine of €50 to €250).", "€1 + €0.20 to €0.30 / min", "€39 / 30 days", "Designated spots in the city centre", "In the centre and part of the inner city, shared e-scooters and bikes may only be parked in marked spots (about 250). Anywhere else is an offence.", "15 years minimum", "It is also forbidden to lend an e-scooter to a child under 15.", "0.5‰ alcohol maximum", "Limit applies to rented and private e-scooters alike.", "Night-time restrictions", "In many cities, the speed is cut to 15 km/h at night.", "Advised on every ride.", "City of Helsinki", "Designated spots in the city centre: in the centre and part of the inner city, shared e-scooters and bikes may only be parked in marked spots (about 250). Anywhere else is an offence.", "15 years minimum. It is also forbidden to lend an e-scooter to a child under 15.", "Helmet recommended. Advised on every ride.", "CHF 1 + CHF 0.42 to 0.45 / min", "Age and licence", "From 14 with a category M licence; without a licence from 16.", "Maximum speed for e-scooters.", "Cycling rules apply", "Cycle paths and lanes mandatory, never on the pavement.", "Lights on", "Lights are mandatory on all electric vehicles, even during the day.", "Age and licence. From 14 with a category M licence; without a licence from 16.", "Helmet mandatory on e-scooters", "For everyone, whatever their age (fine of DKK 1,500). It isn't mandatory on bikes.", "Younger riders only with an adult.", "E-scooters follow the cycling rules: cycle path mandatory.", "Lights mandatory day and night on e-scooters.", "15 years minimum. Younger riders only with an adult.", "Helmet mandatory on e-scooters. For everyone, whatever their age (fine of DKK 1,500). It isn't mandatory on bikes.", "⚠️ In Madrid, the city council withdrew the shared e-scooter licences in 2024; operators stopped running in early 2025. Check availability in the app.", "In Madrid, the city council withdrew the shared e-scooter licences in 2024; operators stopped running in early 2025. Check availability in the app.", "🅿️ The exact parking zones, slow zones and no-go zones are shown on the map in the Voi app: they take precedence over this summary. Rules collected in November 2026.", "⚠️ In October 2026 Lisbon city council announced plans to suspend shared e-scooters. Check availability in the app.", "Limit set by the city for shared e-scooters.", "Parking mandatory in hotspots", "Banned on pavements, in historic districts and in front of monuments or metro entrances.", "In October 2026 Lisbon city council announced plans to suspend shared e-scooters. Check availability in the app.", "Parking mandatory in hotspots: banned on pavements, in historic districts and in front of monuments or metro entrances.", "⚠️ Following a Council of State ruling, all shared bikes and e-scooters had to leave Brussels on 1 September 2026. Check availability in the app.", "16 years minimum", "Legal age to ride an e-scooter on public roads.", "Cycle path or road mandatory.", "City of Antwerp (parliamentary answer 2026)", "Following a Council of State ruling, all shared bikes and e-scooters had to leave Brussels on 1 September 2026. Check availability in the app.", "16 years minimum. Legal age to ride an e-scooter on public roads.", "20 km/h, 8 km/h in slow zones", "Shared e-scooters are limited to 20 km/h and slow down automatically in pedestrian zones.", "No-go zones", "In some zones you can neither ride nor park: the e-scooter stops or slows down by itself.", "", "Preferably park in the marked drop zones.", "City of Antwerp", "Dropzones: preferably park in the marked drop zones.", "Park in the red spots marked on the ground; if there are none, put the e-scooter in the parking lane (fine of €25).", "Limited numbers in the city centre", "500 e-scooters maximum in the Innere Stadt (1st district).", "Helmet mandatory up to 16", "Lowered from 0.8 to 0.5‰ on 1 May 2026.", "No phone", "Using a phone while riding is banned.", "City of Vienna", "Never on the pavement: park in the red spots marked on the ground; if there are none, put the e-scooter in the parking lane (fine of €25).", "Helmet mandatory up to 16. Since 1 May 2026.", "Voi bikes follow the traffic rules for cyclists: use the cycle path wherever there is one.", "From one municipality to another", "You can take a bike in one municipality and return it in another within the zone.", "“Which bike route can I safely take with children in Paris?”", "With children, the right route is short, flat, away from cars and broken up with breaks. Here are three rides that tick every box, in Paris.", "1. The Bassin de la Villette and the Parc de la Villette", "Distance: about 2.5 km from Stalingrad to the Parc de la Villette, one way.", "Level: very easy, completely flat.", "The bonus: the quays along the basin are closed to cars, and the park has large play gardens, including the famous Dragon slide.", "To go further, the cycle path continues along the Canal de l'Ourcq towards Pantin. Careful: Voi's Paris zone stops at the city limits. Come back and park the bike in Paris to end the rental.", "2. Around the Lac Daumesnil, Bois de Vincennes", "Distance: about 2 km for the lake loop, up to 6 km if you carry on into the woods.", "Level: easy.", "The bonus: rowing boats for hire on the lake, big lawns for picnics, and the Parc Floral nearby.", "3. The pedestrianised banks of the Seine", "Distance: about 2 km on the left bank (from the Musée d'Orsay to the Pont de l'Alma), 3 km on the right bank (from the Tuileries towards the Hôtel de Ville).", "Level: easy, but very busy at weekends.", "The bonus: views of the monuments, with no cars at all. Ride at walking pace: pedestrians have priority.", "At what age can a child keep up on their own bike?", "There's no official age. Generally, a child who is comfortable on a bike and can brake and stop when asked can follow on a separate path from about 6 or 7, and in town, on a cycle path, more like 9 or 10. Keep them in front of you so you can watch them.", "💡 Good to know", "Helmets are mandatory on bikes for under-12s, whether they're pedalling or riding as passengers. A Voi bike carries only one person, so the child rides their own bike. The minimum age to rent a Voi bike is shown in the app.", "Photo:", "Close", "“Ideas for a Sunday bike outing near me”", "On Sundays the city is quieter, and it's the best time to rediscover it by bike. Here's an outing idea for every city where Voi operates in France.", "One idea per city", "Paris: on Sundays, some streets and neighbourhoods are reserved for pedestrians and bikes (the “Paris Respire” scheme). Ideal for a gentle ride from the Canal Saint-Martin to Montmartre.", "Nantes: ride up the Erdre from the centre to the Île de Versailles and its Japanese garden, then follow the river north.", "Marseille: the Corniche Kennedy, from the Old Port to the Prado beaches, stopping at the Vallon des Auffes.", "Grenoble: the banks of the Isère below the Bastille, then the Parc Paul-Mistral.", "Le Havre: the seafront, from the beach to Sainte-Adresse, facing the sea.", "Saint-Quentin-en-Yvelines: a loop around the leisure island and its lake.", "Markets, riverside bars and brunches", "On Sunday mornings most neighbourhoods have a market: a chance to fill a basket for a picnic. At lunchtime, look for a terrace by the water; in summer, the guinguettes reopen along the canals and rivers.", "Car-free streets", "Many cities close some streets to cars on Sundays or hold a “car-free day” once a year. The dates change every year: check your town hall's website before you go.", "On Sundays, bikes go fast near parks and riverbanks. Open the app a little beforehand to find the nearest one.", "“Original date ideas in Paris”", "A bike date is more relaxed than a candlelit dinner: you chat as you ride, stop wherever you like, and the city is your backdrop.", "The best sunsets", "The Square du Vert-Galant, at the tip of the Île de la Cité, right by the water.", "The Pont Alexandre-III, with the Eiffel Tower and Les Invalides on either side.", "The Parc de Belleville, one of the finest views over the whole of Paris.", "The Sacré-Cœur: the climb is steep, but the electric assistance does the work.", "Where to stop", "For a drink, the quays of the Canal Saint-Martin and the Bassin de la Villette are lively until late. For a picnic, bring a blanket and settle on the banks of the Seine or on the Champ-de-Mars.", "The “1 hour, 1 ride, 1 ice cream” formula", "Start at the Jardin des Tuileries.", "The right-bank quays to the Hôtel de Ville, about 15 minutes.", "Cross over to the Île Saint-Louis, famous for its ice-cream shops.", "A gentle ride back along the left-bank quays to the Musée d'Orsay.", "Park the bikes before you settle down: on the quays and islands, use the authorised bike spots shown in the app.", "“What to see in Marseille in 1 day?”", "One day is enough to see the essentials of a city by bike, as long as you choose the order of your visits well. Example: Marseille, where Voi offers bikes and e-scooters.", "The route", "9 am · The Old Port, before the crowds: the fish market on the quay.", "10 am · The Mucem and Fort Saint-Jean, riding along the port.", "11 am · Le Panier, the city's oldest neighbourhood. Its lanes are steep and often stepped: park the bike at the bottom and explore on foot.", "2 pm · The Corniche Kennedy, along the sea, to the Vallon des Auffes.", "4 pm · The Prado beaches and the Parc Borély to wind down.", "The hidden gem", "The Vallon des Auffes, a small fishing harbour hidden below the corniche, with its huts and colourful boats. You go down by a staircase: leave the bike on the corniche.", "The order that avoids hills and crowds", "Start with the centre early in the morning, when it's cool and quiet, then follow the sea south: the corniche is almost flat. Notre-Dame-de-la-Garde is the only real climb; with electric assistance it's doable, but save it for late morning, before the heat.", "Where to eat", "Around the Old Port for lunch, or a picnic facing the sea on the corniche. At the Vallon des Auffes there are fish restaurants.", "In Marseille, e-scooters are parked in stations. Never leave a vehicle near the water, on the Old Port or the corniche.", "“Where can I take great photos in Paris?”", "A bike is ideal for photography: you go from place to place without hunting for the metro, and you can come back when the light is better.", "The loop, in order", "The Trocadéro at sunrise, for the Eiffel Tower without the crowds.", "The Pont de Bir-Hakeim and its colonnade, in the morning.", "The Pont Alexandre-III, in the soft late-morning light.", "The Louvre pyramid, early or late for the reflections.", "The Square du Vert-Galant, at the tip of the Île de la Cité.", "The Place des Vosges and its arcades, at noon in the shade.", "The Canal Saint-Martin, its footbridges and locks, in the afternoon.", "The Parc de Belleville, a view over all of Paris at the end of the day.", "The steps of Montmartre, at golden hour.", "The Sacré-Cœur, at sunset.", "Tips", "The “golden hour”, roughly an hour after sunrise and before sunset, gives the most beautiful light.", "Park the bike before you take out the camera: never take photos while riding.", "In residential, much-photographed streets, be discreet and respect the residents.", "Do the loop in two parts: the west in the morning (Trocadéro, bridges, Louvre), the east and north in the evening (canal, Belleville, Montmartre).", "“How many calories do you burn on an e-bike?”", "People often think the electric assistance does all the work. In fact you have to pedal for it to work: an e-bike is still physical activity.", "What the studies say", "European mobility studies show that e-bike users make longer and more frequent trips than regular cyclists. Overall, their weekly physical activity is comparable. The effort per minute is lighter, but they ride more often.", "As for calories, it all depends on the assistance level, your weight and the terrain: as a rough guide, count a few hundred kilocalories an hour, less than on a regular bike, far more than sitting on the metro.", "The World Health Organization recommends at least 150 minutes of moderate activity a week. Two 15-minute rides per working day are enough to get there.", "Simple challenges", "Replace 2 trips a week with the bike, for example on Monday and Friday.", "Get off one stop early and finish by bike.", "Climb a hill with the assistance turned down: Montmartre, the Bastille in Grenoble, Notre-Dame-de-la-Garde in Marseille.", "Log your rides for a month to watch the kilometres add up.", "Example (fictional)", "“I used to do Bastille – Canal Saint-Martin by metro. Now I do it by bike: 11 minutes, and no more waiting on the platform.” — Camille, 29. This testimonial is a made-up example to illustrate the article.", "Start gently: one or two short rides in the first week, then build up. What matters is regularity.", "“Where can I chill by the water near Grenoble?”", "No need to go far to get some green: in every Voi city there's a spot by the water or in nature less than 30 minutes away by bike.", "By city", "Grenoble: the banks of the Isère and the Parc Paul-Mistral for a picnic facing the mountains; the Jardin de Ville below the Bastille.", "Paris: the Bassin de la Villette, with supervised swimming in summer; since 2025, swimming spots have also opened in the Seine in summer. The Bois de Vincennes and its lakes for a picnic.", "Nantes: the banks of the Erdre and the Île de Versailles; along the Loire, the terraces and guinguettes of the Île de Nantes.", "Marseille: the Prado and Catalans beaches, a few minutes from the centre; the Parc Borély for shade.", "What to bring", "A backpack: Voi bikes have no child seat or trailer.", "Water, sun cream, a picnic blanket.", "A bag to take your rubbish home.", "Where to leave the bike once you're there", "Before you set off, check in the app that your destination is inside the Voi zone and find the nearest parking zone. Park at the entrance to the park or beach, never on the sand or by the water.", "Supervised swimming times and locations change every summer: check the town hall's website before you go.", "“Riding home from a night out: a good idea?”", "A bike is handy for getting home when public transport is thin on the ground. But at night you see less and are less visible. A few good habits are enough.", "Choose the right route", "Choose main roads with cycle paths, which are better lit, even if it's a bit longer.", "Avoid parks and riverbanks at night: poorly lit and sometimes closed.", "Plan your route before leaving the party, not while riding.", "Make yourself visible", "Voi bikes have front and rear lights: check they work before setting off. Light-coloured clothing or a reflective armband makes all the difference. Outside built-up areas at night, a reflective vest is mandatory on a bike.", "Ride home together", "Take a bike each and ride in single file, one behind the other. Let someone know when you've arrived.", "What not to do", "Riding after drinking: on a bike too, alcohol is penalised, and above all it slows your reflexes. If you've been drinking, go home on foot, by taxi or by public transport.", "Making calls or looking at your screen while riding.", "Riding with earphones: it's banned, and you can't hear what's coming.", "Two people on one bike: one bike, one person.", "The best night out is the one you remember. If you're hesitating about taking the bike, it's not the right night.", "“Little-known Paris neighbourhoods to visit”", "On the metro you pass under neighbourhoods without seeing them. By bike you discover cobbled streets, houses with gardens and painted walls that no guidebook shows.", "The “curiosities” route (about 2 h, 13th and 14th arrondissements)", "The Butte-aux-Cailles: a real village, with its little streets, low façades and street art.", "The Cité Florale: a few streets named after flowers (rue des Glycines, rue des Orchidées), lined with houses with gardens. Get off the bike, it's tiny.", "The Parc Montsouris: a break in a large English-style park with a lake and waterfall.", "The Boulevard Vincent-Auriol: an open-air gallery of giant murals on the building façades.", "For next time", "La Mouzaïa (19th): quiet cobbled lanes lined with flowers.", "The covered passages of the 2nd (Galerie Vivienne, Passage des Panoramas): visit on foot, with the bike parked at the entrance.", "The Rue Dénoyez (20th): walls covered in ever-changing graffiti.", "These neighbourhoods are lived in: ride at walking pace, keep your voice down, and park the bike in an authorised spot before exploring on foot.", "“Which bike ride should I do in autumn?”", "Each season changes the city: the same streets look completely different in April and in December. Here's one ride per season.", "🌸 Spring: trees in blossom", "The Jardin des Plantes and its cherry trees, then the Square Jean-XXIII behind Notre-Dame. Spring is the ideal season: neither too hot nor too cold. A light jacket is enough.", "☀️ Summer: riding in the shade", "Set off early in the morning or after 6 pm. Choose the Bois de Vincennes and Bois de Boulogne and the shaded quays. Bring water, a cap and sun cream. In July and August, the banks of the Seine turn into beaches.", "🍁 Autumn: the colours", "The Buttes-Chaumont and the Bois de Vincennes are superb in October. The Jardin du Luxembourg too, but bikes aren't allowed in: park at the entrance. Bring an extra layer, and watch out for slippery wet leaves.", "🎄 Winter: the lights", "The Champs-Élysées illuminations and the department store windows on Boulevard Haussmann. Gloves, a hat under your hood and lights on: night falls early.", "Seasonal events", "June: the Fête de la Musique, on 21 June. A bike lets you hop from one concert to the next, but some streets are packed.", "Summer: Paris Plages and the open-air cinemas.", "Autumn: the Nuit Blanche, with artworks to see all over the city.", "Winter: the Christmas markets and the illuminations.", "In the rain, brake earlier and avoid road markings and cobbles, which are very slippery. Event dates change every year: check them before you go.", "The pavement is for pedestrians. Ride on cycle paths and lanes where there are any, otherwise on the road.", "What is the top speed of an e-scooter?", "E-scooters are limited to 25 km/h. Slow down near pedestrians and when the road is wet.", "How many people can ride an e-scooter?", "Just one", "Two if the second one is a child", "Two adults maximum", "One e-scooter means one person. With two, balance and braking become dangerous.", "During the ride, what should you do with your earphones and phone?", "One earphone is allowed", "Phone in hand to follow the GPS", "Put them away: both are banned while riding", "Earphones and holding a phone are banned. You need to hear and see what's going on around you.", "A helmet is…", "Pointless in town", "Strongly recommended, and mandatory outside built-up areas", "Only for bikes", "A helmet greatly reduces the severity of head injuries. Outside built-up areas, it is mandatory on an e-scooter.", "From what age can you ride an e-scooter in France?", "12", "14", "16", "The legal minimum age is 14. The Voi app may require a higher minimum age to rent.", "After drinking alcohol, what does the rule say?", "The same limits as for drivers apply", "There's no limit on an e-scooter", "Only cannabis is banned", "Alcohol and drugs are banned on handlebars just as behind the wheel. After a night out, get home another way.", "Before setting off, what do you check?", "Nothing, the vehicle is bound to be in good condition", "Only the battery", "The brakes, tyres and lights", "A quick look is enough. If something is wrong, choose another vehicle and report the problem in the app.", "At the end of your ride, where should you park?", "In the middle of the pavement, it's more visible", "In an authorised parking zone shown in the app", "In front of a building entrance", "Only park in authorised zones, without blocking pedestrians, wheelchairs or pushchairs.", "At night, how do you make sure others see you?", "Turn on the lights and wear reflective clothing or a vest", "Ring the bell regularly", "Ride in the middle of the road", "Lights on and reflective gear. Outside built-up areas, a reflective vest is mandatory at night.", "✓ Correct!", "✗ Not quite.", "See my score", "Next question →", "Perfect! You're ready to ride safely.", "Very good! Review the few points you missed before your next ride.", "Take a moment to reread the rules: your safety depends on it.", "Retake the quiz", "Review the rules", "Address not found", "Add your destination to see the route.", "No Voi bike near your starting point.", "Calculating route…", "Keep typing the address…", "Checking…", "Finding the nearest bike…", "No Voi bike at this address", "Bike and parking zone shown as an example: available bikes in real time are in the Voi app.", "You are here", "Return the bike", "See the detailed street map →", "Users and rides", "Time saved", "Voi's home city", "Inner Paris (75001 → 75020)", "Shared e-scooters aren't allowed in Paris: Voi only offers e-bikes there.", "+ 16 other municipalities in the urban area", "+ 18 other municipalities (phased rollout)", "The service covers 17 municipalities in the Grenoble area. The detailed zone map is in the app.", "Rolled out in 3 phases: 6 municipalities at launch, then all 24 municipalities of the metropolitan area on 1 January 2027. E-scooters will join the offer from April 2027.", "Drop-off zones and no-go zones (especially near the docks) are shown in the app.", "12 municipalities served in total. Verneuil-sur-Seine and Vernouillet consulted their residents in November 2026 about bringing in the service.", "Available vehicles and exact parking zones are shown in real time in the Voi app.", "Marseille's 16 arrondissements", "voi.com prices in 8 German cities", "voi.com prices in the UK", "voi.com prices in Sweden", "voi.com prices in Norway", "voi.com price in Denmark", "2026 prices in Finland", "voi.com prices in Switzerland", "voi.com price in Austria", "voi.com prices in Italy", "voi.com price in Spain", "Voi's 2026 European range", "prices in Belgium", "customer reviews 2026", "University of Glasgow", "Voi (October 2025 launch) and Paris press", "GPS&O urban community (May 2026)", "Made in Marseille (July 2026)", "voi.com and Mobilités M", "voi.com and TV78", "voi.com, Tendance Ouest and ICI Normandie", "Infos Yvelines (Sept. 2026)", "KTH study", "", "GPS&O urban community", "What Voi offers"], "es": ["Nuestros países", "Seguridad", "Preguntas frecuentes", "Descargar la app", "Voi en Europa", "¿En qué países puedes circular con", "Bicicletas y patinetes eléctricos compartidos en más de 130 ciudades europeas. Elige un país en el mapa o en la lista para ver las ciudades con servicio.", "países presentados", "ciudades en Europa", "vehículos", "trayectos realizados", "Ciudad con servicio Voi", "Distrito / municipio", "Ciudad seleccionada", "Tercer mercado de Voi en 2026: bicicletas eléctricas en París y Nantes, bicicletas y patinetes en Marsella, Grenoble, Le Havre y las Yvelines.", "Ver ciudades ▾", "El primer mercado de Voi, con más de 50 ciudades activas: de Berlín, capital europea de la micromovilidad, a Magdeburgo, donde Voi es el operador exclusivo.", "Bicicletas y patinetes eléctricos en Londres y en las grandes ciudades universitarias, además de una red de bicicletas eléctricas en Escocia.", "El país natal de Voi, fundada en Estocolmo en 2018. Aquí se desplegó primero la nueva generación de vehículos 2026.", "Patinetes Voi en Oslo (también reservables en la app Ruter), Bergen, Trondheim y Drammen.", "Patinetes Voi de norte a sur de la península: Milán, Roma, Turín, Bolonia, Génova, Nápoles…", "Patinetes eléctricos Voi en las principales ciudades finlandesas, entre ellas Helsinki y Vantaa, donde Voi es uno de los operadores autorizados.", "Voi está presente en 16 ciudades y municipios suizos. Zúrich fue la primera ciudad del país en recibir la bicicleta eléctrica Explorer 4.", "Presente desde 2019 en Aarhus y Aalborg, Voi vuelve a Copenhague con 4.500 bicicletas eléctricas.", "Patinetes eléctricos Voi en Andalucía y Madrid.", "Patinetes eléctricos Voi en Lisboa y Oporto.", "Bicicletas y patinetes eléctricos Voi en Bruselas y Amberes.", "Más de 2 millones de trayectos Voi en Viena, y una nueva ciudad en 2026: Innsbruck.", "13.º país de Voi desde abril de 2026: 800 bicicletas (eléctricas y clásicas) en las regiones de Amersfoort y Gooi & Vechtstreek. Puedes coger una bici en un municipio y dejarla en otro.", "Voi todavía no está aquí. Abre la aplicación para comprobar la cobertura a tu alrededor.", "Cómo funciona", "Descarga la app", "Gratis en App Store y Google Play. Crea tu cuenta y añade un método de pago.", "Encuentra y escanea", "El mapa muestra los vehículos disponibles a tu alrededor. Escanea el código QR para desbloquear.", "Circula y aparca", "Termina en una zona de aparcamiento autorizada, haz una foto y listo.", "¿Listo para circular?", "Descarga la aplicación Voi y encuentra el vehículo más cercano.", "© Voi Technology — Bicicletas y patinetes eléctricos compartidos en Europa", "Cobertura y tarifas en tiempo real: consulta la aplicación Voi.", "Voi — inicio", "País o ciudad (p. ej., Múnich, Rezé…)", "Buscar un país o una ciudad", "Voi en Europa — Nuestros países", "Ayuda", "Preguntas", "frecuentes", "Todo lo que debes saber antes de tu primer trayecto con Voi: registro, desbloqueo, tarifas, seguridad y asistencia.", "Todas", "Primeros pasos", "Durante el trayecto", "Tarifas y pago", "Problemas y asistencia", "¿Cómo empiezo a usar Voi?", "Descarga la aplicación Voi en App Store o Google Play, crea tu cuenta con tu número de teléfono o tu correo electrónico y añade un método de pago. Después podrás encontrar un vehículo en el mapa y salir.", "¿Qué edad hay que tener para alquilar un vehículo Voi?", "En general hay que tener 18 años. En algunos países o ciudades la edad mínima puede ser distinta: se indica en la aplicación al registrarte.", "¿Hace falta carné de conducir?", "No, no hace falta carné para alquilar una bicicleta o un patinete Voi. En algunos países, sin embargo, la aplicación puede pedir una verificación de identidad.", "¿En qué ciudades está disponible Voi?", "Voi está presente en más de 130 ciudades de 14 países europeos. Consulta «Nuestros países» o abre la aplicación para ver los vehículos disponibles a tu alrededor.", "¿Cómo desbloqueo una bicicleta o un patinete?", "Abre la aplicación, elige un vehículo en el mapa y escanea el código QR del manillar. El vehículo se desbloquea en unos segundos.", "¿Puedo reservar un vehículo con antelación?", "Según la ciudad, la aplicación permite reservar un vehículo durante unos minutos, el tiempo de llegar hasta él. La opción aparece al seleccionar un vehículo.", "¿Puedo hacer una pausa durante el trayecto?", "En muchas ciudades puedes pausar el trayecto desde la aplicación: el vehículo queda bloqueado y reservado para ti. La pausa se sigue cobrando, a la tarifa indicada en la app.", "¿Por dónde puedo circular?", "Por los carriles bici cuando los haya y, si no, por la calzada. La acera está prohibida. Algunas zonas de la ciudad limitan la velocidad o prohíben circular: aparecen en color en el mapa de la aplicación.", "¿Cómo termino el trayecto?", "Aparca en una zona de aparcamiento autorizada indicada en la aplicación, pulsa «Terminar trayecto» y haz una foto del vehículo bien aparcado. El trayecto queda cerrado y cobrado.", "¿Cuánto cuesta un trayecto?", "El precio depende de la ciudad: en general, un coste de desbloqueo y un precio por minuto. Por ejemplo, 0,25 €/min sin desbloqueo en París, 0,49 € + 0,25 €/min en Grenoble, 1 € + 0,20 €/min en Marsella: cada página de ciudad detalla sus tarifas.", "¿Hay pases o suscripciones?", "Sí, según la ciudad la aplicación ofrece pases (por día, por mes…) y bonos de minutos que salen más baratos si circulas a menudo. Los encontrarás en la sección correspondiente de la aplicación.", "¿Qué métodos de pago se aceptan?", "La tarjeta bancaria y, según el país, Apple Pay, Google Pay u otros métodos de pago locales. Los añades y gestionas en la aplicación.", "¿Por qué me han cobrado gastos adicionales?", "Se pueden aplicar gastos si el vehículo se aparca fuera de una zona autorizada o se abandona fuera de la zona de servicio. El detalle de cada trayecto está en tu historial. Si tienes dudas, contacta con la asistencia desde la aplicación.", "¿Es obligatorio el casco?", "Es muy recomendable en cada trayecto y obligatorio en algunos casos, por ejemplo en patinete fuera de poblado en Francia. Voi no proporciona casco: acuérdate de llevar el tuyo.", "¿Se puede ir dos en un patinete?", "No. Un vehículo Voi solo lleva a una persona, sin pasajero ni niño.", "¿Puedo circular con lluvia o de noche?", "Sí, pero con prudencia: reduce la velocidad en suelo mojado, porque la distancia de frenado aumenta. De noche, las luces se encienden automáticamente; si puedes, lleva ropa reflectante.", "Repasar las normas de seguridad →", "¿Qué hago en caso de accidente?", "Ponte a salvo y llama a emergencias si alguien está herido (112 en toda Europa). Después, informa del accidente a Voi desde la sección de ayuda de la aplicación.", "El vehículo está dañado o no funciona, ¿qué hago?", "No lo uses. Informa del problema desde la aplicación (ficha del vehículo o sección de ayuda) y elige otro vehículo. Tus avisos ayudan a los equipos de Voi a intervenir rápido.", "La batería está casi vacía, ¿qué pasa?", "El nivel de batería de cada vehículo se muestra antes de desbloquearlo. Si baja durante el trayecto, la velocidad puede reducirse: termina el trayecto en una zona autorizada y coge otro vehículo.", "Mi trayecto no termina, ¿qué hago?", "Comprueba que estás en una zona de aparcamiento autorizada y que el teléfono tiene cobertura y la ubicación activada. Si el problema continúa, contacta con la asistencia desde la aplicación sin dejar el vehículo.", "Me he olvidado algo en un vehículo o necesito ayuda", "Contacta con la asistencia de Voi desde la sección de ayuda de la aplicación, indicando el trayecto en cuestión.", "¿Cómo elimino mi cuenta?", "Puedes solicitar la eliminación de tu cuenta desde los ajustes de la aplicación o contactando con la asistencia.", "Categorías", "Preguntas frecuentes | Voi", "Circula", "seguro", ", en cada trayecto", "Bicicleta o patinete eléctrico: unas normas sencillas te protegen a ti y a los demás. Repásalas y ponte a prueba con nuestro quiz.", "Por el carril bici", "Circula por los carriles bici y, si no, por la calzada. Nunca por la acera.", "25 km/h como máximo", "Adapta la velocidad al tráfico, a los peatones y al estado de la vía.", "Una sola persona", "Un vehículo, una persona: sin pasajero ni niño delante.", "Oídos y manos libres", "Los auriculares y el teléfono en la mano están prohibidos durante el trayecto.", "Siempre con casco", "Muy recomendable en la ciudad, obligatorio fuera de poblado.", "Aparca bien", "Solo en las zonas de aparcamiento indicadas en la aplicación.", "El quiz de seguridad", "10 preguntas para comprobar que conoces las normas. Una explicación después de cada respuesta.", "Empezar el quiz →", "Circula seguro con Voi", "Pregunta 1 de 10", "Puntuación: 0", "En la ciudad, ¿por dónde debes circular con un patinete eléctrico?", "Por la acera, con cuidado con los peatones", "Por los carriles bici y, si no, por la calzada", "Por donde quiera, mientras vaya despacio", "Quiz de seguridad — Voi", "vehículos (estimación)", "territorios", "municipios", "bicicletas eléctricas", "6.000 bicicletas eléctricas nuevas en los 20 distritos.", "Nuevo", "Bicicletas eléctricas", "Patinetes y bicicletas eléctricas, del Puerto Viejo a los barrios del norte.", "Patinetes", "Bicicletas y patinetes en 17 municipios del área metropolitana, incluso con tus esquís.", "La nueva bicicleta compartida de los 24 municipios del área metropolitana.", "Patine l Ayuntamiento.", "En Bonjour RATP", "Las bicicletas Voi de Île-de-France también se alquilan directamente desde la app Bonjour RATP.", "Asistencia eléctrica", "Las cuestas de Montmartre o Belleville, sin llegar sudando a la oficina.", "Zona de servicio", "👆 Haz clic en un distrito para ampliarlo en el mapa.", "Los 20 distritos", "Las bicicletas están disponibles en todo el municipio de París, en los 20 distritos.", "Normas locales", "Sin patinetes compartidos", "Están prohibidos en París: Voi solo ofrece bicicletas.", "Aparcamiento de bicicletas", "Solo en plazas para bicicletas sin aparcabicis, o en aparcabicis en grupos de al menos 4 (desde el 1 de octubre de 2025).", "Solo, sin auriculares", "Sin pasajero, sin auriculares ni teléfono en la mano durante el trayecto.", "Casco", "Obligatorio en patinete fuera de poblado (con chaleco reflectante); en bicicleta, obligatorio para menores de 12 años. Recomendado para todos.", "🅿️ Las zonas de aparcamiento, las zonas lentas y las zonas prohibidas exactas aparecen en el mapa de la aplicación Voi: prevalecen sobre este resumen. Normas recopiladas en noviembre de 2026 · Fuentes:", "Ayuntamiento de París", "El blog", "Ideas de salidas en bici", "🇫🇷 En Francia", "En familia", "Los mejores paseos en bici en familia por París", "Tres recorridos casi sin coches, con parques infantiles y zonas de pícnic.", "3 recorridos tranquilos · de 2 a 6 km", "Leer el artículo →", "Salida", "¿Qué hacer un domingo soleado en bici?", "Orillas, mercados, brunchs y calles sin coches: nuestras ideas ciudad por ciudad.", "1 idea por ciudad Voi en Francia", "En pareja", "Una cita original en bici: rutas románticas", "Atardeceres, miradores y un helado por el camino: una cita diferente.", "París · 1 h de paseo", "Escapada urbana", "Visitar una ciudad en bici cuando solo tienes un día", "Lo imprescindible, un rincón poco conocido y el orden correcto para evitar cuestas y multitudes.", "Ejemplo: Marsella en 1 día", "Foto", "Los mejores lugares para ha no", "Está prohibido hablar por teléfono mientras circulas.", "Ayuntamiento de Viena", "Nunca por la acera: aparca en las plazas rojas marcadas en el suelo; si no las hay, deja el patinete en la fila de aparcamiento (multa de 25 €).", "Casco obligatorio hasta los 16 años. Desde el 1 de mayo de 2026.", "Las bicicletas Voi siguen el código de circulación de los ciclistas: carril bici siempre que exista.", "De un municipio a otro", "Puedes coger una bicicleta en un municipio y dejarla en otro de la zona.", "«¿Qué recorrido en bici hacer con niños en París sin peligro?»", "Con niños, el buen recorrido es corto, llano, lejos de los coches y con pausas. Aquí tienes tres paseos que cumplen todos los requisitos, en París.", "1. La dársena de la Villette y el parque de la Villette", "Distancia: unos 2,5 km de Stalingrad al parque de la Villette, solo ida.", "Nivel: muy fácil, todo llano.", "Lo mejor: los muelles de la dársena están cerrados a los coches y el parque tiene grandes jardines de juegos, entre ellos el famoso tobogán del Dragón.", "Para ir más lejos, el carril bici sigue a lo largo del canal de l'Ourcq hacia Pantin. Atención: la zona Voi de París termina en los límites de la ciudad. Vuelve a aparcar la bicicleta en París para terminar el alquiler.", "2. La vuelta al lago Daumesnil, bosque de Vincennes", "Distancia: unos 2 km para la vuelta al lago, hasta 6 km si sigues por el bosque.", "Nivel: fácil.", "Lo mejor: alquiler de barcas en el lago, grandes praderas para hacer pícnic y el Parc Floral muy cerca.", "3. Las orillas peatonales del Sena", "Distancia: unos 2 km por la orilla izquierda (del museo de Orsay al puente del Alma) y 3 km por la derecha (de las Tullerías hacia el Ayuntamiento).", "Nivel: fácil, pero muy concurrido los fines de semana.", "Lo mejor: vistas a los monumentos, sin ningún coche. Circula al paso: los peatones tienen prioridad.", "¿A qué edad puede un niño seguirte en su bicicleta?", "No hay una edad oficial. En general, un niño que se maneja bien en bici, sabe frenar y parar cuando se lo pides puede seguirte por una vía separada hacia los 6 o 7 años, y en la ciudad, por carril bici, más bien hacia los 9 o 10. Ponlo delante de ti para no perderlo de vista.", "💡 Conviene saber", "El casco es obligatorio en bicicleta para los menores de 12 años, tanto si pedalean como si van de pasajeros. Una bicicleta Voi solo lleva a una persona: el niño va en su propia bicicleta. La edad mínima para alquilar una bicicleta Voi se indica en la aplicación.", "Foto:", "Cerrar", "«Idea de salida en bici el domingo cerca de casa»", "El domingo la ciudad está más tranquila y es el mejor momento para redescubrirla en bici. Aquí tienes una idea de salida en cada ciudad donde Voi está presente en Francia.", "Una idea por ciudad", "París: los domingos, algunas calles y barrios se reservan a peatones y bicicletas (operación «Paris Respire»). Ideal para pasear del canal Saint-Martin a Montmartre.", "Nantes: remonta el Erdre desde el centro hasta la isla de Versailles y su jardín japonés, y sigue el río hacia el norte.", "Marsella: la Corniche Kennedy, del Puerto Viejo a las playas del Prado, con parada en el Vallon des Auffes.", "Grenoble: los muelles del Isère al pie de la Bastilla y después el parque Paul-Mistral.", "Le Havre: el paseo marítimo, de la playa a Sainte-Adresse, frente al mar.", "Saint-Quentin-en-Yvelines: la vuelta a la isla de ocio y su estanque.", "Mercados, merenderos y brunchs", "Los domingos por la mañana la mayoría de los barrios tienen mercado: es la ocasión de llenar la cesta para un pícnic. A mediodía, busca una terraza junto al agua; en verano, los merenderos vuelven a abrir junto a canales y ríos.", "Las calles sin coches", "Muchas ciudades cierran algunas calles a los coches los domingos u organizan un «día sin coches» una vez al año. Las fechas cambian cada año: consulta la web de tu ayuntamiento antes de salir.", "El domingo, las bicicletas vuelan cerca de los parques y las orillas. Abre la aplicación un poco antes para localizar la más cercana.", "«Idea de cita original en París»", "Una cita en bici es más relajada que una cena a solas: se charla pedaleando, se para donde se quiere y la ciudad hace de decorado.", "Los atardeceres más bonitos", "La plaza del Vert-Galant, en la punta de la isla de la Cité, a ras del agua.", "El puente Alejandro III, con la Torre Eiffel y los Inválidos a cada lado.", "El parque de Belleville, una de las mejores vistas de todo París.", "El Sagrado Corazón: la subida es empinada, pero la asistencia eléctrica hace el trabajo.", "Dónde parar", "Para tomar algo, los muelles del canal Saint-Martin y de la dársena de la Villette están animados hasta la noche. Para un pícnic, lleva un mantel e instálate en las orillas del Sena o en el Campo de Marte.", "La fórmula «1 hora, 1 paseo, 1 helado»", "Salida del jardín de las Tullerías.", "Los muelles de la orilla derecha hasta el Ayuntamiento, unos 15 minutos.", "Cruce hacia la isla de San Luis, famosa por sus heladerías.", "Vuelta tranquila por los muelles de la orilla izquierda hasta el museo de Orsay.", "Aparca las bicicletas antes de instalarte: en los muelles y las islas, usa las plazas autorizadas indicadas en la aplicación.", "«¿Qué ver en Marsella en 1 día?»", "Un día basta para ver lo esencial de una ciudad en bici, siempre que elijas bien el orden de las visitas. Ejemplo: Marsella, donde Voi ofrece bicicletas y patinetes.", "El circuito", "9 h · El Puerto Viejo, antes de la multitud: el mercado de pescado del muelle.", "10 h · El Mucem y el fuerte Saint-Jean, bordeando el puerto.", "11 h · Le Panier, el barrio más antiguo de la ciudad. Sus callejuelas están en pendiente y a menudo con escaleras: aparca la bici abajo y visítalo a pie.", "14 h · La Corniche Kennedy, junto al mar, hasta el Vallon des Auffes.", "16 h · Las playas del Prado y el parque Borély para terminar con calma.", "El rincón poco conocido", "El Vallon des Auffes, un pequeño puerto de pescadores escondido bajo la corniche, con sus casetas y barcas de colores. Se baja por una escalera: deja la bici en la corniche.", "El orden que evita cuestas y multitudes", "Empieza por el centro a primera hora, cuando hace fresco y hay poca gente, y sigue el mar hacia el sur: la corniche es casi llana. Notre-Dame-de-la-Garde es la única subida de verdad; con asistencia eléctrica se puede, pero déjala para el final de la mañana, antes del calor.", "Dónde comer", "Alrededor del Puerto Viejo para comer, o un pícnic frente al mar en la corniche. En el Vallon des Auffes hay restaurantes de pescado.", "En Marsella, los patinetes se aparcan en estaciones. Nunca dejes un vehículo junto al agua, en el Puerto Viejo o la corniche.", "«¿Dónde hacer buenas fotos en París?»", "La bici es ideal para la fotografía: se encadenan los lugares sin buscar el metro y se puede volver cuando la luz es mejor.", "El circuito, en orden", "El Trocadéro al amanecer, para la Torre Eiffel sin multitudes.", "El puente de Bir-Hakeim y su hilera de columnas, por la mañana.", "El puente Alejandro III, con la luz suave del final de la mañana.", "La pirámide del Louvre, temprano o tarde para los reflejos.", "La plaza del Vert-Galant, en la punta de la isla de la Cité.", "La plaza de los Vosgos y sus soportales, a mediodía a la sombra.", "El canal Saint-Martin, sus pasarelas y esclusas, por la tarde.", "El parque de Belleville, vista de todo París al final del día.", "Las escaleras de Montmartre, a la hora dorada.", "El Sagrado Corazón, al atardecer.", "Consejos", "La «hora dorada», aproximadamente una hora después del amanecer y antes del atardecer, da la luz más bonita.", "Aparca la bici antes de sacar la cámara: nunca hagas fotos circulando.", "En las calles habitadas y muy fotografiadas, sé discreto y respeta a los vecinos.", "Haz el circuito en dos veces: por la mañana el oeste (Trocadéro, puentes, Louvre) y por la tarde el este y el norte (canal, Belleville, Montmartre).", "«¿Cuántas calorías se queman en bicicleta eléctrica?»", "Se suele pensar que la asistencia eléctrica lo hace todo. En realidad, hay que pedalear para que funcione: la bicicleta eléctrica sigue siendo una actividad física.", "Lo que dicen los estudios", "Los estudios europeos sobre movilidad muestran que los usuarios de bicicleta eléctrica hacen trayectos más largos y frecuentes que los ciclistas clásicos. En total, su actividad física semanal es comparable. El esfuerzo por minuto es menor, pero se circula más a menudo.", "En cuanto a calorías, todo depende del nivel de asistencia, del peso y del relieve: cuenta, como orden de magnitud, unos cientos de kilocalorías por hora, menos que en bicicleta clásica y mucho más que sentado en el metro.", "La Organización Mundial de la Salud recomienda al menos 150 minutos de actividad moderada a la semana. Dos trayectos de 15 minutos por día laborable bastan para alcanzarlos.", "Retos sencillos", "Sustituir 2 trayectos a la semana por la bici, por ejemplo el lunes y el viernes.", "Bajarse una parada antes y terminar en bici.", "Subir una colina bajando la asistencia: Montmartre, la Bastilla en Grenoble, Notre-Dame-de-la-Garde en Marsella.", "Anotar los trayectos durante un mes para ver cómo se acumulan los kilómetros.", "Ejemplo (ficticio)", "«Hacía Bastilla – Canal Saint-Martin en metro. Ahora lo hago en bici: 11 minutos, y ya no espero en el andén». — Camille, 29 años. Este testimonio es un ejemplo inventado para ilustrar el artículo.", "Empieza poco a poco: uno o dos trayectos cortos la primera semana y después aumenta. Lo importante es la regularidad.", "«¿Dónde relajarse junto al agua cerca de Grenoble?»", "No hace falta ir lejos para respirar aire puro: en cada ciudad Voi hay un rincón de agua o naturaleza a menos de 30 minutos en bici.", "Por ciudad", "Grenoble: las orillas del Isère y el parque Paul-Mistral para hacer pícnic frente a las montañas; el jardín de la ciudad al pie de la Bastilla.", "París: la dársena de la Villette, con baño vigilado en verano; desde 2025 también abren zonas de baño en el Sena en verano. El bosque de Vincennes y sus lagos para el pícnic.", "Nantes: las orillas del Erdre y la isla de Versailles; junto al Loira, las terrazas y merenderos de la isla de Nantes.", "Marsella: las playas del Prado y de los Catalanes, a pocos minutos del centro; el parque Borély para la sombra.", "Qué llevar", "Una mochila: las bicicletas Voi no tienen silla infantil ni remolque.", "Agua, crema solar, un mantel.", "Una bolsa para llevarte la basura.", "Dónde dejar la bici en el lugar", "Antes de salir, comprueba en la aplicación que tu lugar de llegada está en la zona Voi y localiza la zona de aparcamiento más cercana. Aparca a la entrada del parque o de la playa, nunca en la arena ni junto al agua.", "Los horarios y lugares de baño vigilado cambian cada verano: consulta la web del ayuntamiento antes de desplazarte.", "«Volver de fiesta en bici, ¿buena idea?»", "La bici es práctica para volver cuando escasea el transporte. Pero de noche se ve menos y te ven menos. Bastan unos cuantos reflejos.", "Elegir la ruta adecuada", "Prefiere las grandes avenidas con carril bici, mejor iluminadas, aunque sea un poco más largo.", "Evita los parques y las orillas de noche: poco iluminados y a veces cerrados.", "Planifica tu ruta antes de salir de la fiesta, no mientras circulas.", "Hacerse visible", "Las bicicletas Voi tienen luces delanteras y traseras: comprueba que funcionan antes de salir. Una prenda clara o un brazalete reflectante lo cambian todo. Fuera de poblado, de noche, el chaleco reflectante es obligatorio en bicicleta.", "Volver en grupo", "Coged cada uno una bici y circulad en fila, uno detrás de otro. Avisa a alguien cuando hayas llegado.", "Lo que no hay que hacer", "Circular después de beber: en bicicleta también se sanciona el alcohol y, sobre todo, ralentiza los reflejos. Si has bebido, vuelve a pie, en taxi o en transporte público.", "Hablar por teléfono o mirar la pantalla mientras circulas.", "Circular con auriculares: está prohibido y no oyes lo que viene.", "Ir dos en una bicicleta: una bici, una persona.", "La mejor noche es la que se recuerda. Si dudas en coger la bici, es que no es la noche adecuada.", "«Barrios poco conocidos de París que visitar»", "En metro pasas por debajo de los barrios sin verlos. En bici descubres calles adoquinadas, casas con jardín y muros pintados que ninguna guía muestra.", "El recorrido «curiosidades» (unas 2 h, distritos 13 y 14)", "La Butte-aux-Cailles: un auténtico pueblo, con sus callejuelas, fachadas bajas y obras de arte urbano.", "La Cité Florale: unas cuantas calles con nombres de flores (rue des Glycines, rue des Orchidées), bordeadas de casas con jardín. Bájate de la bici, es diminuta.", "El parque Montsouris: pausa en un gran parque de estilo inglés, con lago y cascada.", "El bulevar Vincent-Auriol: una galería de murales gigantes al aire libre en las fachadas de los edificios.", "Para la próxima vez", "La Mouzaïa (distrito 19): callejones adoquinados y floridos, tranquilos.", "Los pasajes cubiertos del distrito 2 (galería Vivienne, pasaje de los Panoramas): para visitar a pie, con la bici aparcada a la entrada.", "La calle Dénoyez (distrito 20): muros cubiertos de grafitis que cambian sin parar.", "Estos barrios están habitados: circula al paso, habla bajo y aparca la bici en una plaza autorizada antes de pasear a pie.", "«¿Qué paseo en bici hacer en otoño?»", "Cada estación cambia la ciudad: las mismas calles tienen otra cara en abril y en diciembre. Aquí tienes un paseo por estación.", "🌸 Primavera: los árboles en flor", "El Jardín de las Plantas y sus cerezos, y después la plaza Jean-XXIII, detrás de Notre-Dame. La primavera es la estación ideal: ni demasiado calor ni demasiado frío. Basta una chaqueta ligera.", "☀️ Verano: circular a la sombra", "Sal temprano por la mañana o después de las 18 h. Prefiere los bosques de Vincennes y de Boulogne y los muelles con sombra. Lleva agua, una gorra y crema solar. En julio y agosto, las orillas del Sena se convierten en playas.", "🍁 Otoño: los colores", "Los Buttes-Chaumont y el bosque de Vincennes están preciosos en octubre. El jardín de Luxemburgo también, pero las bicis no pueden entrar: aparca a la entrada. Lleva una capa más y cuidado con las hojas mojadas, que resbalan.", "🎄 Invierno: las luces", "La iluminación de los Campos Elíseos y los escaparates de los grandes almacenes del bulevar Haussmann. Guantes, gorro bajo la capucha y luces encendidas: anochece pronto.", "Los eventos de temporada", "Junio: la Fiesta de la Música, el 21 de junio. La bici permite pasar de un concierto a otro, pero algunas calles están abarrotadas.", "Verano: Paris Plages y los cines al aire libre.", "Otoño: la Noche Blanca, con obras para ver por toda la ciudad.", "Invierno: los mercadillos de Navidad y la iluminación.", "Con lluvia, frena antes y evita las marcas viales y los adoquines, muy resbaladizos. Las fechas de los eventos cambian cada año: compruébalas antes de salir.", "La acera es para los peatones. Se circula por los carriles bici cuando los hay y, si no, por la calzada.", "¿Cuál es la velocidad máxima de un patinete eléctrico?", "Los patinetes eléctricos están limitados a 25 km/h. Reduce la velocidad cerca de los peatones y con la calzada mojada.", "¿Cuántas personas pueden subir a un patinete?", "Solo una", "Dos si la segunda es un niño", "Dos adultos como máximo", "Un patinete es para una sola persona. Con dos, el equilibrio y la frenada se vuelven peligrosos.", "Durante el trayecto, ¿qué haces con los auriculares y el teléfono?", "Un solo auricular está permitido", "El teléfono en la mano para seguir el GPS", "Guardarlos: los dos están prohibidos circulando", "Los auriculares y el teléfono en la mano están prohibidos. Debes oír y ver lo que pasa a tu alrededor.", "El casco es…", "Inútil en la ciudad", "Muy recomendable y obligatorio fuera de poblado", "Solo para las bicicletas", "El casco reduce mucho la gravedad de las lesiones en la cabeza. Fuera de poblado, es obligatorio en patinete.", "¿A partir de qué edad se puede conducir un patinete eléctrico en Francia?", "12 años", "14 años", "16 años", "La edad mínima legal es de 14 años. La aplicación Voi puede exigir una edad mínima más alta para alquilar.", "Después de beber alcohol, ¿qué dice la norma?", "Se aplican los mismos límites que a los automovilistas", "No hay límite en patinete", "Solo está prohibido el cannabis", "El alcohol y las drogas están prohibidos tanto en el manillar como al volante. Después de una fiesta, vuelve de otra forma.", "Antes de arrancar, ¿qué compruebas?", "Nada, el vehículo está seguro en buen estado", "Solo la batería", "Los frenos, los neumáticos y las luces", "Basta un vistazo rápido. Si algo no va bien, elige otro vehículo e informa del problema en la aplicación.", "Al final del trayecto, ¿dónde aparcas el vehículo?", "En medio de la acera, se ve más", "En una zona de aparcamiento autorizada indicada en la app", "Delante de la entrada de un edificio", "Aparca solo en las zonas autorizadas, sin molestar a peatones, sillas de ruedas o carritos.", "De noche, ¿cómo te ven los demás?", "Encender las luces y llevar ropa o chaleco reflectante", "Tocar el claxon a menudo", "Circular por el centro de la calzada", "Luces encendidas y equipo reflectante. Fuera de poblado, el chaleco reflectante es obligatorio de noche.", "✓ ¡Respuesta correcta!", "✗ No del todo.", "Ver mi puntuación", "Siguiente pregunta →", "¡Perfecto! Estás listo para circular con total seguridad.", "¡Muy bien! Repasa los pocos puntos fallados antes de tu próximo trayecto.", "Tómate un momento para releer las normas: tu seguridad depende de ello.", "Repetir el quiz", "Repasar las normas", "Dirección no encontrada", "Añade tu destino para ver el trayecto.", "No hay ninguna bicicleta Voi cerca de tu punto de salida.", "Calculando el trayecto…", "Sigue escribiendo la dirección…", "Comprobando…", "Buscando la bicicleta más cercana…", "No hay bicicletas Voi en esta dirección"
